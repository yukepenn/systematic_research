- id: ES_PORTABILITY
  phase: 5
  status: failed
  result: >
    Blind transfer of the NQ-calibrated parameter to ES loses money. ES vol-adaptive
    ensemble Sharpe -0.329, net -$12,455, 8/13 cells positive, P(Sharpe<=0) = 0.829.
    ES price-proportional is far worse (-1.920), consistent with H-014. The SHAPE travels
    (Spearman rank corr of Sharpe across the grid, NQ vs ES = 0.780; both prefer wider
    thresholds) but the LEVEL does not: the profitable region shifts up to k >= 18 on ES,
    mechanically consistent with ES's $12.50 tick vs NQ's $5 making friction 2.5x larger
    per sigma unit. Per constitution section 16 this earns a large overfitting penalty,
    applied rather than explained away. Fitting k separately per instrument was NOT done.
