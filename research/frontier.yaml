    fails Harvey-Liu at N=1000). See research/06_red_team/RED_TEAM_WAVE1C_WAVE2.md.
  result: >
    S = k*sigma frozen at trend birth. Ensemble Sharpe 1.010 vs fixed 0.814, DD -$39,126
