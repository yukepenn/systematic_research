    applied rather than explained away. Fitting k separately per instrument was NOT done.
- id: TYPE0_ATTRIBUTION_AND_SLEEVES
  phase: 2
  status: passed
  result: >
    Possible only after the complete RE02 recovery; run in pure Python at zero engine time
