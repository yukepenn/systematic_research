    Wave-index conditioning shows monotone per-trade economics through wave 4
    ($26/$53/$76/$151) - the last untested live signal in the model.
- id: C2_TYPE3_REENTRY_SLEEVE
  phase: 2
  status: inconclusive
  result: >
    Best point estimates in the campaign but not certifiable. On its own 19,606 trades:
    mean +$24.89, naive iid t = 2.432 (p = 0.0075), but the SESSION-BLOCK bootstrap that
