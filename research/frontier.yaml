    contribute $111k/$125k/$136k while SM 200 is slightly negative). 7/8 cells positive.
    Must be re-tested on an ADAPTIVE core (it was only tested on a fixed one) and on ES.
- id: DSR_UNDER_PREREGISTERED_RULE
  phase: 0
  status: inconclusive
  result: >
    Applied research/registry/TRIAL_ACCOUNTING_RULE.md (written BEFORE recomputation) to
    all 213 inspected trials: N_eff = 5 clusters, cluster-representative Sharpe variance
    0.645, benchmark expected-max Sharpe 0.958. DSR = 0.454 (R4-21), 0.538 (adaptive),
    0.545 (combo) - all far below the R7 bar of 0.90. Harvey-Liu haircut Sharpe 0.000 for
    every candidate; none passes BHY. SENSITIVITY (reported, NOT used for promotion):
    removing the mechanically-broken arms collapses V to 0.027 and lifts every DSR to 0.96.
    The answer is dominated by a judgement call about which failed experiments count as
    trials, not by the data. CONCLUSION: deflation cannot adjudicate this edge in either
    direction; promotion must rest on structure, mechanism and portability - exactly as the
    preregistered rule anticipated in writing.
- id: C2_SLEEVE_INTERACTION_TEST
  phase: 2
  status: failed
  result: >
    The Type-3 re-entry sleeve does NOT stack on an adaptive core - it destroys it.
    R5 alone Sharpe 0.994 / net $198,059 / DD -$39,126 / positive all 5 years; R5+C2
    Sharpe 0.592 / net $147,931 / DD -$45,278 / 2025 turns NEGATIVE. Paired block
    bootstrap dSharpe -0.402, P(d<=0) = 0.879. A sleeve whose sign flips when the core's
    threshold rule changes is exploiting an interaction, not capturing a robust effect.
    C2 is therefore REJECTED as a general improvement despite its strong showing on a
    fixed core. Mechanism: on the fixed core the re-entries concentrated in the wide
    cells; the adaptive core already sits at an effectively wide threshold, so only the
    friction on 10,000+ marginal trades remains.
- id: WAVE_INDEX_CONDITIONING
  phase: 2
  status: failed
  result: >
    No exploitable signal. Requiring a minimum wave index for re-entries gives Sharpe
    0.81/0.81/0.54/0.86/0.54/0.65/0.55/0.93 across MinWave 1..8 - non-monotone and
    indistinguishable from noise on a shrinking trade count. The monotone per-wave
    averages in the Python attribution ($26/$53/$76/$151) came from a few large trades in
    thin cells, not a conditionable effect. The wave counter is a correct description of
    trend structure and is NOT an edge. This was the last untested live signal in the
    recovered model; the frontier of signal-architecture work is now closed.
