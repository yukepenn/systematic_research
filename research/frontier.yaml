- id: RE02_TYPE2_FULL_RECOVERY
  phase: 0
  status: passed
  result: >
    Solar Wave RK fully recovered. 1,436,860 bars, 9 parameter configurations, every
    published series exact on every bar; 45,825 Type-2 events at 0 FP / 0 FN.
    Type 2 = edge-triggered latch on an intrabar High/Low excursion beyond TrendVector,
    spaced by PullbackSplit, re-armed by full-bar clear / flip / Type-3. Also found:
    TrendVector carries a second ladder-rung clamp, provably inert when V <= S/2 (where
