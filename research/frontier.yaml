  gates: research/03_reverse_engineering/TYPE2_RECOVERY_SPEC.md
- id: WAVE1C_TIER2_AND_VALIDATION
  phase: 1
  status: passed
  result: >
    80 configs, real slip 0/1/2, full history. PBO 0.56-0.66 with a NEGATIVE IS->OOS slope:
    StopMultiplier is not selectable. The plateau ENSEMBLE beats 88% of its members, is
    positive in all 5 years when only 3/8 members are, and is not an exposure artifact.
    Promoted to reference architecture R4. DSR 0.83 at n_trials=170.
    Falsified: 16:30 timed-exit dominance; the "46% untaken signals" opportunity premise
    (-$9.04 per marginal trade); DR06-H5 (block vs iid drawdown ratio 0.987).
    Confirmed: DR06-H4 (neighbourhood selection beats argmax).
- id: DC01_DC02_OVERSHOOT
  phase: 1
  status: passed
  result: >
    Overshoot ratio r = E[omega]/delta exceeds the martingale null at every threshold
    (t = 31 down to 2.1); the edge is a ~3% deviation of r from 1.0. The close-basis
    crossing excess is ~23.5 ticks = $117.57/segment = 89% of ALL friction. Volatility
    normalisation halves the across-year drift of r (0.116 -> 0.058). Zero config burn.
- id: H006_ADAPTIVE_THRESHOLD
  phase: 2
