    family: TRACK_VF_ARCH
    source_file: research/original_trader_reconstruction/vwap_flux_family/src/run_vf1.py
    config_summary: "Segmented anchored VWAPs, one FROZEN per 60-min clock period (sum p*v / sum v); arm L_C = the 5 most recent COMPLETED layers; levels by percent interpolation across the layer set (Highest 95 / Upper 75 / Median 50 / Lower 25 / Lowest 5); EMA20 trend; pullback-into-cloud entries; max 3 signals per trend episode; >=5 bars between same-direction signals; close-threshold 10"
