  - model_id: VF_ANCHORED_QLEV_STOP130_COMM0
    family: TRACK_VF_ARCH
    source_file: research/original_trader_reconstruction/vwap_flux_family/src/run_vf4.py + vf_core.py
    config_summary: >
      5 ANCHORED-CUMULATIVE VWAP layers, anchors at the 5 most recent clock-hour starts,
      each accumulating from its anchor to the CURRENT bar; at each period boundary the
      oldest anchor is dropped and a new one starts. Price basis = minute close x volume.
      Levels = QLEV, linear-interpolated QUANTILES of the 5 layer values. Trend =
      cloud-break hysteresis. Signals SIG1 (band re-entry) / SIG2 (rail touch with close
      beyond median), qty 3 per trend episode, split 5 bars, close-threshold 10.
      Intrabar 130-pt stop; exit arms X_FLIP / X_MED / X_OPP; session-close flat.
    event_universe: "SIG1 / SIG2 pullback signals on the anchored cloud"
    wrapper: "qty 1 execution, next-bar-open fills, slippage 0, intrabar 130-pt stop, session-close flat"
    cost_model: "$0/side (Layer 1)"
    data_source: nq1m_2005_202605.parquet
    date_window: "window A 2026-05-10..05-22 primary; W20260308 / W20260322 / W20260419 secondary"
    purpose: "Architecture RE-SELECTED BY PLOT FIDELITY against the vendor manual's own chart images, explicitly not by PnL"
    defining_run: OTR_VF4_ANCHORED_LAYERS
    status: INCUMBENT
    notes: >
      Best cell ANC|SIG2|X_MED|stop130|QLEV, D=3.398: net -$3,745 vs -$4,055, hold 36.6 vs
      39.8, avg win $1,268 vs $1,236 all match; residuals WR 22.1 vs 37.7 and count 258 vs
      183. Quantile-of-layers level math beats range interpolation. NAME-REUSE: the VF4
      spec registered PERCENT INTERPOLATION (interpretation D/E) as PRIMARY with quantiles
      as a disclosure arm, but the object carried into R3, R7 and R8 as "the VF4 clone" is
      this QLEV build. This is a behavioral clone, not source-exact.

  - model_id: VF_ANCHORED_PCTINTERP_STOP130_COMM0
    family: TRACK_VF_ARCH
    source_file: research/original_trader_reconstruction/vwap_flux_family/src/run_vf4.py
    config_summary: "As VF_ANCHORED_QLEV but levels computed by PERCENT INTERPOLATION across the layer range (level = Lmin + pct/100 * (Lmax - Lmin)), consistent with the vendor default Max=100 -> max and Min=0 -> min"
    event_universe: "SIG1 / SIG2 pullback signals on the anchored cloud"
    wrapper: "as VF_ANCHORED_QLEV"
    cost_model: "$0/side (Layer 1)"
    data_source: nq1m_2005_202605.parquet
    date_window: "window A 2026-05-10..05-22"
    purpose: "The level-math reading registered as PRIMARY in the VF4 spec"
    defining_run: OTR_VF4_ANCHORED_LAYERS
    status: SUPERSEDED
    notes: "Beaten by QLEV on the window-A fingerprint. The vf_core clean-room separately quantified a percentile-vs-minmax discriminator (fair-value-percentile midspan offset 8.9 points mean under percentile, identically 0 under minmax)."

# ============================================================================
# FAMILY: OTR_VF_CAND1 - the surviving 2026 signal-composition cluster
# NAME-REUSE HAZARD: "OTR-VF-CAND1" denotes a CLUSTER of four inseparable members,
# not one model. Any claim about "VF-CAND1" must name the member.
# ============================================================================

  - model_id: VF_CAND1_TC_PMED_CDIR_H1A_XOPP
    family: OTR_VF_CAND1
    source_file: research/original_trader_reconstruction/vwap_flux_family/src/run_r7_signal_id.py + run_r7b_signal_id.py
    config_summary: >
      Cluster LEADER. Trend T_C: close vs FairValue AND EMA20(close) slope must AGREE;
      state set only when both agree, else hold last. Pullback depth P_MED: price touches
      the Median. Confirmation C_DIR: the signal bar closes in the trend direction.
      Close-threshold reading H1a: the signal candle closes in the extreme 10% TOWARD the
      signal. Exit X_OPP: stop-and-reverse on the opposite Signal_Trade.
      No free numeric constants - every parameter is a panel value: VF-ANCHOR cloud
      P=60 A=5 pcts (5,25,50,75,95) percentile_linear, close x volume, QtyPerTrend 3
      (same-direction per trend episode), Split 5 bars, CloseThreshold 10, 130-pt stop.
    event_universe: "VF Signal_Trade pullback events on the VF-ANCHOR clean-room cloud"
    wrapper: "qty 1, next-bar-open fills, slippage 0, fixed 130-pt intrabar stop, session-close flat"
    cost_model: "$0/side (screenshot layer)"
    data_source: nq1m_2005_202605.parquet (identification); nq0926_junjul2026_1m.csv sha256:f8048926c24d41f9 (held-out window)
    date_window: "identification 17 weekly windows 2026-01-25..05-29; held-out 6/21-6/26, 6/28-7/10, 7/12-7/31"
    purpose: "Bounded structural identification of the trader's 2026 Signal_Trend + Signal_Trade composition"
    defining_run: OTR_R7_VF_SIGNAL_ID (held out and re-scored in OTR_R8_JUNE2026)
    status: INCUMBENT
    notes: >
      Mean section-40 distance 0.476, worst 0.905, LOWO top-3 in 13 of 17 rotations.
      Failure week 2026-03-22..27 net -$9,730 against a -$42,235 target: RIGHT SIGN, 23%
      of magnitude. Held-out window result: distances 0.338-0.592, counts within +8% to
      +20%, no blowups - the stable member. Persistent residual: WR gap (26-35 vs 39-45)
      and missing extra edge in his two biggest weeks. Held-out scoring here is a
      HELD_OUT_RECONSTRUCTION_WINDOW, NOT true OOS - the historical outcomes were already
      visible to us.

