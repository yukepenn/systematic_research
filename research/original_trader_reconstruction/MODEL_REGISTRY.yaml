    wrapper: "qty 1, next-bar-open fills, slippage 0; exit arms XA trend flip / XB re-break / XC LossLimit-2500 at bar close; session-close flat"
    cost_model: "$0/side (Layer-1)"
    data_source: nq1m_2005_202605.parquet (minute total volume standing in for bid/ask split)
    date_window: "window A 2026-05-10..05-22 primary; W20260308 / W20260322 / W20260419 secondary"
    purpose: "Implement the DOCUMENTED VWAP Flux architecture with bounded readings of the undocumented pieces"
