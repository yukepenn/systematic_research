# MODEL REGISTRY - OTR campaign #6 (Original Trader Reconstruction)
# Built 2026-08-24 per OWNER MASTER DIRECTIVE v4.0 section 42.
# Companion file: RUN_PROVENANCE.csv (directive section 44).
#
# WHY THIS FILE EXISTS
#   The campaign reused a small number of names ("OTR-S-CAND1", "OTR-S-CAND2",
#   "OTR-VF-CAND1", "the T1 control", "the VF4 clone") across materially different
#   configurations - different cost models, different A-parameter eras, different stop
#   distances, different gate constants, different data. This registry mints an
#   IMMUTABLE id per distinct configuration so a claim can never again point at an
#   ambiguous name. Where a fact is not recoverable from the repo the field says
#   UNKNOWN; nothing here is guessed.
#
# LOAD-BEARING FINDING THAT FORCES COST-MODEL SEPARATION
#   In the CAND2 engine family the D-gate reads SESSION REALIZED EQUITY, and realized
#   PnL is computed net of commission (`pnl = pos*(p-epx)*PV - 2*comm_side` feeds cum /
#   hi / consec, which the gate `ok()` then reads - solar_family/src/run_r1j_gatesemantics.py
#   lines 46-62). Therefore commission is INSIDE the model, not a post-hoc accounting
#   layer: the same wrapper at $4.18/RT and at $0 produces DIFFERENT trade streams
#   (master n = 4,598 vs 4,592). Status of this statement: REPRODUCED (endpoints:
#   runs/OTR_R1_SERIES/out/v_mg_result.md at comm_side 2.09 vs
#   runs/OTR_R6_NT8_PARITY/out/python_reference_comm0.json at comm_side 0).
#
# SCOPE RULE (stated so the omissions are not silent)
#   Registered here: every candidate that received a campaign-level NAME, every member
#   of a named cluster, every control/base model that was CARRIED ACROSS runs, and every
#   variant block that a run enumerated and reported per-variant. NOT registered as
#   separate ids: individual cells of a within-run sweep that were never named or carried
#   (S1 31 cells, S3 22, S3B 34, V1 10, VF1 12, R7 208, ...). Those are fully enumerated
#   in each run's own out/sweep_results.json + scorecard.csv, which RUN_PROVENANCE.csv
#   names per run.
#
# STATUS VOCABULARY (lifecycle of the model object, distinct from the directive's five
# EVIDENCE statuses which apply to claims)
#   FROZEN_REFERENCE  - fixed benchmark, not a hypothesis about the trader
#   INCUMBENT         - current best member of its family
#   CLUSTER_MEMBER    - kept under section 6 (observationally equivalent rival)
#   DEMOTED           - kept as a member, no longer co-leader
#   CONTROL           - run to test whether a discriminator carries signal
#   SUPERSEDED        - replaced by a later id, artifacts preserved
#   RETIRED           - withdrawn by us (implementation defect or falsified premise)
#   FALSIFIED         - tested and rejected against evidence; kept with the falsifier
#   DISQUALIFIED      - excluded by a preregistered DQ rule
#   VACUOUS           - the configuration provably could not differ from its baseline
#   OPEN              - defined and specced, adjudication incomplete
#
# NAMING GRAMMAR
#   <FAMILY>_<SHAPE>_<ERA/PARAMS>_<STOP>_<COMM>   e.g. CAND2_ERA_B180_STOP75_COMM0
#   COMM0 = $0/side, COMM418 = $4.18/RT ($2.09/side), COMM436 = $4.36/RT ($2.18/side).
#   Solar A-params written as A1/A2/A3/A4/A5 = offset_trend / offset_stop / slowdown_scan
#   / weak_weak_split / pullback_split.

models:

# ============================================================================
# FAMILY: TYPE1_BASELINE - the frozen vendor-replica benchmark (not a hypothesis
# about the original trader; it is the substrate certification object)
# ============================================================================

  - model_id: T1_V0_BASELINE_COMM436
    family: TYPE1_BASELINE
    source_file: research/original_trader_reconstruction/solar_family/src/otr_engine.py (ARM_LEDGER + ARM_PYTHON in run_s0.py)
    config_summary: >
      Pure-Python reimplementation of SolarWaveRKReplicaV0 Type-1. Enter when FLAT on
      signal_trade == +-1, fill next-bar open, slippage 0, BarsRequiredToTrade 20,
      entries signalled on a session's last bar dropped, exit on opposite flip or on
      INCLUSIVE close-vs-end-of-bar-TrailingStop touch, session-close exit at the last
      bar's close. Solar params 90/179/5/10/true/10.
    event_universe: "T1 only (Signal_Trade == +-1 trend starts)"
    wrapper: "none (bare V0 semantics; no time filter, no gate, no protective stop)"
    cost_model: "$4.36/RT ($2.18/side, NinjaTrader Brokerage Lifetime)"
    data_source: research/03_reverse_engineering/ledgers/t2_canonical_1m.csv (737,707 bars)
    date_window: "2023-01-02T18:01 .. 2025-01-31T17:00 ET"
    purpose: "Certify the Python trading loop against the frozen canonical NT8 result before any wrapper hypothesis is scored"
    defining_run: OTR_S0_TYPE1_REPRO
    status: FROZEN_REFERENCE
    notes: >
      2,914 of 2,915 trades exact in entry time, entry price, exit price and PnL vs the
      NT8 serialized list; the single difference is the documented data-boundary trade
      (delta = 15.25 pts = $305.00). This is IMPLEMENTATION_PARITY (our Python <-> the
      frozen NT8 canonical run), never ORIGINAL_PARITY.

  - model_id: T1_V0_BASELINE_COMM418
    family: TYPE1_BASELINE
    source_file: research/original_trader_reconstruction/solar_family/src/run_r1.py
    config_summary: "Same V0 Type-1 semantics as T1_V0_BASELINE_COMM436, rescored at the trader's own commission rate as a reference row in the R1.1 master rescore table"
    event_universe: "T1 only"
    wrapper: "none"
    cost_model: "$4.18/RT ($2.09/side) - the rate visible in OTRIMG-0002"
    data_source: research/03_reverse_engineering/ledgers/t2_canonical_1m.csv
    date_window: "2023-01-01T06:00:00Z .. 2025-02-02T22:59:59Z (master window)"
    purpose: "Reference row: how far the bare vendor mechanism sits from the trader's pixel-read master row-set"
    defining_run: OTR_R1_SERIES
    status: FROZEN_REFERENCE
    notes: >
      Separated from COMM436 because the cost basis differs, not because the mechanism
      does. For a gate-free model commission is a pure accounting layer; this id exists
      so the two rows are never conflated in a table.

