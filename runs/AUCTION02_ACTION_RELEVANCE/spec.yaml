# =============================================================================
# Frozen construction (Product A ONLY; mirrors U6B's rate-limiter mechanism exactly, per
# runs/U6B_PRODUCT_A_SCALE_RATE/spec.yaml's own construction discipline)
# =============================================================================
construction:
  bar_selection: >
    Identical to U6B: at each bar, using the incumbent's own C4-gated computed target `tgt`
    (product_a_exec_generalized's own output, unmodified), is_scaleup = (tgt!=0) AND
    ((p==0) OR (sign(tgt)==sign(p) AND abs(tgt)>abs(p))) -- fresh ENTRY or same-sign SCALE_IN.
    FLIP/SCALE_DOWN/EXIT/HOLD/FLAT bars are NEVER touched by this mechanism, in every candidate
    cell, exactly as U6B's own asymmetric design (de-risking and non-scale-up moves are never
    rate-limited).
  auction_signal: >
    At each is_scaleup bar, value_dist_ticks_t = (last_traded_price_t - poc_price_t)/0.25, where
    poc_price_t is the causal running point-of-control (causal_running_poc(), see
    runs/AUCTION01_VALUE_STATE/src/02_build_poc_substrate.py, verbatim reuse -- tick_id =
    round(price/0.25), cum_vol_at_price = groupby(tick_id)[volume].cumsum(), running_max =
    cum_vol_at_price.cummax(), record whenever cum_vol_at_price>=running_max, forward-filled),
    computed from genuine per-trade Last prints (bip==0 rows) in raw/NQ, gridded to 1s, THEN
    matched onto the Product-A execution bar's own timestamp via
    pandas.merge_asof(direction='backward', by=session, tolerance=2s) -- identical mechanics to
    COMBO01's own merge (runs/COMBO01_MULTIMODAL_SYNERGY/src/01_build_merged_substrate.py).
  domain_restriction: >
    value_dist_ticks is only trusted -- and the rate limiter only ever activates -- inside RTH
    [09:30,16:00) ET AND a trailing-60s(bid_upd+ask_upd)>0 liquidity gate (reconstructed from
    poc_1s_full's own bid_upd/ask_upd columns exactly as COMBO01 did), matching the exact domain
    AUCTION01's own D4 finding was confound-checked inside. OUTSIDE this domain (pre-market/
    overnight/thin-liquidity bars, OR any bar on a date with no tick coverage at all --
    i.e. essentially all of Product A's pre-Aug-2025 and non-tick-covered history):
    quality_low_auction = FALSE by definition (fail-safe default = unrestricted = CONTROL
    behavior; the mechanism NEVER restricts when its own input is unavailable).
  frozen_cut_point: >
    CUT_FAR_TICKS = 315.3333333333333 -- the 67th-percentile (tercile) cutoff of
    |value_dist_ticks| computed ONCE, non-circularly, from this discovery pass's OWN Product-A
    scale-up-bar (ENTRY+SCALE_IN), RTH+liquid+matched population (n=171, 55 trades, 33 sessions)
    -- BEFORE any outcome was touched for this cut computation (matches AUCTION01/COMBO01's own
    preregistration discipline). This number is FIXED for the confirmation pool -- it must be
    reused verbatim, never re-derived on the protected-pool population (non-circular, matching
    U6B's own VOTE_THRESH=6.0 discipline exactly).
  quality_state: >
    quality_low_auction = (domain_restriction satisfied) AND (|value_dist_ticks_t| >=
    CUT_FAR_TICKS). Binary, single-threshold (top tercile only triggers pacing; near+mid
    terciles, and all out-of-domain bars, read quality_low_auction=FALSE i.e. full speed) --
    simpler than U6B's own OR-of-two-signals composite because this family has one auction
    predictor, not two independent quality signals; disclosed as an intentional simplification,
    not an oversight.
  mechanism: >
    Byte-identical in shape to U6B's own (runs/U6B_PRODUCT_A_SCALE_RATE/src/
    01_construct_and_validate.py's product_a_exec_ratelimited, minus the trigger condition):
    at an is_scaleup bar with quality_low_auction==TRUE, gap = tgt - p;
    step_mag = max(1, floor(f * abs(gap))) [minimum-step-of-1 floor, DISCLOSED DEVIATION,
    identical justification to U6B: a literal floor(f*|gap|) with no floor would silently turn
    single-contract low-quality scale-ups -- the majority of Product-A moves, per U6B's own
    finding that 85.6-88.3% of its own rate-limited bars hit this exact floor -- into a permanent
    block, reintroducing the exact right-tail failure mode U6 Part 3 already closed the
    filter-framing over]; tgt_final = p + sign(gap) * step_mag. When quality_low_auction==FALSE
    (near/mid tercile, OR out-of-domain, OR not a scale-up bar), tgt_final = tgt unchanged (100%
    of the gap in one bar, exactly CONTROL). tgt_final becomes `pend` exactly as the incumbent's
    own loop already does; C4/forced-flat gating happens upstream of this step, exactly as U6B.
  grid: >
    f in {0.5 (PRIMARY), 0.7 (SENSITIVITY)} -- IDENTICAL grid to U6B's own preregistered {0.5,
    0.7}, chosen deliberately for direct comparability across the two independently-triggered
    rate limiters (U6B's htf_agree/vote_dispersion-driven one vs. this family's
    value_dist_ticks-driven one), not re-optimized. CONTROL = f=None (rate limiter fully
    disabled, byte-identical to the incumbent's own product_a_exec_generalized) is the
    correctness-gate call and must reproduce the certified canonical Product-A net ($177,924.40
    legacy-pricing convention, matching U6B's own gate) exactly before any candidate cell is
    trusted.
  auction_x_u6b_interaction: >
    NOT combined into this frozen construction. Step 4 tested (discovery-only, n=171,
    session-block bootstrap) whether an Auction-far x U6B-quality-low interaction term added
    explanatory power beyond either alone; b3 (interaction coefficient) session-block CI
    [-163.4, 49.0] at H=3 and [-204.2, 543.3] at H=20 -- both span zero. This candidate is
    explicitly NOT frozen (DATA_LIMITED, not a confident null, n=171) and is flagged as a
    follow-up for a future pass with more data (e.g. once the confirmation pool itself is
    available), not baked into this spec's mechanism.

# =============================================================================
# Confirmation-pool procedure (mechanical, no further judgment calls)
# =============================================================================
confirmation_procedure:
  step_a_diagnostic_replication: >
    On the protected pool's own sessions (same causal alignment method, same TICK=0.25, same
    RTH+liquid domain restriction, same is_scaleup bar-selection), recompute: (i) session+trade
    block-bootstrapped Spearman rho of value_dist_ticks_abs vs signed_markout_{1,3,20} for both
    Product A (target_exposure_A!=0) and Product B (position_B!=0) in-direction populations,
    using the SAME frozen tercile cut methodology (recompute the pool's OWN marginal tercile cut
    for this diagnostic-replication step only -- this is a like-for-like re-diagnosis, NOT the
    frozen policy trigger, which always uses CUT_FAR_TICKS=315.33 verbatim); (ii)
    P(large_aligned_move)/P(large_adverse_move) far-vs-near tercile mean-diff at H=3, both
    products, using the pool's own MFE/MAE pooled-median thresholds (recomputed on the pool, not
    reused, since "large" is inherently sample-relative); (iii) report whether the DISCOVERY
    pass's signs (negative signed_markout rho; positive, adverse>aligned large-move-probability
    diffs) replicate in sign, and whether previously-marginal cells (Product A H=1/H=20,
    Product B all horizons) now clear the dual-CI-excludes-zero bar with the added sessions.
  step_b_redundancy_replication: >
    Recompute Step 2's redundancy check (Spearman rho of |value_dist_ticks| vs U6B's own
    quality_high_u6b, using VOTE_THRESH=6.0 verbatim, never re-derived) at Product-A scale-up
    bars on the pool. Report whether |rho|<0.2 (this discovery pass's rho=-0.069) still holds.
  step_c_constructed_pnl: >
    Run CONTROL/F0.5/F0.7 (product_a_exec_ratelimited-style mechanism above) on the FULL
    canonical Product-A bar history, but report the net/Sharpe/maxDD_eod/CDaR95 DELTA
    (candidate minus control) summed ONLY over bars falling on tick-covered session dates
    (discovery 37 + protected pool sessions) -- explicitly NOT a full-history battery, per the
    disclosed coverage_limitation above. Also report turnover (fill count, total |contracts|,
    commission delta) over the same restricted date set.
  step_d_right_tail_check: >
    Intersect U6's own published top-20/bottom-20 canonical Product-A blocks
    (runs/U6_PRODUCT_A_PATH_DEPENDENCE/out/step3_top20_blocks.csv /
    step3_bottom20_blocks.csv, by t_idx_start/t_idx_end) with the tick-covered date set. If the
    intersection is empty (expected, given coverage_limitation -- those blocks were identified
    across the full 2022-2026 history and are unlikely to fall inside a <1-year recent window),
    report N/A explicitly rather than fabricating a check. If any block does overlap, report the
    candidate-vs-control windowed $ delta on that block exactly as U6B did.

# =============================================================================
# Primary endpoints (exact, mechanical)
# =============================================================================
primary_endpoints:
  - "Product A, H=3, signed_markout: session-block AND trade-block bootstrap CI on Spearman rho
     (value_dist_ticks_abs vs signed_markout_3_A), replicated sign and CI-excludes-zero status."
  - "Product A and Product B, H=3, P(large_aligned_move) and P(large_adverse_move): far-vs-near
     tercile dual-clustered mean-diff, replicated sign and CI-excludes-zero status."
  - "Redundancy: Spearman rho(|value_dist_ticks|, quality_high_u6b) at Product-A scale-up bars,
     replicated |rho|<0.2."
  - "Constructed net/Sharpe/maxDD_eod delta (F0.5 and F0.7 vs CONTROL), summed over tick-covered
     dates only."

# =============================================================================
# Falsification condition (exact, preregistered)
# =============================================================================
falsification_condition: >
  This candidate is FALSIFIED / NOT PROMOTED if, on the confirmation pool, EITHER grid cell
  (F0.5 or F0.7) shows: (a) constructed net (step_c) delta over the tick-covered date set is
  negative or a wash (<1% of CONTROL's own net over that same restricted date set -- same
  1%-wash convention U6B used, applied to the coverage-restricted, not full-history, net since a
  full-history comparison is not meaningful here per coverage_limitation), OR (b) the diagnostic
  replication (step_a) shows the SIGN of the Product-A H=3 signed_markout relationship flips
  (i.e. far-from-value now predicts BETTER, not worse, continuation) with a CI that excludes the
  discovery pass's own sign, OR (c) redundancy replication (step_b) shows |rho|>=0.4 against
  U6B's quality_high_u6b (i.e. the signal turns out to be substantially redundant with an
  already-open challenger on the larger sample, undermining the non-redundancy case this spec is
  built on), OR (d) any right-tail overlap found in step_d shows net damage exceeding any
  full-window improvement, OR (e) quality_low_auction's realized rate on the pool differs from
  this discovery pass's 33.3% (by tercile construction) by more than 2x (i.e. <16.7% or >66.7%),
  indicating the frozen cut point does not transport to the larger sample.

