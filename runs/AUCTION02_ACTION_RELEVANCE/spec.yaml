# =============================================================================
# WHAT SURVIVED (headline, see REPORT.md for full evidence)
# =============================================================================
disposition_summary: >
  Step 1 found a real, small, causally-clean, non-time-of-day-confounded, sign-stable SIGNED
  relationship: at bars where Product A (target_exposure_A!=0) or Product B (position_B!=0)
  already has a nonzero direction, a LARGER causal running-POC distance (|value_dist_ticks|,
  far tercile) predicts (a) a WORSE forward markout in that already-chosen direction
  (session+trade-block CI excludes zero for Product A at the 3-bar horizon; consistent
  negative sign, 2/2 chronological half-stable, at every tested horizon {1,3,20} for both
  products) and (b) a higher probability of BOTH a large aligned move and a large adverse move,
  with the adverse-move probability increase larger than the aligned one (both products, both
  session- and trade-block CIs exclude zero at the 3-bar horizon). Step 2 found this is NOT
  redundant with U6B's own quality state at Product-A scale-up bars (rho=-0.069, p=0.37,
  n=171) and adds real incremental R^2 at the 20-bar horizon (dR2=+0.075, coefficient
  session-block CI [-0.586,-0.111] excludes zero). Step 4's two a priori interaction candidates
  (Auction x U6B-quality; Auction x |M|-magnitude) both showed session-block CIs on the
  interaction coefficient (b3) spanning zero -- NEITHER combination candidate is frozen. Step 3
  (Product-B action layer) identifies "HOLD persistence" as the EVI-selected candidate (it is
  what Step 1's own Product-B test already is) but the evidence does not clear this family's own
  dual-CI-excludes-zero bar as cleanly as Product A's headline cell -- per Step 3's own explicit
  allowance, NO Product-B construction is built; Auction remains Product-A-only this pass.
  ONE Product-A construction is frozen below (primary f=0.5, sensitivity f=0.7), mirroring
  U6B's own rate-limiter mechanism exactly, driven by value_dist_ticks instead of htf_agree/
  vote_dispersion. The discovery-phase effect size (dR2 0.002-0.02 on the primary signed_markout
  cells) is SMALL -- comparable to or smaller than U6B's own effect, which failed U6B's
  1%-of-control wash threshold at construction. This spec is written so the confirmation pool
  gets a fair, non-rigged test, not a foregone conclusion in either direction.

# =============================================================================
# CRITICAL, DISCLOSED SCOPE LIMITATION (read before running the confirmation)
# =============================================================================
coverage_limitation: >
  value_dist_ticks requires genuine per-trade tick prints (raw/NQ), which exist for only
  37 (discovery) + up to ~168 (protected pool) sessions total -- a small, RECENT slice of
  Product A's full ~900+-session, 2022-2026 canonical trading history. U6B's own report puts the
  full-history scale-up-bar population at 12,085-12,603 bars; this discovery pass's tick-covered
  scale-up-bar population is 346 bars (37 sessions) pre-RTH/liquidity-filter, 171 post-filter --
  roughly 2.8% of all-time scale-up bars, rising to a still-minority ~15% (rough extrapolation)
  once the protected pool's ~168 sessions are added. CONSEQUENCE: this construction can only ever
  bind during tick-covered dates; on every other bar in Product A's history (the large majority),
  value_dist_ticks is UNAVAILABLE by construction and the mechanism below is defined to fall back
  to unrestricted (=CONTROL) behavior -- never to a restrictive default. A full-history
  net/Sharpe/DD battery in the style of U6B's own promotion gate is NOT MEANINGFUL here and is
  explicitly NOT part of this spec's validation battery; see validation_battery/primary_endpoints
  below for what IS meaningful given this coverage limit.

binding_separation: >
  Unmodified per sec-binding-separation: incumbent M / Product-A's own computed target
  (target_exposure_A, via product_a_exec_generalized) remains the ONLY directional source.
  Auction state (value_dist_ticks) NEVER inverts, originates, blocks, or shrinks the target --
  it only paces the SPEED of a single bar's move toward an unmodified target, exactly as U6B's
  own mechanism does. Solar13/HTF/B-MOM/target sign/core target formula are byte-identical to
  the incumbent; KSOLAR/KBMOM/TILTRESCALE/TILTMULT/SHORTHALF/rha/M_a/tgt/C4-gating are untouched.

