run_id: U1B_SESSION_HOLD_POLICY
family: U1B (session-conditioned HOLD policy -- graded ETH exit/exposure delta while holding, EVI
  rank #1 from CONTINUOUS_EVOLUTION_WAVE2_EVI.md)
directive: "CONTINUOUS SYSTEM EVOLUTION wave 2, 2026-08-09 (owner MASTER DIRECTIVE v2 EVI
  recompute; U1B selected top-ranked alongside U6B/U8/U9)"
date_frozen: 2026-08-09
author: autonomous research campaign (continuation, wave-2 EVI selection)

hypothesis: >
  U1 (runs/U1_SESSION_HETEROGENEITY/REPORT.md) found, cross-product-corroborated, that
  Product-B's continuation-while-holding value is RTH > ETH (pooled +$6.81/5-bar, weak
  chronology 3/5 yrs) and Product-A's SCALE_IN forward continuation is ~10x higher in RTH than
  ETH (n=5,557/2,580, same direction, the strongest cross-product agreement found in wave 1).
  U3 (runs/U3_HOLD_EXPOSURE_CONTINUATION/REPORT.md) independently found the same underlying
  mechanism from a different angle (overnight-held positions transition to markedly better
  continuation once RTH begins) but its candidate construction -- a BINARY flatten-while-still-
  overnight rule -- failed the right-tail check decisively (9/20 top-20 all-time winning blocks,
  both legs, were themselves net POSITIVE during their own "still overnight" phase; several by
  four-figure sums, e.g. Product-B block 3591 +$4,275). This family tests whether a GRADED,
  non-binary mechanism -- weakening (not eliminating) the incumbent's own exit/exposure
  logic specifically during ETH holding bars -- can capture the real continuation-value gap
  without repeating U3's disqualifying binary-flatten mistake.

why_not_a_reopening_of_U3_or_R3 (mandatory disclosure): >
  U3's construction forced tgt=0 unconditionally the instant an overnight-held position was
  "still overnight" -- a hard, binary exit indifferent to the incumbent's own M-based logic.
  This family NEVER forces a flatten: Leg 1 only makes the incumbent's OWN M-crossing exit
  threshold numerically weaker (fire sooner) during ETH holding bars, using the SAME kind of
  M-comparison the incumbent already performs every bar; Leg 2 only shrinks the incumbent's
  OWN M_A-derived integer target by a fixed multiplier during ETH holding bars, again through
  the incumbent's own rha()/clip machinery, never a forced tgt=0. Both legs revert to the
  incumbent's exact unmodified constants (EXIT_LEVEL=1.0 / multiplier=1.0) the instant
  is_rth becomes True OR p==0. No ENTRY or REVERSAL bar is ever touched -- this does not
  revisit R3's closed entry-eligibility ground either.

data_reuse: >
  Zero new CrossTrade/NT8 calls. Reuses runs/SA0_SYSTEM_STRUCTURE/current_health/src/
  health_substrate.py (HS) -- the byte-verified, near-duplicate-with-only-the-end-date-changed
  extension of runs/SA0_SYSTEM_STRUCTURE/src/substrate.py through 2026-07-31 -- for T/Tp/
  tilt_state/B/M/entry_blocked_c4/forced_flat_c4/hm/last/bars and its own build_pos_seq/
  onelot_exec control-flow pattern (imported, not re-derived). substrate.py's own module-level
  functions are closed over its own canonical-only (n~519,703) arrays and cannot process the
  longer extended array this family's own June-July-2026 reporting requirement needs -- this is
  the exact same reason runs/U0_UNIFIED_STATE/src/01_build_state_table.py used HS instead of
  substrate.py directly; HS's own correctness gate (canonical-window slice reproduces the
  certified NQ net exactly) is the proof that using HS introduces no change to already-certified
  canonical-window history, so every promotion-relevant metric below is computed on the
  HS-array's own canonical-window slice (sess_date<=2026-05-31), identical in principle to
  calling substrate.py directly. is_rth is reconstructed from HS's own hm array using the exact
  formula UNIFIED_STATE_MAP.md documents for U0's is_rth column (933<=hm<=1600), mirrored onto
  HS's own bars/hm the same way U0 mirrored it onto its own extended arrays. Product-A's KSOLAR/
  KBMOM/TILTRESCALE/TILTMULT/SHORTHALF/PV_MNQ_A/COMM_MNQ_A constants are copied verbatim from
  pa0_substrate.py's own top-level definitions (not imported at runtime, to avoid that module's
  own expensive canonical-only-window side-effecting top-level execution) -- the exact pattern
  01_build_state_table.py itself used to generalize product_a_exec. genuine/proxy MNQ pricing
  for Product-B's MNQ leg on the health-only extension bars uses the identical reindex-without-
  ffill + is_mnq_genuine mask U0 already built and disclosed (NQ-OHLC proxy for the 45 new
  sessions only; canonical-window MNQ pricing is 100% genuine, matching the correctness gate).

construction: >
  Two independent legs, NOT combined into one super-rule, both preregistered here before any
  result is read.

  Leg 1 (Product B, BEST_ONE_NQ/MNQ, one shared decision core): HS.build_pos_seq's exact
  control flow, with ONE change -- while holding (p!=0) at a bar where is_rth==False (ETH), the
  exit-level threshold used in the two holding branches (M_arr[t]<=exit_level for p>0,
  M_arr[t]>=-exit_level for p<0) is exit_level_eth instead of the incumbent's EXIT_LEVEL=1.0.
  exit_level_eth > 1.0 means the SAME kind of M-crossing exit fires SOONER during ETH (M has a
  shorter distance to fall/rise before triggering), never a forced flatten unconditional on M.
  Reverts to EXIT_LEVEL=1.0 the instant is_rth becomes True. Entry logic (p==0 branch) and
  ENTRY_LEVEL=3.0 are completely unmodified in every bar, RTH or ETH. Grid: exit_level_eth in
  {1.5, 2.0} (2 cells).

  Leg 2 (Product A): pa0_substrate.product_a_exec's exact control flow (re-parametrized per
  01_build_state_table.py's own working pattern), with ONE change -- at a bar where p!=0 (from
  the previous bar-end state) AND is_rth==False (ETH), the pre-round/pre-clamp raw score
  KSOLAR*Tpp+KBMOM*B is multiplied by a fixed `multiplier` BEFORE rha()/clip is applied (i.e.
  M_a[t] = clip(rha((KSOLAR*Tpp[t]+KBMOM*B[t]) * multiplier), -13, 13)), exactly mirroring how
  the incumbent itself rounds. A bar with p==0 (flat, including a fresh entry) always uses
  multiplier=1.0 -- the UNMODIFIED entry logic, no change to entry behavior at all. Reverts to
  multiplier=1.0 the instant is_rth becomes True. All C4 partial-size gating, TILTMULT/
  SHORTHALF/entry-block logic is completely unmodified. Grid: multiplier in {0.85, 0.70} (2
  cells).

  4 grid cells total: B_eth1.5, B_eth2.0, A_mult0.85, A_mult0.70.

correctness_gate (asserted in code before any candidate result is read): >
  Leg 1 with exit_level_eth=1.0 must reproduce HS.build_pos_seq(HS.M) bar-for-bar exactly, and
  its canonical-window-sliced net must equal the certified Product-B NQ net ($301,915.92) and
  MNQ net ($28,587.10) to the cent. Leg 2 with multiplier=1.0 must reproduce the certified
  Product-A net ($177,924.40) to the cent on the canonical-window slice.

validation_battery (both legs, full battery per CLAUDE.md/standing rigor, canonical window
  2022-01-03..2026-05-29 primary throughout): >
  Full-history net/Sharpe/Sortino/Calmar/maxDD_eod/CDaR95/worst_day/worst_month/pos_day_pct on
  genuine NQ+MNQ economics (Product B, both instruments) and genuine-NQ-priced economics
  (Product A); 2022-2025-only delta (this campaign's R2V1/R2B promotion standard -- an
  improvement concentrated in one recent period is automatic non-promotion); year-by-year
  2022-2026 stability; LOYO (drop 2026 entirely -- reported alongside the 2022-2025-only delta
  since, with only one incomplete extra year present in the canonical window, they are the same
  slice computed the same way, cross-checked); right-tail check restricted SPECIFICALLY to
  blocks (contiguous same-sign runs of position_B / target_exposure_A) that contain at least one
  ETH bar (is_rth==False) anywhere in their lifetime -- both the top-20 winners and bottom-20
  losers among that ETH-touched population, ranked by the CONTROL's own block-level P&L (NQ for
  Product B, genuine-NQ-priced for Product A), comparing control's block-window P&L against the
  CANDIDATE's P&L summed over that exact same bar-index window (same entry timing, since only
  the holding-phase exit/exposure logic changes) -- reporting how many are damaged (candidate
  P&L in that window materially lower than control's) vs improved; turnover/cost check (does the
  earlier-exit-then-possible-re-entry pattern under Leg 1, or the extra rounding transitions
  under Leg 2, add net commission drag that erodes any gross improvement -- measured via total
  contracts-traded (sum of |position delta| at every transition) x commission-per-contract,
  control vs candidate); June-July-2026 health-only extension (is_health_only_bar==True)
  reported separately, observational only, never blended into any promotion-relevant number
  above.

promotion_gate: >
  Standard campaign bar -- mechanism + incremental information + chronology (year-by-year AND
  2022-2025-only delta AND LOYO all directionally consistent, not a 2026-stub artifact like
  R2V1/R2B) + current-regime relevance (extension direction, observational) + right-tail
  preservation (ETH-touched top-20 winners not materially damaged) + left-tail improvement
  (bottom-20 ETH-touched losers materially improved, not just moved around) + cost robustness
  (gross improvement survives the added turnover) + parameter-plateau (both cells within a leg
  directionally consistent, not an isolated needle) + NQ/MNQ economics. No single metric
  decides. Do NOT force a promotion claim -- if it fails on any of these axes (net worse, DD
  worse, right-tail damaged, or 2022-2025-only delta near zero/negative), report NOT PROMOTED
  plainly, exactly like U4B did. If a cell looks genuinely promising on ALL axes, flag it
  explicitly for the orchestrator to consider an adversarial re-verification pass before any
  promotion language is used -- this run itself does not have authority to promote.
