  - Net P&L may never select a mechanism.
  - No mechanism selected on a single correlation (the R31 lesson).
  - Fit/holdout split fixed in advance and reported separately.
  - LOCKED_FORWARD: 2026-08-01 onward untouched.
  - Failed predictions recorded, not rewritten.
