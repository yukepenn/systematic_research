known_differences_declared_in_advance:
  - "EXIT CONVENTION: the research object exits at the CLOSE of the 15:45 bar while entering next-bar-open; NinjaTrader with Calculate.OnBarClose can only do next-bar-open for both. Measured cost -$330 total / -$0.95 per trade / 0.17 % of net. The reference carries BOTH columns (pnl_research and pnl_nt8_convention) and the NT8 comparison uses pnl_nt8_convention."
  - "Warm-up: NT8 starts cold 2022-01-03; the sigma needs 20 prior sessions per market. The reference begins 2022-07-04 so roughly six months of lead-in exist, which is more than the requirement."
  - "STALENESS: a secondary bar more than MaxStaleMinutes (3) old at the anchor or the decision DISQUALIFIES the session rather than forward-filling. The reference disqualifies 6 of 1,058 this way; NT8 should disqualify the same ones."
  - "The per-bar export is ~219 MB for 1.62 M bars. It is REGENERABLE from this exact spec and is gitignored; the committed artifact is the per-SESSION decision file derived from it."
