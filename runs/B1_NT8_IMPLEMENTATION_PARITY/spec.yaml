hypothesis: >
  SolarWaveOneContractNQ_B1_v1.cs / SolarWaveOneContractMNQ_B1_v1.cs (committed 2026-08-10,
  commit 12341ab) correctly implement the frozen SIMPLE01 B1 rung (mm forced to 1.0, bmomPos
