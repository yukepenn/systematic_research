primary_comparison: >
  NT8 B1 vs NT8 incumbent v5, SAME instrument/window/engine, real Strategy Analyzer both sides
  -- unambiguous, no cross-engine convention differences. Expect: on bars where the incumbent's
  real mm was already 1.0 (i.e. tiltState==0, or sumNext==0, or sign(sumNext)!=tiltState), B1's
