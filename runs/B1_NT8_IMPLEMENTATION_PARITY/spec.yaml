  the one-line change's entire footprint, and is directly checkable via each object's execution
  fills ledger (ExportDir/Tag params, already built into both objects).

secondary_comparison: >
  Rough magnitude/direction sanity check only (NOT a strict pass/fail) against SIMPLE01's own
  Python-computed B1 daily P&L (research/system_master/SIMPLE01_MINIMUM_SYSTEM/out/
  daily_pnl_B1_base_cost_full_history_through_20260731.csv). Two disclosed sources of expected
  non-exact-match: (a) that file does not specify whether it represents the NQ or MNQ contract
  size, or points/no-instrument-scaling -- ambiguous, not reconciled here; (b) Python
  (src/analytics simulator conventions) and NT8's Strategy Analyzer use different fill-timing/
  slippage models even at matched cost settings. Any large directional or sign disagreement
  would be investigated; a magnitude difference consistent with (a)/(b) would not be.

window: >
