spec_frozen_before_results: true

caveat: >
  V-PROXY ONLY (see volume_vwap_family/DATA_FEASIBILITY.md): minute close-price volume
  proxies the unavailable bid/ask real volume. Best achievable classification is
  BEHAVIORALLY MATCHED - MECHANISM UNIDENTIFIED. Never conflate with exact parity.

frozen_constants_from_evidence (Class A):
  anchor: 60-minute clock-hour anchored volume-at-price distribution (0.25 bins, causal
    running histogram, reset at each hour boundary; percentiles defined once >=5 bars)
  ladder: [5, 25, 50, 75, 95] volume percentiles
  trend_ma: EMA(20) of 1m closes
  max_signals_per_trend: 3
  signal_split_bars: 5
  close_threshold_10pct: NOT interpreted in pass 1 (ambiguous; disclosed; a pass-2 axis)

mechanism_grid_frozen:
  entry_families:
    M_REV: uptrend -> BUY close crossing DOWN through P25; downtrend -> SELL close
      crossing UP through P75 (pullback-into-value)
    M_BRK: uptrend -> BUY close crossing UP through P75; downtrend -> SELL close
      crossing DOWN through P25 (value-breakout continuation)
  trend_defs:
    T_LVL: close > EMA20 (up) / < (down)
    T_SLP: EMA20 > EMA20 5 bars ago (up) / < (down)
  exits:
    X_MED: close crosses P50 against the position -> exit next open; + session close
    X_OPP: close reaches opposite extreme band (P95 up-exit for shorts entered at P75;
      P5 for longs...) -> exit; + session close   # mirror-consistent definitions in code
  cells: 2x2x2 = 8, plus W_0400_1600 entry-window variant on the 2 best (10 total)
  execution: flat-only entries, qty 1, next-bar-open fills, slippage 0, commission $0

targets:
  primary: W20260510 (window A, confirmed params): 183 trades (18.3/day), WR 37.70,
