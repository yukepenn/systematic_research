  state carries incremental NQ information here, that block lifts and the profit path opens.

binding_amendments:  # from the skeptic; each guards a specific measured failure
  A1_no_VXN: "VXN excluded from BOTH arms. The HAR(NQ-RV)+VXN baseline would DISCOVER on the P-1
    reserve (2022+ implied-vol-daily -> NQ join, the exact join W2 stripped from MC-38). Control
    = univariate plain HAR-RV (RS-/ON refinement already killed by G2_F3) + $0 macro-calendar
    flags. No VXN anywhere."
  A2_points_basis_and_seal: "Every ZB observable is POINTS (32nds) basis, never percent: the ZB
    parquet is additively back-adjusted (median -41/32nds offset in late-2025), so percent RV on
    adjusted levels is era-distorted by construction (DELEV01). AND hard-drop every session
    > 2026-05-31 at load (the parquet physically runs to 2026-07-31 = the BURNED window inside an
    owned file), printing the retained boundary."
  A3_alignment: "ZB prints no bar in zero-trade minutes -> pinned alignment: inner-join on common
    NQ/ZB minutes, minimum-coverage per rolling window, coverage PRINTED, or the corr state is
    silently RTH-biased and overnight flips are missingness artifacts."

frozen_primary_leg_a:
  population: "ZB INTERSECT NQ sessions 2022-12-27 -> 2026-05-31 (program-printed n ~= 860;
    sessions > 2026-05-31 hard-dropped at load; boundary printed)."
  target: "rest-of-session-from-11:00 ET NQ realized variance (PRIMARY); next-session NQ RV
    (SECONDARY, pre-declared, cannot generate a PASS alone)."
  models: |
    BASE : HAR(NQ-RV) + $0 macro-calendar flags (NFP/CPI/FOMC/Treasury-auction day dummies)
    FULL : BASE + pre-declared ZB terms {session & 30-min diurnal-adjusted ZB RV in POINTS;
           60-min NQ-ZB point-return corr level and sign (inner-join minutes, min-coverage rule);
           ZB range-expansion count to 11:00}
  statistic: "OOS QLIKE improvement of FULL over BASE via Diebold-Mariano (HAC errors)."
  split: "ONE fit, no refit. Train 2022-12-27 -> 2024-12-31; test 2025-01-02 -> 2026-05-31."
  null_model: "ONE shared per-session circular-shift draw across legs (a)/(b)/(c) — one family,
    effective-K corrected (K/(1+(K-1)*rho_bar))."

legs_bc:  # secondary; same shared null; triple-matched controls
  leg_b: "ZB 95th-pct range-expansion events -> NQ forward RV/return-dispersion vs control."
  leg_c: "NQ-ZB 60-min corr FLIP (<=-0.3 -> >=+0.3, i.e. hedge->liquidation) -> NQ forward state."
  controls_mandatory: "each leg's control is same-timestamp AND NQ-trailing-60min-RV-decile
    matched AND macro-calendar-flag matched. ZB must add beyond ALL THREE or the leg is recorded
    a REDUNDANCY closure (the PDH/PDL geometry trap in cross-asset costume)."

gates:  # program-printed GATE / SPEC / OBSERVED / PASS-FAIL
  G0_seal_points: "max retained session <= 2026-05-31 (hard assert, boundary printed); assert all
    ZB observables computed on POINTS not percent (print a basis flag)."
  G1_MDE_first: "DM-detectable QLIKE delta at test-n, per-era session counts, and legs (b)/(c)
    event counts (95th-pct expansions; corr-flips) PRINTED BEFORE any gate (barrier line)."
  G2_cell_occupancy: "per-era cell occupancy printed; the post-2022 corr regime may leave the
    'bonds still hedging' cell near-empty -> thin cells (< 20 events) go CLOSED-BY-POWER unread,
    not PASS/FAIL."
  G3_identification: "VIF between each ZB term and the NQ-RV baseline printed; a collinear
    increment => NOT-IDENTIFIED, not PASS (the F11/MC-54 lesson, now mandatory equipment)."
  G4_primary: "DM test two-sided p <= 0.05 on the OOS QLIKE improvement (FULL vs BASE) AND the
    improvement survives the shared circular-shift null. Identified (G3) and powered (G1)."
  G5_semantic: "one printed sentence: what population, what event (does ZB state lower the OOS
    QLIKE of the NQ rest-of-session RV forecast beyond NQ history + macro flags)."

decision_rule: |
  G4 PASS, identified, powered -> ZB state is an INCREMENTAL NQ-vol-forecast surface (Level F,
  new information). Bank it and preregister Wave 7: does ZB state condition P1 action quality /
  sizing (MC-35 unblocked)? FAIL / NOT-IDENTIFIED / COLLAPSE-INTO-NQ-CONTROLS -> ZB retires the
  'last genuinely new raw surface' flag (bankable), FAILURE_MEMORY row. Every number
  DISCOVERY_CONSUMED. RISK-SPECIFICATION / REGIME-ROUTING only; no strategy, no sizing here.

