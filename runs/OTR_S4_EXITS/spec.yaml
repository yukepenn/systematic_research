diagnostics_driving_this_pass: >
  S3B frontier (E13_R1|W_0400_1600|FF D=1.153; E1_R1|W_0400_1600|FF D=1.295) matches
  count/tpd/WR/DD but holds are 20-30% short and net -13/-20%. The V0-certified TOUCH exit
  (inclusive close-vs-TS) truncates trends early: trades exit on a touch, then re-enter,
  producing shorter holds and giving back spread inside trends. A wrapper that exits only
  on a STRICT cross (= true flip) lengthens holds, raises net capture, and drops count via
  merged round-trips — all three residuals move toward target. Directive S4's bounded exit
  family: trailing stop / direction flip / opposite signal / session close. Opposite-signal
  and weak-transition exits shorten holds (wrong direction) — excluded with reason.

