cost_convention_and_why_it_matters:
  statement: >
    THE PYTHON RESEARCH HEADLINE AND THE NT8 NUMBER ARE NOT THE SAME QUANTITY AND MUST NOT BE
    COMPARED DIRECTLY. Research nets $4.36/ctrRT commission PLUS a candidate-specific $14.44/ctrRT
    modelled spread (WE_W82_FILLAUDIT). NinjaTrader applies the commission template and zero
    slippage. The parity reference is therefore generated at COMMISSION ONLY, which is what gfills
    already computes. Any report that puts the $1,394/week research figure beside an NT8 net is
    comparing two different cost models.
  spread_is_not_reintroduced_here: "0 slippage ticks. $14.44/ctrRT is 2.888 NQ ticks round turn, which is not an integer number of ticks per side, so forcing it into NT8 would be a third convention. The spread stays where it belongs - in the research layer."

primary_comparisons:
  - "trade count, in-window"
  - "net P&L, in-window, commission-only both sides"
  - "entry timestamp / exit timestamp / direction / quantity, trade by trade"
  - "size-2 share (the quality layer, which W52 could only validate on a full-window run)"
  - "session-box halt count and halt timing - THE ACTUAL SUBJECT OF THE 14-LINE DIFF"
  - "weekly P&L series correlation"
  - "max drawdown"

gates:
  G1: "in-window trade counts agree within 2 %"
  G2: "matched-trade rate (same entry timestamp AND same direction) >= 99 %"
  G3: "net P&L agrees within 2 %, commission-only on both sides"
  G4: "size-2 share agrees within 3 pp"
  G5: "the CONTROL P1_v3 reproduces its own W52 reference within the same bands - if G5 fails, sections 18 and 47 forbid blaming PCT"

decision_rule:
  - "All of G1-G5 pass -> EXECUTABLE_SINGLE_BASELINE moves from NONE to WeeklyEdgeP1PCT_v1, labelled EXECUTABLE / PARITY-CERTIFIED / NOT LIVE ENABLED. Those are three separate statuses and section 19 forbids collapsing them."
  - "Any gate fails -> localize in the section 47 order (instrument/data, session template, timestamp, date boundary, warmup, commission, fill convention, signal state, session box, exit convention) and classify the cause. DO NOT TUNE UNTIL P&L MATCHES."
  - "NO RESEARCH LOGIC MAY BE CHANGED BY THIS RUN. Section 16: engineering defects only. If a fix would alter trading behaviour it stops and is reclassified as a SEMANTIC change requiring a version bump and its own reconciliation."
  - "Nothing is enabled. No live order authorization exists and none is sought."

known_differences_declared_in_advance:
  - "Cold start: NT8 begins with no state on 2022-01-03 while the Python object's substrate is loaded from 2022-01-01 with extend=True. W52 measured this as 2 trades of 1,950 (-0.1 %)."
  - "Last-bar-of-session flatten: the Python ledger books at that bar's CLOSE, NinjaTrader fills at the next open. The forced-flat window (-21 min) should make this path near-dead, but it is a disclosed difference, not an assumed equivalence."
  - "NT8 counts a position open at data end in TradesCount/NetProfit while a session-close exit exactly at the data boundary may be missing from the serialized trade list (CLAUDE.md convention)."
