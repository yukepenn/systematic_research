amendment: 1
date: 2026-08-25
status: OWNER REDIRECTION, applied BEFORE any W18 readout
owner_instruction (verbatim substance): >
  "我不在乎过去，我只在乎这个regime，这几年，甚至这两年就好，只要未来赚钱就行。当然能帮助你
  理解我们系统本质也是好的。"
adjudication (accepted, with the burden restated): >
  The regime-conditional stance is legitimate: 2006-2015 NQ is structurally a different
  instrument (volume, participant mix, algo share, tick structure), so requiring an edge to
  work there may be requiring the wrong thing. W17 is therefore RE-LABELLED: it is no longer a
  verdict on the stack's validity, it is a MECHANISM MEASUREMENT — it establishes that what we
  own is a long-volatility trend harvester (earns in 2008/2015/2020-style years, bleeds in
  quiet ones) and that LONG-ONLY replicates across eras.
  BUT the burden does not disappear, it moves: the supporting regime appears to start ~2022
  (2021 is the worst year in the deep sample and is adjacent to our data), so the regime is
  ~4.5 years old and our calibration has consumed ALL of it. There is currently ZERO
  out-of-sample evidence WITHIN the regime.
changes to W18:
  windows are re-cut inside the modern regime, keeping the same three-stage discipline:
    BUILD   = 2022-01-01 .. 2023-12-31
    TEST    = 2024-01-01 .. 2025-06-30
    CONFIRM = 2025-07-01 .. 2026-07-31
  Everything else in the spec (engines, regime variable, selection rule, verdicts) unchanged.
  A quiet engine selected on BUILD must hold on TEST before CONFIRM is looked at.
follow-on (preregistered here): >
  W19 WALKFORWARD — the decisive test for a regime-conditional system: refit the stack's
  choices on a trailing window, trade the next block only, stitch the out-of-sample blocks.
  If walk-forward performance approximates the fixed-calibration performance, the parameters
  are stable and the edge is real within the regime. If it collapses, the fixed numbers were
  self-deception. This is the test that "只要未来赚钱" actually requires.
