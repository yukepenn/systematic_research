run_id: WE_W22_TAIL
date: 2026-08-25
campaign: WEEKLY_EDGE (#7)
directive: owner — "赚大钱，不亏，持续每天每周赚钱"; W21 left exactly one open weakness on the
  audited object: the tail of the E5+S1 combination (-$26,850 vs E5's own -$17,440).

object: E5 = 1-contract majority vote (>=50%) over the 32 long-only configs; S1 = CAND2+D-gate.

axes (all causal; each stated with what it reads and when):
  V1 THRESHOLD CURVE : vote thresholds {0.30,0.40,0.50,0.60,0.70,0.80} reported as a CURVE.
     Declared: the curve is reported whole, and flatness is the finding; no threshold is
     selected. A peaked curve means the 0.5 result was luck.
  V2 CONVICTION SIZE : size 1 when the vote fraction is in [0.5,0.75), size 2 at >=0.75.
     Exposure disclosed (max 2). Judged ONLY on Sharpe, per the W06/W10 precedent that
     dollars-and-tail-scaling-together is leverage, not edge.
  V3 THREE SLEEVES   : E5 + S1 + ASIA (admitted in W14 at corr 0.11). Max 3 contracts.
  V4 SESSION HALT    : apply the W09 lesson to the vote itself - halt the E5 sleeve for the
     remainder of a session once its realized session P&L breaches -H, H in {1300, 2600}.
     This is the mechanism that worked on S4 and has never been tried on the vote.
  V5 CONCENTRATION   : cap total same-direction exposure across E5+S1(+ASIA) at 2 contracts
     (the portfolio-level tail control never cleanly implemented, listed open since W13).
promotion rule for this wave: a variant is ADOPTED only if it improves the worst week by
  >= 15% WITHOUT reducing Sharpe, on the modern out-of-sample window; anything that trades
  Sharpe for tail is reported but not adopted.
falsifier: if nothing improves the tail without costing Sharpe, the honest statement is that
  the tail is the price of the edge at this exposure, and the only remaining lever is trading
  fewer contracts.
forbidden: [data >= 2026-08-01, fill-bar information, selecting a threshold from V1,
  adopting on dollars]
outputs: [out/tail.txt, out/summary.csv, REPORT.md]
