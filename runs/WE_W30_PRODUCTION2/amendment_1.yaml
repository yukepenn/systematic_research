owner: "更正 我不是要29%捕获率。我是要赚越多越好。"
adjudication: >
  The "29 % capture" figure was MY translation of the $10k/week-on-one-contract target, not the
  owner's requirement. The objective is restated as: MAXIMISE PROFIT subject to not blowing up.
  Consequences for this wave:
    - CONTRACT COUNT is a legitimate lever and a risk-appetite decision, not a research
      question. It is reported as a ladder (already done in W23) and never used to claim a
      research improvement, because Sharpe is exposure-invariant.
    - The research question is therefore PRODUCTION PER CONTRACT, which is exactly what Q1-Q4
      measure. No change to the questions.
    - Reporting unit stays points/session for diagnosis (it is exposure- and price-neutral),
      with dollars alongside.
    - "Capture ratio" is retained only as a diagnostic denominator, never as a target.
