run_id: WE_W30_PRODUCTION2
date: 2026-08-25
campaign: WEEKLY_EDGE (#7)
directive: owner — "一周1nq才赚50个点…每天才5-10个点太少了…至少每周要赚1万，甚至1nq就能赚1万"

the arithmetic, stated first: >
  $10,000/week on ONE NQ = 500 points/week = ~100 points per session. The measured
  perfect-foresight availability is 346 points/session (W06), so the target is ~29% capture -
  HIGHER than the original trader's ~24.8% and 3-6x our current 4.7-9.6%. R34 proved such
  trades EXIST inside our own family (hindsight weekly selection reached ~250 pts/session,
  72% capture), so the ceiling is not the family - it is our ability to be positioned.
  This wave measures WHERE the production is being lost structurally, before any new signal
  is added.

questions:
  Q1 TIME IN MARKET (never measured in 30 waves): what fraction of bars is the object actually
     holding a position? Report per sleeve and for the portfolio: % of bars in position,
     % of sessions with at least one trade, points per bar-in-market, points per session
     conditional on trading. If P&L per bar-in-market is healthy but time-in-market is small,
     production is capped by ABSENCE, not by edge quality - and that is a different problem
     from the one we have been solving.
  Q2 WHERE THE ABSENCE COMES FROM: decompose non-participation into
     (a) vote below threshold, (b) range throttle blocking, (c) session halt fired,
     (d) session target fired, (e) flat between signals. Percentages must sum to the
     non-participating bars.
  Q3 CONCURRENCY: the object holds at most ONE position. Test INDEPENDENT CONCURRENT ENTRIES:
     treat each of the 4 member-sets as its own sleeve with its own entry/exit and its own
     session box, summing positions (max 4 contracts, disclosed). This is NOT pyramiding the
     same trade (rejected 3x as leverage) - it is separate trades from separate voters, and it
     has never been tested with the box.
  Q4 CEILING CHECK: with perfect knowledge of the SIGN of the next session's move but nothing
     else, and our own entry/exit machinery, how many points per session would the object
     make? This bounds how much of the gap is direction quality vs production capacity.
readouts: points/session is the PRIMARY unit this wave (not dollars, not Sharpe), because the
  owner's target is stated in points. Sharpe and worst week remain guards.
forbidden: [data >= 2026-08-01, fill-bar information, presenting Q4 as achievable, adopting
  Q3 without disclosing the exposure]
