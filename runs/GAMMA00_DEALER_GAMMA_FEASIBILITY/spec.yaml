hypothesis: >
  Dealer positive gamma dampens (hedges against price move), dealer negative gamma amplifies
  (hedges with price move) -- per directive sec45, an economic HYPOTHESIS, not an assumed fact.
  This run is a literature scout + local data feasibility check only, per sec44/sec48 -- no
  construction, no trading conclusion.

method: >
  Primary-source literature review (no vendor/retail GEX evidence per sec47/79) across the named
  papers/sources; classify each by data level (A=genuine dealer inventory, B=signed flow +
  reconstruction, C=quote/trade+OI proxy, D=naive public-OI heuristic) per sec47. Separately,
  read-only repo search for any existing local SPX/NDX options data, and public-pricing research
  (no purchase) for what real options data would cost.

falsification_criterion: >
  Data feasibility: BLOCKED if no local data exists and no free/already-licensed source is found.
  Literature: hypothesis is weakened for THIS use case if rigorous (Level A/B) sources conclude
  the mechanism's magnitude is not large relative to normal volatility variation, and/or if no
  NDX/NQ-specific rigorous replication exists (per sec46's explicit falsification allowance).

promotion_rule: n/a -- infrastructure/literature pass, not a trading candidate.
