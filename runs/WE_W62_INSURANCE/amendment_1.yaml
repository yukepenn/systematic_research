run_id: WE_W62_INSURANCE
date: 2026-08-26
status: APPEND-ONLY, written before the added phase ran. Phases 1-4 are run and stand.

what the wave could and could not answer:
  PHASE 2 IS UNINTERPRETABLE AND THE CODE SAID SO ITSELF. 22 rolling 24-month windows inside a
  four-year sample overlap by 23/24, so the EFFECTIVE number of independent observations printed
  by the run is ABOUT 1. The loadings it produced (M3 vol: P1 +0.634, short -0.683; M4 up-share:
  P1 +0.617, short -0.407; corr(t_P1, t_SHORT) -0.473) have the insurance SHAPE, and a
  correlation on one effective observation is not evidence of anything. It is reported and it is
  not used.
  PHASE 3 COULD NOT BE RUN AT ALL: lagging the regime variable by a full 24-month window leaves
  too few windows. The predictive question is UNANSWERABLE on this sample and is recorded as
  UNKNOWN rather than as a negative.
  PHASE 4 HAS REAL SAMPLE (746 UP sessions, 266 DOWN, causal label) and it says the sleeve adds
  money in BOTH regimes: +$172/wk in UP, +$374/wk in DOWN, at a fixed drawdown within each.

the question phase 4 raises and does not answer, which is the one that actually decides:
  The sleeve adds +$172/wk even in UP regimes - yet standalone it lost 10.62 pts/session in 2026,
  which is an UP regime. Both can be true, because at a FIXED DRAWDOWN a sleeve that loses money
  can still raise weekly dollars by shrinking the drawdown denominator. If that is what is
  happening, then W61's "wait for the sleeve to recover" is wrong for a reason that has nothing
  to do with insurance: you would add it BECAUSE it lowers the drawdown, not because it earns.
  But W61's own null already measured that ~91 % of the combination's benefit is the sleeve's
  EXPECTANCY and only ~9 % its alignment. If the expectancy is gone, most of the benefit should
  be gone with it.
  These two readings make opposite recommendations and the data can settle it directly.

phase 5 - THE DECISIVE NUMBER, per year:
  The combination versus P1 alone, PER YEAR, at a fixed $20,245 max drawdown within each year,
  reported consistency-first. 2026 is the test: the sleeve lost 10.62 pts/session standalone that
  year, so if the combination still beats P1 alone in 2026, the benefit survives a losing sleeve
  and the drawdown-denominator reading is right. If the combination LOSES to P1 alone in 2026,
  then the benefit tracks the sleeve's expectancy, W61's revival condition is the correct
  recommendation, and the insurance framing is dead.
  Also reported: the sleeve's standalone contribution and the combination's max drawdown in each
  year, unrescaled, so the mechanism is visible rather than inferred.
forbidden additions: [quoting phase 2's loadings as evidence, calling phase 3 a negative result
  when it is an unanswerable one, recommending a weight on the basis of a single effective
  observation]
