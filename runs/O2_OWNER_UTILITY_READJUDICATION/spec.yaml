family: O2_OWNER_UTILITY_READJUDICATION
directive: "CONTINUOUS SYSTEM EVOLUTION -- Master Directive v3, sec14-18 (P1)"
frozen_before_results: true
date: 2026-08-09
information_class: POLICY_MAPPING

hypothesis: >
  O1/O2's owner-utility apparatus (J = CE_g - lambda*P_ruin) is conditionally unblocked per an
  independent blind review, subject to 2 preconditions: (i) pre-register answers to 4 unanswered
  items, (ii) run primary_objective_v2 on real P&L for the first time (previously synthetic-
  fixture-only). This run satisfies both, then scores a small pre-registered candidate set.

method: >
  See PREREGISTRATION.md for the 4-item answers (frozen before any candidate scored). Headline
  C=$100,000, L=1.0, fixed_fraction mode, module-default n_boot/seed/lambda -- no per-candidate
  overrides. Candidates: Product A (legacy + genuine-MNQ), Product B-NQ, Product B-MNQ, U6B
  control/F0.5/F0.7. Every candidate scored under BOTH mixture and Gamma-minimax aggregation;
  any sign-flip is INCONCLUSIVE per the binding range-rule policy (O1_BLIND_REVIEW_OUTCOME.md).

falsification_criterion: >
  Correctness gate: each candidate's daily series must reproduce its certified canonical net
  exactly before any J score is trusted. n/a beyond that -- this is utility re-adjudication, not
  a new statistical test (sec14).

promotion_rule: >
  Per directive sec18 -- immediate canonicalization requires no new parameter selection, all
  original gates already satisfied, rejection genuinely only a now-superseded utility criterion,
  robustness under the updated utility, AND independent adversarial review. Absent the last item,
  results are recorded as a high-priority frozen challenger, not promoted.
