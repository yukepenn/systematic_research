run_id: WE_W68_ROBUSTCORE
date: 2026-08-26
campaign: WEEKLY_EDGE (#7)
directive: W67 changed what the question is. Not "can the object be improved" but "half of it
  rests on a component this repo has independently judged regime-local, and that half is
  currently losing money - what does the object look like when it leans on the fragile half
  less?"

what W67 established and what it forces:
  P1 is a Solar ensemble OR-GATED WITH B-MOM. B-MOM supplies 51 % of the net (Solar alone 7.26
  pts/session, the object 14.86), it was long at 37.3 % of all entries, and once it agrees the
  entry requirement collapses from 6 of 13 members to ONE. Its contribution by year is
  +6.28 / -0.23 / +13.93 / +12.22 / +1.47 - and the B-MOM-ENABLED share of net in 2026 is -16.6 %.
  Meanwhile the scalping lab parked B-MOM at PF 1.013 over 16 unseen years, W57 measured
  t = 0.27 pre-2022 against t = 2.66 after with no regime variable separating them, and W58 put
  its latest 24-month window at the 98th percentile of its own 234-window history.
  So the object's largest single risk is not that it cannot be improved. It is that HALF OF IT
  IS AN IN-SAMPLE COMPONENT AT THE TOP OF ITS OWN HISTORICAL RANGE.

the two independently-motivated moves that both reduce that dependence:
  (i) W66's C2r - extend the VolMult ladder to 40, which strengthens the SOLAR side. It gave the
      same production with a 26 % smaller mean top-5 drawdown and a 40 % smaller Ulcer, and beat
      the incumbent in 4 of 5 years. Its own null showed the gain is mostly "more members" rather
      than "these members", which is W19's law and is fine - the law is the mechanism.
  (ii) W67's w_bmom = 2.00 - lean less on B-MOM. It cost 10 % of production for a 25 % smaller
      mean top-5 drawdown, a 22 % smaller worst week and a higher positive-week rate.
  NEITHER passed its own bar alone. Combining two things that each failed is exactly how a fit
  is manufactured, and this wave says so before running: the cross is tested because both moves
  reduce the SAME disclosed fragility for reasons stated in advance, not because both looked
  good. The bar is unchanged and the nulls are unchanged.

phase 1 - THE CROSS, and the corners are the controls:
  ladder in {13-member incumbent, 18-member C2r} x w_bmom in {2.83 incumbent, 2.00, 0.00}.
  Six cells. The incumbent is one corner and Solar-only is another, so the wave cannot report a
  winner without also reporting what it gave up relative to both.

phase 2 - THE CONSENSUS THRESHOLD, which W67 proved is the only other live constant:
  Everything else in the combiner is inert. The Solar-side decision is "at least k of NMEM
  members net-long". k = 6 of 13 comes from the vendor's chain and has never been questioned.
  Per W19's law and W59's boundary, question it by AGGREGATING over neighbouring k, never by
  selecting one: an equal-weight vote over k in {5, 6, 7} of 13 (and the NMEM-scaled equivalent
  for the 18-member ladder). The members of that aggregate estimate the same quantity at
  different strictness, which is the exchangeable case the law requires.

phase 3 - THE TILT, never examined:
  The 50-session tilt agrees on 37.5 % of bars and lowers the entry requirement from 6 to 5.
  Arms: tilt OFF, tilt multiplier at {1.0, 1.25, 1.5}, and the tilt window at {25, 50, 100}
  sessions aggregated rather than selected. Report the exchangeability check: if a 25-session
  and a 100-session tilt disagree often, they are not exchangeable and aggregation is the wrong
  tool for that axis - which is exactly what W66 found for the sigma timescale.

phase 4 - EVALUATION AND BARS, unchanged from W66/W60:
  Consistency-first at a fixed $20,245 drawdown. Per year (5 quasi-independent observations) AND
  rolling 24-month windows, both labelled with their effective sample size - the 22 windows
  overlap 23/24 so their effective independent count is about 1, and this wave will say so on
  the table rather than in a footnote.
  Null: a random-neighbour aggregate of equal size, per W59 amendment_1 (an arm that performs no
  selection must not be dressed in a scan-matched null it cannot fail).

adoption bar: beats the incumbent on the traded-day rate and the drawdown DISTRIBUTION in a
  majority of the 5 years AND does not lose more than 10 % of weekly dollars at a fixed
  drawdown AND clears its null at >= 95th percentile on at least the drawdown metrics AND
  reduces the B-MOM-enabled share of net. The last clause is new and it is the point of the
  wave: an arm that improves the numbers while INCREASING dependence on the fragile half is not
  an improvement.
falsifier: if leaning less on B-MOM costs more production than it saves in drawdown at every
  weight, the recorded conclusion is that the object's dependence on an in-sample component is
  not reducible from inside, and the disclosure stands as the deliverable.
forbidden: [data >= 2026-08-01, selecting k or a tilt window rather than aggregating, presenting
  the cross as a discovery when it is a combination of two arms that each failed, quoting a
  rolling-window fraction without its effective sample size, adopting anything without the
  B-MOM-share clause]
outputs: [out/robust.txt, out/cross.csv, out/consensus.csv, out/tilt.csv, out/nulls.csv,
  REPORT.md]
