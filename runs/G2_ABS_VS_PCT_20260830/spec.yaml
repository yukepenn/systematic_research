run_id: G2_ABS_VS_PCT_20260830
campaign: "#7 WEEKLY_EDGE"
date: 2026-08-30
status: PREREGISTERED
role: RUNNER (measurement only - adjudication is explicitly OUT OF SCOPE for this run)

title: >
  ABS vs PCT showdown: matched NT8 Strategy Analyzer backtests of WeeklyEdgeP1PCT_v1 (incumbent,
  PCT) and WeeklyEdgeP1_v3 (challenger/control, ABS) over one common window, producing two weekly
  P&L series on a shared ISO-week grid. This run MEASURES. It does not adjudicate, promote or
  retire anything.

question_being_served: >
  Does P1/ABS actually make more money than P1/PCT? The recorded ABS->PCT change claimed +39.0 %
  weekly dollars at fixed DD ($885 -> $1,231) but its paired dollar significance was only
  p = 0.057-0.058 - "direction established, magnitude NOT established". This is P1's single
  largest unverified step.

# ---------------------------------------------------------------- window / seal governance
window:
  from: "2022-01-03T00:00:00Z"
  to:   "2026-07-31T21:59:59Z"
  to_rationale: >
    Session-boundary convention (CLAUDE.md section 6): `to` is one second before the NEXT 18:00 ET
    open, so the last included session is the one ending 2026-07-31 17:00 ET.
  lead_in: "2022-01-03 -> 2022-06-30 is warm-up. Retained in the raw run for engine fidelity with
    WE_P1PCT_PARITY_20260827; the analysis grid is reported both full and post-warmup."

seal_decision_and_why_the_requested_window_was_NOT_used:
  requested_by_orchestrator: "to = 2026-08-30T21:59:59Z"
  used_instead: "to = 2026-07-31T21:59:59Z"
  reason: >
    The orchestrator's window would have consumed 2026-08 for P1/ABS. The SEAL AMENDMENT
    2026-08-30 in research/operational/LOCKED_FORWARD.md authorizes a SCOPED burn of August for
    EXACTLY TWO named objects - `P1/PCT` and `XM_CONFLICT_v2` - and then states verbatim:
    "The seal is UNCHANGED and intact for every other object" and "Effective boundary for all
    other objects: >=2026-09-01, which is also SHADOW_START."
    `P1/ABS` is a THIRD, separately-rostered object (PROSPECTIVE_SHADOW.md section 2, own source
    hash e8bb9caf...e0a3d630). It is not named in the scoped burn, so its seal is intact.
  aggravating_clause: >
    LOCKED_FORWARD.md further states: "A challenger may consume virgin data only through a
    preregistered champion-vs-challenger protocol written BEFORE the read." This run IS a
    champion-vs-challenger comparison, so the sealed-data path would have required a
    preregistered protocol AND owner authorization naming P1/ABS. Neither exists.
  cost_benefit_of_the_omission: >
    August contributes ~4 weeks to a ~213-week paired series. It cannot move a paired p = 0.058
    to significance - the marginal N is ~2 %. Meanwhile P1/ABS was placed on the shadow roster
    SPECIFICALLY to settle this question from a common FORWARD timestamp (SHADOW_START =
    2026-09-01 18:00 ET). Burning its only clean pre-shadow month would damage the designated
    instrument of resolution while purchasing essentially no statistical power. The asymmetry is
    decisive, so the clean matched window was used.
  what_the_parent_agent_may_do: >
    Extending ABS through August is an OWNER decision, not a runner decision. If the owner records
    an authorization naming P1/ABS, the identical batch re-runs with to = 2026-08-30T21:59:59Z.
    Nothing in this run forecloses that.

