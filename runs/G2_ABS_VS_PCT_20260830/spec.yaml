weekly_grid:
  convention: "ISO week (isocalendar year-week) keyed on the SESSION date of trade EXIT."
  gap_filling: "Union of both arms' ISO weeks over the window; a week with no trades = 0.0."
  note: >
    CURRENT_BASELINE.md warns maxDD is week-boundary sensitive (a Sunday-ending label moved it
    +5.6 %). ISO-week-on-session-date is the repo convention and is what is used here.

