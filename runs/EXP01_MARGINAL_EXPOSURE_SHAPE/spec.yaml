run_id: EXP01_MARGINAL_EXPOSURE_SHAPE
family: EXP01 (Product-A marginal exposure value shape)
directive: "directive sec28 (marginal exposure value); self-generated per frontier audit (research/system_master/FRONTIER_AUDIT_20260809.md condition e)"
date_frozen: 2026-08-09
author: autonomous research campaign (continuation)

purpose: >
  Directive sec28: "study marginal exposure causally... estimate whether incremental exposure
  value is approximately linear, concave, convex, or state-dependent conditional on shared
  latent state... favor simple mappings." PA0 found raw exposure-band P&L is strictly monotonic
  (1-3 contracts net-negative, 10-13 contracts +$1.88/bar/contract) and U6 found this pattern is
  ">100% mediated by |M_A_raw| conviction magnitude" -- i.e. higher bands simply correlate with
  stronger conviction. The genuinely NEW question EXP01 asks, not tested by PA0 or U6: once |M|
  is controlled for, does marginal per-contract value at each exposure LEVEL (1->2, 2->3, ...,
  12->13) still vary systematically with exposure level itself (a true diminishing/increasing-
  returns-to-scale effect), or does it become flat (linear, i.e. Product A's current KSOLAR/
  KBMOM linear scaling is already well-calibrated to the data)?

not_a_reopening_of_closed_work: >
  PA0 (`runs/PA0_PRODUCT_A_STRUCTURE/REPORT.md`) measured raw exposure-band P&L, unconditional.
  U6 (`runs/U6_PRODUCT_A_PATH_DEPENDENCE/REPORT.md`) explained WHY scale-in contracts are more
  valuable (mediated by conviction) and tested path-dependence of LOW-exposure trajectories
  specifically (1-3 contracts). Neither tested the SHAPE of the marginal-value function across
  the FULL exposure range (1-13) after conditioning on M -- this is a distinct, more specific
  functional-form question.

data_reuse: >
  Zero new CrossTrade/NT8 calls, zero new backtest engine. Reuses runs/U0_UNIFIED_STATE/out/
  u0_state_table.parquet (target_exposure_A, M_A_raw, bar_pnl_A_dollars, action_A) exclusively.

planned_analyses: >
  For every bar where Product A holds a nonzero position, compute a forward-looking marginal
  value proxy per exposure LEVEL (bucket bars by |target_exposure_A| level 1-13, forward-20-bar
  P&L per contract at that level, matching U6/PA0's own established convention). Bucket-
  residualize against |M_A_raw| tercile (the confound U6 already identified) -- report BOTH raw
  per-level marginal value (PA0's own metric, for continuity) AND residualized per-level value
  (the new test). Fit a simple 1-parameter curvature test (quadratic term in an OLS of
  residualized value ~ exposure_level + exposure_level^2, interpretable only, no black box) to
  characterize linear vs concave vs convex shape. Right-tail check (does whichever shape emerges
  concentrate the top-20 blocks' path at particular exposure levels) and chronology (year-by-year
  stability of the curvature sign).

explicitly_not_in_scope_this_run:
  - Any candidate construction, parameter change (e.g. to KSOLAR/KBMOM), or promotion claim.
  - Re-litigating PA0's or U6's own already-published findings -- this reuses, not repeats them.

promotion_gate: none (diagnostic; if a genuine non-linear shape survives conditioning, chronology,
  and right-tail checks, describe -- do not build -- one candidate mapping change for a future
  family, per this campaign's standing bounded-within-family-search discipline)
