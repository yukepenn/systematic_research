authority: "Owner directive V4 amendment section 6 LANE C."

title: >
  LANE C - REVERSAL and RANGE. Together 52.5 percent of all sessions; the base captures +$27 and
  -$317 per session of those classes against level-2 ceilings of $9,096 and $8,765. Every fade this
  campaign ever killed was an UNCONDITIONAL structure fade with no participation term.

what_is_already_closed: >
  Do NOT re-run: unconditional low-range fade (W11/W18), fade-as-event (W40), value-area rotation,
  gap fade (B01e/B02), ORB-failure plus VWAP reacceptance (B01c), failed-flip reversion (DR05-H1b),
  sweep-and-reclaim (E3-A, which found that penetration of a reference level CONTINUES on modern
  NQ). Each is recorded in MECHANISM_COVERAGE_20260826.md with its evidence.

what_is_new_here: >
  a PARTICIPATION term (volume) and a PATH-EFFICIENCY term. Every dead fade above used price
  structure alone, and volume has never once been used as a signal in this program.

geometry: "decide at the bar stamped 11:48, fill at the 11:49 open, hold to 15:44, size 1, no stop."

mechanisms:
  VALUE_REACCEPT: "price left the 09:31-11:29 range and has RETURNED inside it -> trade toward that range's midpoint"
  FAILED_BREAK:   "price closed beyond the morning range and then closed back inside within k bars -> trade the failure direction"
  EXHAUST_VOL:    "the morning extreme was made on a volume-z spike AND the last m bars show declining volume -> FADE the morning direction"
  EFFORT_NO_RES:  "the morning had high volume but LOW path efficiency (abs net over summed abs moves) -> the move was absorbed -> FADE it"
  VWAP_RECLAIM:   "price crossed back through the session VWAP and held for k bars -> trade the reclaim direction"
  PATH_EFF_TRANS: "path efficiency over the last 60 bars is in its bottom causal quartile while range is in its top -> chop with amplitude -> fade the current extreme"

rate_calibration: >
  IDENTICAL outcome-blind procedure to LANE A, and it is the point of the wave. Feature
  distributions are inspected on FEATURE VALUES ONLY and printed before any economics; three
  acceptance rates 25 / 50 / 75 percent are preregistered; thresholds are TRAILING CAUSAL QUANTILES
  over the prior 250 sessions; P and L is read only after freezing. No threshold is ever chosen
  from P and L.

primary: "the equal-weight mean of dollars per trade across the six mechanisms at the 50 percent arm."
falsifier: "the primary is <= 0, or <= the 95th percentile of a coin null on the same statistic."
secondary:
  - "best-of-18 coin null on the individual cells (6 mechanisms x 3 rates)"
  - "each cell's own p-star for the 11:49 -> 15:44 horizon"
  - "SPLIT BY W51 SESSION CLASS - a mechanism that works only on TREND-UP or TREND-DOWN sessions is
     NOT the reversal/range mechanism it claims to be, and is recorded as such"
  - "weekly correlation with P1/PCT and with XM_CONFLICT"

decision_rule:
  - "NOTHING PROMOTED. A pass buys a preregistration for an engine."
  - "A mechanism that is positive overall but negative on REVERSAL and RANGE sessions has
     FALSIFIED its own stated mechanism even if it made money, and is reported that way."
  - "No threshold, rate, window or holding period is re-chosen after seeing P and L."
