  COMPRESSION: trailing-5-day range in the bottom quintile of trailing-60.
  BREAK event: close breaches the prior 5-day high/low ON a compression day.
  Object: hold the break direction for k in {1, 2, 3} days (k=2 primary, fixed).
  Splits: WITH-trend (break agrees with the trailing-20-day drift sign) vs AGAINST-trend.
  CONTROL (mandatory, same wave): matched unconditional breaks (same breach, NO compression).
