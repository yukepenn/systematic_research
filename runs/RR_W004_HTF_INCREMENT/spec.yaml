# ================================================================= features
htf_arm:
  rule: >
    SIX features, frozen here, no search over horizons, no alternatives held in reserve. They
    implement the SLOW SESSION CONTEXT tier named in the owner thesis Part VIII, which
    THESIS_TO_REPO_ADAPTATION already classifies - so this is implementing a named family, not
    inventing indicators.
  columns:
    htf_ret_5d: "log return over the prior 5 COMPLETED sessions' closes, divided by atr_l"
    htf_ret_20d: "log return over the prior 20 COMPLETED sessions' closes, divided by atr_l"
    htf_pdr_pos: "position of the last closed bar within the PRIOR session's high-low range, in [0,1]"
    htf_gap: "(this session's open - prior session's close) / atr_l"
    htf_vol_20d: "standard deviation of the prior 20 COMPLETED sessions' returns, divided by atr_l"
    htf_trend_r2_20d: "R-squared of a linear fit to the prior 20 COMPLETED sessions' closes"
  causality: >
    Every column uses COMPLETED PRIOR SESSIONS plus bars <= i-1 only. This is ASSERTED BY THE SAME
    BLOCKING PERTURBATION GATE RR_W002A used, including its injected leak and lag probes, and any
    feature that moves when its own decision bar is perturbed is DROPPED, never hand-repaired.

