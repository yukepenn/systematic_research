run_id: WE_W58_REOPEN
date: 2026-08-26
campaign: WEEKLY_EDGE (#7)
directive: owner instruction - reopen W40 axis B under the corrected criterion. Extended by me
  to cover every candidate the corrected criterion touches, and to attack the number the owner
  actually cares about and no wave has ever attacked.

the corrected criterion (OWNER_CHARTER_AMENDMENT_2.md):
  RECENT EFFECTIVENESS IS MANDATORY. Old-era weakness is NOT disqualifying. A regime explanation
  is valuable attribution, not a gate. The in-sample objection survives because it is
  statistical rather than chronological.
  And the objective is CONSISTENCY plus small drawdown - positive days, positive traded days,
  positive weeks, longest losing streak, medians, dollars at a fixed drawdown. Sharpe decides
  nothing.

what this reverses for axis B specifically:
  W40 parked it for three reasons. One is now void: "per year it is negative in 2024 and flat
  in 2023". Its RECENT record is the opposite of its full-window one - +$1,946/wk in 2025 and
  +$846/wk in 2026 (runs/WE_W40_SECOND/out/b_years.csv) - so under the corrected criterion it is
  a PASS on the chronology gate, not a fail. A second reason (the weight scan improved
  CVaR-efficiency but not eff) is undermined by W53's finding that a weight scan compared against
  an unscanned reference is worthless. Only the third survives intact: the binding count-matched
  null reached the 92nd percentile against a 95th-percentile bar.

the trap I am walking into, named first:
  "It works in the last two years" is trivially satisfiable by anything that happens to have had
  a good recent run. The owner's criterion is a NECESSARY condition, not a sufficient one, and
  treating it as sufficient would be the same error in the opposite direction from Amendment 1.
  So this wave does not evaluate ONE two-year window. It evaluates EVERY two-year window in the
  sample and asks whether the latest one is representative or exceptional. A sleeve that is
  positive in most rolling 24-month windows has a recent record that means something; a sleeve
  positive only in the latest one does not.

phase 1 - THE ROLLING 24-MONTH RECORD (the honest form of "recent effectiveness"):
  For P1, axis B, B-MOM and BREADTH01, on the persisted daily series, report for EVERY
  24-month window ending each month: net, weekly mean, t, positive-week %, positive-day %.
  Then the summary that decides: what fraction of all rolling 24-month windows are positive,
  and where does the LATEST window sit in that distribution.

phase 2 - THE CONSISTENCY LEDGER, which no wave has ever produced:
  The owner's objective is "constantly 每天每周赚钱" and P1's positive-day rate is 27.6 %,
  the campaign's weakest number. Measure, for P1 and for every P1+sleeve combination at a FIXED
  $20,245 max drawdown:
   a) % of ALL sessions positive, % of TRADED sessions positive, % of weeks positive
   b) longest losing streak in trading days and in weeks
   c) median day and median week
   d) the share of sessions on which the object is FLAT - the mechanical reason the day rate is
      low - and how much each sleeve reduces it
   e) the DAY-LEVEL overlap: on how many sessions do P1 and the sleeve trade the same direction,
      opposite, or one flat - because a sleeve that trades on P1's flat days raises the
      positive-day rate for free, and that has never been measured.

phase 3 - RE-ADJUDICATION under the corrected criterion, one row per candidate:
  axis B, B-MOM, BREADTH01. For each: trailing-24-month sessions/weeks/trades/mean/SE/t, the
  rolling-window distribution from phase 1, the consistency ledger from phase 2, the portfolio
  numbers at fixed drawdown, and the count-matched null RE-RUN ON THE RECENT WINDOW, which is
  the window the criterion now makes relevant.
  State for each whether the remaining objection is chronological (void), statistical (live), or
  in-sample (live and only forward data can settle it).

phase 4 - WHAT WOULD RAISE THE POSITIVE-DAY RATE, measured not speculated:
  P1 is flat on ~40 % of sessions and wins 46 % of the ones it trades. Decompose the achievable
  positive-day rate into (i) trading more sessions and (ii) winning more of them, and price each
  from the existing series. This produces the specification for a CONSISTENCY object, which the
  charter's Pareto frontier has always named and this campaign has never built.

adoption bar: nothing is adopted in this wave. It re-adjudicates and it specifies. Any candidate
  that survives gets its own wave with its own nulls.
falsifier: if the latest 24-month window is an outlier in every candidate's own rolling
  distribution, then "recent effectiveness" is being satisfied by luck rather than by an edge,
  and the corrected criterion must be applied with that stated beside every number.
forbidden: [data >= 2026-08-01, treating recent effectiveness as SUFFICIENT, judging on Sharpe,
  comparing a scanned quantity to an unscanned null, adopting anything here]
outputs: [out/reopen.txt, out/rolling24.csv, out/consistency.csv, out/dayoverlap.csv, REPORT.md]
