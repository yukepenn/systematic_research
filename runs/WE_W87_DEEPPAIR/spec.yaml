run_id: WE_W87_DEEPPAIR
title: "{BMOM + X9a} on the sixteen years the COMBINATION has never touched."
date: 2026-08-26
campaign: weekly_edge (#7)
status: PREREGISTERED

where_this_stands: >
  W86 amendment 2 tested {BMOM+X9a} inverse-vol against six preregistered conditions and it
  scored FIVE:
    (1) all three legs of the corrected rolling gate, majority : 96 % of 25 windows  PASS
    (2) quarterly choice stable under >=2 of 3 objectives       : 2/3 (churn 27/9/36 %) PASS
    (3) independent-shift null SPECIFIC on the drawdown leg     : 92nd pctile  **FAIL** (bar 95)
    (4) positive in 2026                                       : $905/wk  PASS
    (5) NOT P1 in disguise                                     : PASS, decisively - P1 scaled to
        the pair's own top-5 drawdown gives 52.6 % positive weeks, $696/wk and ALL-THREE 0 %,
        against the pair's 57.7 %, $1,044/wk and 96 %.
    (6) composition risk disclosed                             : both members are flagged objects
  The rule was "all six or nothing", so it is NOT promoted. Condition 3 missing by three points
  means the drawdown gain is mostly "two independent streams combined" rather than these two
  specifically - which is W74's real mechanism, not a defect, but it is not what condition 3 asks.

why_a_further_test_is_warranted_rather_than_a_relaxed_bar: >
  The modern window is exhausted: it is all in-sample and 2026-05-31 -> 07-31 is BURNED (W85).
  Lowering condition 3 to let this through would be fitting the bar to the candidate. But there
  IS untouched data - 2006-01-05 to 2021-12-31, 4,279 sessions, sixteen years. W80 ran P1 and X9a
  there as OBJECTS for the first time. **This COMBINATION has never been run on it.**
  That is a real test with real power and it is the right thing to spend rather than a relaxed gate.

the_bar_for_this_wave_fixed_before_running: >
  P1 over 2006-2021 earns 0.92 pts/session, t = 1.62, PF 1.086, 7/16 positive years, and is
  NEGATIVE after the C1 stress line (-$36,494, and about -$81,000 at W82's measured $14.65/RT).
  X9a earns 1.41, t = 2.33, PF 1.136, and is the only one of the two that survives the stress line.
  BMOM standalone over the same years is FLAT (W69: t = 0.93, PF 1.042 on 5,643 trades).
  So both members are individually weak-to-flat there, and the honest prior is that the pair is
  too. The question is whether combining them produces the SAME drawdown reduction it produces in
  the modern window - because a drawdown effect that reproduces across sixteen unseen years, in a
  period when neither member makes money, is a structural property rather than a modern artifact.

  PREREGISTERED PASS CONDITION, one only, and it is about RISK not return:
     the pair's mean top-5 drawdown over 2006-2021, at matched nominal exposure, is at least 25 %
     smaller than P1's over the same years.
  PREREGISTERED FALSIFIER:
     if the pair's deep-era drawdown profile is NOT better than P1's, the modern 96 % is a
     property of 2022-2026 and the candidate is closed. This is a real possibility and it will be
     reported as a closure, not softened.

  A return result either way is reported but decides nothing: sixteen years in which the object
  earns 6 % of its modern rate cannot adjudicate a money claim.

adoption: >
  NOTHING is adopted in this wave. A pass makes {BMOM+X9a} the campaign's first
  challenger-confirmed object in 50 waves, presented to the owner with its full cost and its two
  disclosed composition risks; the decision to switch remains his.
