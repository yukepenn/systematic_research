engine_377_value_area_rotation:
  value area: prior RTH volume-weighted price histogram (3m close x volume, 25c bins), VA = the
    minimal price band around VWAP containing 70% of volume.
  event: RTH open OUTSIDE prior VA, then 30 min (10 bars) of closes back INSIDE VA ("acceptance")
    -> enter at next 3m open toward the OPPOSITE VA edge; exit at opposite edge touch or 15:54
    time-stop. One event/session max.
  pass: net t_NW >= 2, N >= 150, WF 2022-24 vs 25-26 same sign, plateau: VA coverage {60,70,80}%
    and acceptance {21,30,39}min all same-sign (center 70%/30min).
engine_378_multiday_false_break:
  event: session RTH close beyond the prior 20-session RTH close extreme, followed within 2
    sessions by an RTH close back inside the prior range -> enter next 3m open after that
    close-back-inside (09:33 next session if signal at close), target = midpoint of the
    20-session range, exit at target touch or after 3 sessions; positions HELD OVERNIGHT
    (disclosed: engine is NOT day-only; portfolio fit assessed only if it passes).
  pass: net t_NW >= 2, N >= 80 (swing rate ~1-2/wk), WF same sign, plateau lookback {10,20,40}d.
engine_379_month_end_flow:
  event: last 2 trading days of month, sign = OPPOSITE of the month-to-date NQ return sign
    (rebalancing-flow prior); hold RTH-only both days (09:33 -> 15:57), day-only.
  pass: net t >= 2, N >= 100 day-events, sign consistent across 2022-2026 AND old-regime
    2006-2021 direction check on the hist substrate closes (calendar mechanisms should be
    structural or die).
verdict_rule: per-engine PASS -> Stage 2 spec later; FAIL -> killed; slate-2 total failure ->
