run_id: GENESIS_H1_VOLSTATE_20260828
campaign: GENESIS
type: SIGNAL_DIAGNOSTIC   # atlas H1, charter section 54: signal first, NO policy, NO P&L claim
question: >
  Does the VX term-structure state (front-month basis vs spot VIX) carry conditional information
  about the NEXT NQ session's close-to-close return BEYOND NQ's own trailing realized vol?
state_primary_frozen: >
  BASIS(s) = VX front-month settlement(s) / VIX close(s) - 1, computed at session s settlement
  (known ~16:15 ET, strictly before the 18:00 ET open of session s+1). Front month = nearest
  contract with expiry strictly after calendar date of s; roll to next on expiry day.
  Terciles of BASIS computed on TRAILING 252-session window (causal, no full-sample quantiles).
secondary_non_gate: VXN/VIX ratio state (2009-09+); VIX3M/VIX ratio state. Reported, never gates.
target: next-session close-to-close NQ return (points and %), session_id unit, END-stamped closes.
data:
  - certified VX settlements + VIX (runs/GENESIS_FREEDATA_CBOE_20260828/certified/) — EXCLUDE all
    rows before 2007-03-26 (LEGACY_10X_SUSPECT scale regime; excluded, not rescaled)
  - NQ session closes: deep parquet (2006->2026-05) for sessions through 2021; modern parquet
    (2022->2026-07-31) for 2022+; returns computed WITHIN each substrate only; the splice return
    is dropped (back-adjustment regimes differ; +282.25 trap)
  - all loads through research_sdk.seal_guard.assert_presealed
windows:
  discovery: 2007-04-01 -> 2021-12-31 (consumed-data DISCOVERY layer)
  confirmation_one_shot: 2022-01-01 -> 2026-07-31, chronological, frozen rule, read ONCE
  ceiling: DISCOVERY-GRADE (all history is consumed for NQ outcomes; stronger = prospective only)
gates_all_coded_and_printed:
  F1_discovery_separation: t_clustered(mean next-session return, BASIS tercile T1 - T3) >= 2.0
    with the SAME sign in both discovery halves (2007-2013 / 2014-2021).
    Expected sign (preregistered): T1 (deep contango... NOTE - low basis = backwardation) —
    convention pinned in code: T3 = highest basis = steep contango = risk-on -> HIGHER mean
    next-session return than T1 (backwardation/stress). Gate is on T3 - T1 > 0.
  F2_rv_control: within trailing-21-session NQ realized-vol tercile strata, pooled matched
    (T3 - T1) difference keeps its sign and clustered t >= 1.5. If BASIS collapses under the RV
    match, the information is NOT new — FAIL.
  F3_null: real T3-T1 statistic above the 95th percentile of >= 300 whole-session circular shifts
    of the STATE series against the return series (research_sdk.null_guard.run_circular_null;
    verify_null_sensitivity must pass first).
  F4_confirmation: same frozen rule on 2022->2026-07; T3 - T1 same sign, clustered t >= 1.0.
    Read only if F1..F3 all pass. One shot; a FAIL closes the family at this formulation.
independent_implementation: >
  BEFORE the F4 read: the BASIS state series is recomputed by a second implementation written
  without importing the primary (AST-checked); parity on state terciles >= 99.5% of sessions,
  else STOP.
prohibitions: no trading policy, no sizing, no stops, no P&L, no parameter search (252/21/terciles
  are frozen here), no VXN gate, no post-hoc window changes, no sealed reads.
outputs: out/gate_table.txt (GATE/SPEC/OBSERVED/PASS-FAIL printed by program), out/state_series.csv
  (pre-seal), out/diagnostics.txt, out/ledger_result_pending.json
power_note: ~3,700 discovery sessions; MDE for t=2 at sd 1.3%/session ~ 0.09%/session tercile
  spread pooled — the gate can only see economically material conditioning; stated in advance.
live_enabled: NO
spend: $0
