run_id: G3_CLOCKLAG01_20260831
title: "Does NQ carry cross-day periodicity at a MATCHED CLOCK BUCKET - the scheduled-flow trace -
        and is it distinguishable from generic within-day momentum? STAGE 1 IS STRUCTURAL ONLY."
date: 2026-08-31
campaign: GENESIS III - NQ CHAMPION CHALLENGE / WAVE C
status: PREREGISTERED - written and committed BEFORE any statistic was computed
live_enabled: NO
spend: 0
