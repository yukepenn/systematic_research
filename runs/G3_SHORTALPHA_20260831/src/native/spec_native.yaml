# dL (line 1126) and only nMemLong (line 1112). So the LITERAL "aggregate what the .cs already
# computes, inventing nothing" reading is a DIFFERENT object from both W61 and votes()[1]:
#       voteShort = (nMemShort * nThr * (1 + dL)) >= 16          <- reuses the LONG gate
# and a third reading drops the gate entirely:
#       voteShort = (nMemShort * nThr * 2) >= 16                 <- no delta gate
# These are the only untested aggregations of the discarded set-level target. If either is
# materially different AND better, the closure reopens.
#
# G5_VARIANTS:
#   arms:  S_dS (= votes()[1] = W61)  |  S_dL (long gate reused)  |  S_nogate
#   spec:  bar-level agreement vs S_dS, and net $ at the PRIMARY $20.65 cost-consistent line,
#          PRE and MODERN, plus a 1,000-draw circular-shift null on any arm that beats S_dS.
#   verdict rule, fixed in advance:
#     REOPEN only if a variant is (a) < 99 % bar-agreement with S_dS, AND (b) net > 0 on BOTH
#     PRE and MODERN at $20.65, AND (c) >= 95th percentile of its own circular-shift null on
#     BOTH strata. Anything less leaves the closure standing.
