# ==================================================================================================
# 0. WHY THIS RUN EXISTS
# ==================================================================================================
problem: >
  The strategy that is actually traded is the C# object. Every economic claim this campaign has ever
  made about P1 was computed by a Python approximation of it. T2_P1SIZE01 measured that the two
  disagree: recomputed causal score matched the ledger on only 81.21% of scored entries, while the
  derived SIZE matched NT8 qty on 99.04% (2377/2400). A 99% size agreement was accepted as parity.
  It is not parity. It is an aggregate that hides an 18.79% disagreement in the underlying statistic,
  and it was never established WHICH object is right or WHY they differ.

what_the_source_already_settles: >
  Read directly from source before this run and stated here so the result cannot be reverse-fitted:

    WeeklyEdgeP1PCT_v3.cs:1131-1152  the quality features are built from lagClose / lagAtr /
      lagVwap / lagRunLen / lagCumDelta / lagVolNorm - the LAGGED cache.
    WeeklyEdgeP1PCT_v3.cs:1197       CacheLagged() is called at the END of OnBarUpdate.
      => during processing of bar b, lag* holds bar b-1's values.
    WeeklyEdgeP1PCT_v3.cs:1174-1182  the entry order is submitted at bar b and fills at Open of b+1.

    run_we_w98.py:69   want = dir_arr[i-1]        (direction decided at bar i-1)
    run_we_w98.py:74   epx  = o[i]                (fill at bar i open)
    run_we_w98.py:71   u    = size_at_entry[i]    (size read at the FILL bar index i)
    we_quality.py:44-59 / we_fastctx.py           X[k][j] is built from bar j-1's close.

  Therefore, writing the fill bar as i:
    DIRECTION   C#: bar i-2   Python: bar i-2    - AGREE
    QUALITY     C#: bar i-2   Python: bar i-1    - DISAGREE BY EXACTLY ONE BAR

  Both are causally legal. Python's score uses the close of the decision bar itself, which is known
  at the decision instant. The C# uses the close of the bar before that. The executable is the
  STALER of the two, and the executable is what trades. The research object has been crediting the
  sizing layer with an information set the deployed strategy does not have.

hypothesis_to_be_tested_not_assumed: >
  The source read above is a HYPOTHESIS about semantics, not a result. This run tests it against
  353,878 rows that the executable object itself wrote, and it must be possible for the hypothesis
  to lose. If H_STALE does not win P3 outright, the source read is wrong and this spec says so.

