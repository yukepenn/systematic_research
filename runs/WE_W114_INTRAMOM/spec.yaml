run_id: WE_W114_INTRAMOM
campaign: "#7 WEEKLY_EDGE"
date: 2026-08-27
status: PREREGISTERED
authority: "Owner MEGA DIRECTIVE V5 sections 5, 19, 20, 24, 33, 44. Raised by W112 section 5."

title: >
  INTRADAY MOMENTUM - the afternoon continues the morning. It has been sitting in the CONTROL
  column of two waves earning more than the objects those waves were testing, and it has never once
  been preregistered, nulled, cost-tested or looked at outside the discovery window.

the_observation_that_raised_it:
  W111b: "unconditional FOLLOW morning direction, 1,008 in-window sessions: +$177/contract, and the matched FADE arm was -$206"
  W112: "the same rule on 688 WALK-FORWARD out-of-sample sessions: +$190/contract at 55.04 %, BEATING a 17-feature ridge model that reached $181"
  why_it_is_not_drift: >
    always-LONG has the SAME 55.04 % accuracy on those sessions and earns $1/contract. The money is
    in the SHORT leg - the afternoon continues a DOWN morning too. That is what separates this from
    the 2022-2026 uptrend, and the wave must verify it leg by leg rather than assert it.

mechanism_card:
  source: "our own control column, twice; and it is a published effect - intraday market momentum, first-half-hour return predicting last-half-hour return, documented on SPY since roughly 2018"
  new_information: "NONE. This uses only the morning's net direction, which every engine here already sees. Its claim is about the ACTION, not about new data."
  causal_mechanism: >
    Intraday inventory and rebalancing: the direction established in the morning auction is carried
    into the close by late-day flow that must trade the same way. If real, it is a flow effect, not
    a forecasting effect.
  why_prior_failures_may_not_apply: >
    Seven fades were killed in this campaign; this is their MIRROR, and the fade kills are therefore
    weak positive evidence for it rather than evidence against. But W112's own stability table shows
    the effect concentrated in 2025, which is the reason for the recency and out-of-window bars below.
  cheapest_falsifier: "it does not clear its coin null on 2006-2021, sixteen years this campaign has never mined for it"
  portfolio_role: "a candidate SECOND directional engine, orthogonality to P1/PCT unknown and to be measured"

geometry:
  primary: "decide at the bar stamped 11:48, direction = sign(close 11:29 - open 09:31), fill at the 11:49 open, hold to the 15:44 close, size 1, no stop."
  why_this_one: "IDENTICAL to W108, W109, W111 and W112 so the result lands beside four existing measurements. It is also the exact geometry the observation was made at, and re-choosing it now would be selection."
  cost: "$4.36/ctrRT commission + the W82 contract-weighted spread at minutes 709 and 944, the same charge every wave at this geometry has paid."

primary:
  statement: >
    A CONJUNCTION, and both halves must hold. The modern window is discovery-consumed - this rule
    was found inside its own control column - so a modern-window pass alone is not evidence.
  half_1: "on 2022-07-01 to 2026-08-01: net dollars per contract > 0 AND > the 95th percentile of a single-cell coin null (2,000 draws), AND directional accuracy > p-star computed for this geometry."
  half_2: "on 2006-01-01 to 2021-12-31 - SIXTEEN YEARS THIS CAMPAIGN HAS NEVER MINED FOR THIS RULE - the same three conditions, independently."
  falsifier: "either half fails. There is no partial credit and no 'it works in the modern regime' escape hatch unless the wave is explicitly relabelled REGIME_LOCAL, which requires half 2 to fail while half 1 passes AND is a demotion, not a result."

out_of_window_note: >
  This rule needs NO ES/RTY/YM substrate and NO memory arrays - it is pure NQ OHLC - so unlike
  XM_CONFLICT it CAN be tested on the deep history, and that history has never been looked at for
  it. Cost on 2006-2021 is charged at the MODERN spread profile, which is generous to the old
  period because spreads were wider then; a 2x-spread sensitivity is therefore mandatory and is
  reported beside it.

secondary:
  - "LONG LEG AND SHORT LEG SEPARATELY, both windows. If the whole effect is one leg, say so - a one-sided result on a rule whose whole defence is two-sidedness would be a withdrawal, not a nuance."
  - "MATCHED UNCONDITIONAL CONTROLS in the same table - always long, always short, and the FADE arm - per the rule W111b made binding."
  - "recency: per calendar year, and trailing 3 / 6 / 12 months. Section 5 makes recency primary and W112's table already shows the modern result concentrated in 2025. If t6m and t3m are negative that must lead the report."
  - "cost sensitivity: 0x, 1x, 2x and 3x the W82 spread, so the reader sees where the edge dies."
  - "session-class split, DIAGNOSTIC ONLY, beside W108's five fades and W111's five volume mechanisms."
  - "concentration per section 25: top-1/5/10/20 contribution, median trade, trimmed mean, skew, worst trade."
  - "DECISION-MINUTE PLATEAU: the same rule at decision minutes 11:18, 11:33, 11:48, 12:03, 12:18 and exits 15:29, 15:44, 15:59. Reported as a PLATEAU, never as an argmax, and NOT part of the primary. A rule that works only at exactly 11:48 is an artifact and must be reported as one."
  - "portfolio: weekly correlation with P1/PCT and with XM_CONFLICT, and the marginal fixed-drawdown value of adding it at inverse-vol weights."

decision_rule:
  - "NOTHING PROMOTED BY THIS WAVE. A pass buys a preregistration for an engine and a mechanism-card upgrade."
  - "There is NO selection here - one rule, one geometry, no parameters, no threshold, no acceptance rate. A single-cell coin null is therefore the correct null and no best-of-K bar applies to the primary."
  - "The decision-minute plateau is a robustness READ. Its best cell may not be quoted, promoted, or substituted for the 11:48 primary under any circumstance."
  - "If half 1 passes and half 2 fails, the object is REGIME_LOCAL and that is recorded as a demotion of confidence, exactly as the P1/PCT box denominator was."
  - "No geometry, cost model, window or leg is re-chosen after results are seen."
