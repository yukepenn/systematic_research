the_promotion_is_void: >
  Amendment 1 preregistered: "the promotion is VOID if ... the two-member subset {BMOM, X9a}
  performs as well as the three-member clique - in which case the clique is not a three-stream
  portfolio at all and the third member is decoration."
  Measured on the corrected gate at $14.65/RT:
      {AXISB+BMOM+X9a}   ALL-THREE 68 %   weekly $650   top5DD $9,489   2026 $439/wk
      {BMOM+X9a}         ALL-THREE 96 %   weekly $1,044 top5DD $11,158  2026 $905/wk
      {AXISB} alone      ALL-THREE  0 %   weekly $162   top5DD $27,593  2026 -$170/wk
  The two-member subset does not merely match the three-member clique, it beats it on every leg.
  **CLIQUE inv-vol's promotion in read 1 is WITHDRAWN.** AXISB was decoration and worse - it was
  a drag: it costs 38 % of the weekly dollars and 28 points of the all-three rate.

what_this_does_NOT_license: >
  {BMOM+X9a} was found by a leave-one-out SEARCH over 7 subsets. Promoting it on that search would
  be precisely the error the campaign has recorded four times. It is a CHALLENGER and it must
  earn the same four conditions the clique was held to, plus two more that its composition
  demands.

the_new_challenger: "{BMOM + X9a}, inverse-volatility weighted, frozen."

the_six_conditions_it_must_meet:
  1: "majority on all three legs of the corrected rolling gate (already measured at 96 %,
      re-confirmed here as part of the record)."
  2: "the quarterly choice against P1 stable under >= 2 of 3 objectives, churn < 35 %."
  3: "the independent-shift null SPECIFIC (>= 95th percentile) on the raw drawdown leg."
  4: "positive in 2026 on the extended window."
  5: >
     NEW, and it is the one this composition demands: IS IT JUST P1 IN DISGUISE? X9a is rho = 0.673
     with P1 and W81 measured the two as statistically indistinguishable at the object level
     (paired t = -0.81 modern, +1.35 deep). BMOM is rho = 0.314 with P1. So {BMOM+X9a} may be a
     re-weighting of P1 rather than a portfolio. Test: the pair's correlation with P1 on DAILY and
     WEEKLY series, and whether an exposure-matched blend of P1 alone reproduces its numbers. If
     a simple `alpha*P1` scaled to the same top-5 drawdown matches it on all three legs, it is not
     a portfolio and the finding is void.
  6: >
     NEW: BOTH members are objects this repo has independently flagged. BMOM is regime-local
     (flat pre-2022, t = 0.93 over 5,643 trades, latest window at the 98th percentile of its own
     history). X9a is a full P1-shaped object. Report the pair's per-year record and its
     deep-history behaviour where available, and state the inherited risk explicitly rather than
     letting the portfolio's smoothness hide it.

preregistered_decision_rule: >
  all six or nothing. Failing condition 5 (it is P1 in disguise) is the most likely and the most
  important, and it will be reported first regardless of the others.
adoption: "NOTHING is adopted by me. A pass produces a recommendation with its full cost stated."
