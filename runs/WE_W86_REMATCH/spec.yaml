run_id: WE_W86_REMATCH
title: "The rematch: P1 against the two objects W85 un-rejected — done properly, with the money
        question answered in dollars and contracts."
date: 2026-08-26
campaign: weekly_edge (#7)
status: PREREGISTERED

why: >
  W85 established that the rolling gate used in W78-W84 cannot pass an object that is strictly
  better than the champion ("P1 + $200 free money every session" scored ALL-THREE 0 %). On the
  corrected gate four verdicts reverse: the W78 pair (0 -> 84 %) and the W79 clique (0 -> 68 %).
  W85 deliberately promoted nothing, because a reversal caused by fixing my own error deserves
  more scrutiny, not less. This wave is that scrutiny.

  The owner's instruction for this wave is explicit: **we need to make money.** So the money
  question is not a footnote here - it is a phase, answered in dollars, contracts and drawdown.

champion: "P1, frozen."
challengers:
  - "PAIR w=0.30      (W61's preregistered weight, never re-tuned)"
  - "PAIR 2:1         (w = 1/3, the integer-tradeable form)"
  - "CLIQUE equal     {AXISB, BMOM, X9a}"
  - "CLIQUE inv-vol   same members, inverse-volatility weights"
  note: >
    the clique is an ALTERNATIVE to P1, not an addition - X9a is rho = 0.673 with P1. No new
    combination is invented in this wave; every object here already existed before W85.

phases:
  0_power_check_first: >
    the oracle battery from W85 re-run against this wave's exact gate implementation. Four
    synthetic objects that dominate P1 by construction must pass at >= 75 %. If they do not, no
    verdict is issued. This is now a standing precondition for any gate in this campaign.
  1_the_corrected_rolling_gate: >
    rolling 24-month windows: weekly $ at a fixed $20,245 max drawdown, positive-week %, and RAW
    mean top-5 drawdown at matched nominal exposure. Majority on all three.
  2_walk_forward_THREE_WAYS: >
    W78's walk-forward failed at 58 % retention - but it selected the weight by maximising money
    alone, which is the wrong objective under the owner's stated ordering. Re-run the quarterly
    choice THREE times, selecting on (a) positive-week %, (b) raw top-5 drawdown, (c) money at a
    fixed drawdown, and report all three with churn. If the choice is unstable under every
    objective, that is the finding and it is decisive against the challenger regardless of the
    gate.
  3_nulls: >
    for each challenger, the null that matches its construction. For the PAIR: circularly shift
    the short sleeve's daily series against P1's, preserving both marginals, destroying only
    alignment (200 draws) - W78 measured the drawdown leg SPECIFIC at the 98th percentile on the
    OLD metric and it must be re-measured on the RAW one. For the CLIQUE: shift each member
    independently (200 draws).
  4_THE_MONEY_TABLE: >
    The phase the owner asked for. For every object, at W82's measured $14.65/RT:
      * weekly $ and annualised, per unit
      * contracts required for $150k/year, and the max drawdown AND mean top-5 drawdown that
        implies
      * the same at a matched MEAN TOP-5 DRAWDOWN rather than a matched MAX drawdown, because
        max drawdown is a single-observation statistic (method rule 15) and the top-5 mean is
        what a trader actually lives through repeatedly
      * 2026 and trailing-12-month rates alongside the full window, since the owner's binding
        constraint is recent performance
  5_per_year: "every year, positive-week % and weekly $, at the measured friction."

preregistered_decision_rule:
  promote_to_recommended_object_only_if: >
    (1) majority on all three legs of the corrected rolling gate, AND (2) the quarterly choice is
    stable under at least two of the three walk-forward objectives with churn < 35 %, AND (3) the
    null shows the benefit is not reproduced by an arbitrarily-timed stream on at least the
    drawdown leg, AND (4) it is positive in 2026 on the extended window.
  if_the_null_says_generic: >
    that is NOT automatically fatal for a portfolio - W74 established that adding an independent
    stream is generically valuable and that is a real mechanism, not an artifact. But it changes
    the CLAIM from "this pairing is special" to "a second stream of this size helps", and the
    recommendation must then be stated that way.
  what_is_recommended_is_still_the_owners_decision: >
    any object that passes is presented with its full cost - money given up, drawdown bought,
    consistency bought - in both columns. I do not switch the baseline unilaterally.

traps_named_before_running:
  - "Four challengers x three walk-forward objectives x two frictions is a scan. The oracle
     battery, the nulls and the per-year table are the controls."
  - "The clique's members are individually flawed and that has not changed: AXISB is 2025-only on
     the extended window (weekly $ per year -436/-48/-41/+1201/-126) and BMOM is the component
     W67-W69 disclosed as regime-local. A portfolio of flawed components can still be a good
     portfolio, but the flaw travels with every number."
  - "The extended window is in-sample throughout, and 2026-05-31 -> 07-31 is BURNED (W85 defect 2
     - W01 had already read and selected on it). Nothing here is out-of-sample and it will not be
     described as such."
  - "I am re-testing objects I previously rejected, after discovering my own instrument was
     broken. The gate is the CORRECTED one, written in W85 before these objects were re-scored,
     and the promotion rule above is STRICTER than W78's (which had two conditions, not four)."
