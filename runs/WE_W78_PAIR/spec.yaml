run_id: WE_W78_PAIR
title: "Champion vs challenger: P1 alone against P1 + the short sleeve at the PREREGISTERED
        w = 0.30, on the full extended window that now contains a genuine regime turn."
date: 2026-08-26
campaign: weekly_edge (#7)
status: PREREGISTERED

why_now: >
  On the full extended window (2022-07-04 -> 2026-07-31, 213 weeks, now including the 46 sessions
  W76 read for the first time) the pair at W61's preregistered w = 0.30 beats P1 alone on SEVEN
  metrics with no trade-off:
      positive weeks     56.3 % -> 60.6 %
      longest weekly losing streak   8 -> 4
      median week        $279 -> $622
      max drawdown       $24,225 -> $19,435
      mean top-5 drawdown $16,590 -> $10,564
      worst week         -$7,418 -> -$6,314
      weekly $ at a FIXED $20,245 drawdown   $1,099 -> $1,154
  and in the never-seen window it cut the loss from -$20,686 to -$11,041 (-47 %).

  The short sleeve has been rejected four times - W38 (efficiency), W39, W61 (recency), W75
  (recency, and on TRUNCATED data, which W76 corrected). EVERY ONE of those rejections was
  measured on a window in which the long side never had a bad stretch. That is the reason this
  is re-opened, and it is a reason about the EVIDENCE, not about the result.

what_this_wave_is_NOT: >
  It is not a promotion. Seven-of-seven on a full sample is exactly what four previously-killed
  candidates also showed. The tests below are the ones that killed them, and the pair has not
  faced any of them on the extended window.

champion:   "P1, frozen."
challenger: "0.70 x P1 + 0.30 x SHORT. w = 0.30 comes from W61 and is NOT re-tuned here.
             The integer-tradeable 2 long : 1 short (w = 0.333) is reported alongside, because a
             weight that cannot be traded in whole contracts is not a deliverable."

tests_in_the_order_that_decides:
  1_rolling_windows: >
    THE TEST THAT HAS KILLED FOUR CANDIDATES. Fraction of rolling 24-month windows in which the
    challenger beats the champion on (a) weekly $ at a fixed $20,245 drawdown, (b) positive-week
    %, (c) mean top-5 drawdown - and on ALL THREE. W61 measured all-three at 5-14 % on the
    truncated window. The preregistered bar is ALL THREE IN A MAJORITY OF WINDOWS.
  2_null: >
    N1, 200 draws: circularly shift the short sleeve's DAILY series against P1's, preserving its
    marginal distribution and destroying only its alignment. This asks whether the gain comes
    from WHEN the sleeve trades or merely from adding an independent stream. W74 already answered
    this for the positive-week rate (GENERIC), so the honest expectation is that it is generic
    here too - and if so, that is recorded as "the second stream is what matters", not as a
    failure of the pair.
  3_per_year: >
    Every year including the extended 2026, both objects, pts/session and weekly $ at fixed
    drawdown. The pair must not be a 2026 artifact.
  4_walk_forward: >
    Re-choose w quarterly from {0, 0.1, ..., 0.5} on a trailing year and trade only the next
    quarter. W29's standing bar is that >= 80 % of the fixed-quote figure survives an honest
    refit. Report choice churn.
  5_exposure: >
    Time-weighted contract-minutes for both objects. If the pair simply carries less exposure,
    its drawdown improvement is arithmetic, not diversification, and the fixed-drawdown column is
    the only honest comparison.
  6_friction: "both lines - net $4.36/RT and the C1 stress line at $14.36/RT."

preregistered_decision_rule:
  promote_to_baseline_only_if: >
    (1) all three rolling-window metrics beat the champion in a MAJORITY of 24-month windows,
    AND (2) the walk-forward retains >= 80 %, AND (3) the per-year table shows the pair is not
    carried by one year. The null is NOT a promotion gate here - W74 established the mechanism is
    generic - but it is reported so the claim made is the true one.
  if_it_fails_rolling: >
    recorded as: the pair's full-sample dominance is not stable across sub-periods, the four
    prior rejections stand on better grounds than they were given, and P1 remains the baseline
    with the pair as a documented alternative carrying its own numbers.
  what_is_said_to_the_owner_either_way: >
    the honest status. The owner asked directly whether this is the new baseline; the answer is
    determined by these tests and not by the seven-of-seven table that motivated the wave.

traps_named_before_running:
  - "The extended window is now IN-SAMPLE. Nothing here is out-of-sample and it will not be
     described as such."
  - "w = 0.30 is preregistered, but the SET of weights shown is a scan; only w = 0.30 and the
     tradeable w = 1/3 may be quoted as the challenger."
  - "The short sleeve's own 2026 is -$11,054, its worst year, and its forward-window gain was
     206 % concentrated in three days. Both facts travel with every number in this wave."
