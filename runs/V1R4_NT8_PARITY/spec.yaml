# ---------------------------------------------------------------- pre-registered pass/fail bar
promotion_standard:
  net_profit_tolerance: "|NT8_net - py_net| / |py_net| <= 1.0% -- looser than the RK Replica
    precedent's exact-to-the-penny result because these 3 objects are materially more complex
    (multi-series alignment, tilt/HTF state, B-MOM leg, day-only overlay, C4 flatten schedule)
    and have NEVER been certified even once at any tolerance; a first-pass 1% band is the
    disclosed bar, not a moved goalpost -- tightening it is a LEGITIMATE follow-up (V5), not
    required for this run's own PASS/FAIL determination."
  trade_count_tolerance: "exact match preferred; a difference of 1 trade is tolerated ONLY if
    attributable to the same documented data-boundary serialization quirk as the RK Replica
    precedent (a position still open at the data boundary being invisible to NT8's own
    TradesCount/serialized list, CLAUDE.md 'Conventions that bite') -- any other count mismatch
    is a FAIL requiring root-cause diagnosis, not dismissal."
  known_caveat_not_relitigated: "BEST_ONE_MNQ's known daily-correlation gap (~0.8996 vs >=0.999,
    5 named sessions) is a SEPARATE, already-diagnosed open item from FINAL_CAMPAIGN_BASELINE.md
    sec 3 -- if this run's net-profit/trade-count comparison passes its own tolerance bar above,
    that is a genuine result on its own terms (aggregate parity), not a claim that the daily-
    correlation gap is resolved; if it does NOT pass, the two issues will be disentangled before
    concluding the discrepancy is the SAME known issue."
  disposition_rule: "CERTIFIED (parity PASS) if both tolerances clear; NOT CERTIFIED (parity FAIL,
    root-cause required per the addendum's 'no unexplained failures' rule) otherwise. No
    threshold in this section may be adjusted after the NT8 job results are read."
