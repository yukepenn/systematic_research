run_id: CAP01B_RUIN_CORRECTION_20260901
title: "CAP01 CORRECTED: drawdown-from-peak is not ruin; horizons were 34% long"
supersedes_headline_of: CAP01_CAPITAL_RUIN_20260901
committed_before_results: true
date: 2026-09-01
classification: ENGINEERING_ONLY / RISK_ACCOUNTING / DEFECT_REPAIR
