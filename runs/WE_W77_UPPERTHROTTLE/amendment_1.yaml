run_id: WE_W77_UPPERTHROTTLE
amendment: 1
date: 2026-08-26
status: DEFECT CONFIRMED — the phase-0 mechanism claim is WITHDRAWN. The wave's VERDICT stands.

the_defect: >
  Flagged by the independent 11-agent audit, re-derived by me. `run_we_w77.py:85` builds the
  decile sort key as
      term_ratio = X["ratio"][en[s]]
  i.e. the range ratio at the session's LAST bar - which is the session's OWN COMPLETE REALISED
  RANGE. Sorting sessions into deciles by that and then reporting P&L by decile CONDITIONS THE
  DESCRIPTIVE STATISTIC ON THE OUTCOME. PRINCIPLES.md's standing rule binds diagnostics
  explicitly ("including one that appears only in a DIAGNOSTIC"), and this is the fifth
  full-sample/outcome-conditioned casualty in the repository.

the_measurement, same P&L, three sort keys: >
      sort key                      top-2 deciles      bottom-2 deciles
      TERMINAL ratio (as W77 ran)          72.0 %             -18.5 %
      PREVIOUS session (causal)            15.8 %              17.8 %
      TRAILING-5 sessions (causal)         28.4 %              28.6 %
  With a key that is actually knowable before the session opens, the most "violent" 20 % of
  sessions carry 15.8 % of the net against the quietest 20 %'s 17.8 % - i.e. NOTHING.

what_is_withdrawn: >
  "The most violent 20 % of sessions carry 72 % of P1's net, so an upper volatility throttle
  would be cutting the sessions the object lives on." That sentence is an artifact of the sort
  key. It appeared in WE_W77/REPORT.md, in STATE_OF_THE_SYSTEM.md, in the campaign memory, and
  in what I told the owner ("波动率不是问题，方向是" was justified with this table).

what_STANDS: >
  THE WAVE'S VERDICT IS UNAFFECTED. All ten upper-throttle arms used CAUSAL keys - U1 the running
  within-session ratio, U2 the prior session's terminal ratio, U3 the trailing-5 mean - and every
  one failed its preregistered bar independently of the decile table. "An ex-ante upper volatility
  throttle does not help" remains supported.

the_corrected_mechanism_statement: >
  Sessions that TURN OUT large carry the P&L - which is close to tautological for a trend
  harvester - and they CANNOT BE IDENTIFIED IN ADVANCE: a causal volatility sort separates the
  best decile group from the worst by 15.8 % vs 17.8 % of net. That is a cleaner statement than
  the one it replaces and it is consistent with W51's finding that the information about a
  session arrives at roughly the same rate as the opportunity to act on it disappears.

method_note: >
  The generalisation worth keeping: A SORT KEY IS A GATE. Any table that buckets outcomes by a
  variable must use a variable available at the decision point, or it describes hindsight rather
  than the market. Deciles, quintiles and "top-N" tables are where this hides, because they feel
  descriptive rather than predictive.
