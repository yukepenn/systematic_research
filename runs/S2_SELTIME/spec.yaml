arm_B_disclosure: >
  S0 flagged a striking pooled divergence: BMOM's worst block (AFTERNOON, 13:30-15:45 ET,
  -$44,253) is Solar's best (+$53,330). Directive §5 Arm B requires eligibility be "justified by
  repeated chronology, not one pooled P&L curve" BEFORE it is proposed as a candidate, not merely
  gated after running. A year-by-year pre-check (descriptive only, no fitting) of BMOM's
  AFTERNOON P&L: 2022 -$14,502, 2023 +$2,688, 2024 +$7,180, 2025 -$30,693, 2026 -$8,927 -- only
  3 of 5 years negative, and the pooled total is dominated by a single year (2025, -$30,693, more
  than the full pooled -$44,253). This FAILS the repeated-chronology precondition on its face.
  Running Arm B anyway would very likely produce a foregone, uninformative fail and would waste a
  frozen-arm slot on a candidate already known to be weak. Per §20 rule 4 ("diagnostics do not
  automatically license policy") and the cheap-falsification instruction, **Arm B is not frozen
  this wave**. This decision, and the exact numbers behind it, are recorded here rather than
  silently dropped (V6 append-don't-rewrite spirit) — a future wave MAY revisit BMOM
  eligibility with a genuinely different candidate window if one clears this same pre-check.
