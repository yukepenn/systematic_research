family: DOM01_LIQUIDITY_STATE
directive: "Addendum to Master Directive v3, sec E0-E6"
frozen_before_results: true
date: 2026-08-09
information_class: NQ_LEVEL2_DOM

hypothesis: >
  Resting-liquidity dynamics (near-touch/multi-level imbalance, book slope, wall persistence/
  cancellation/replenishment) inform adverse-selection risk, continuation quality, snapback
  hazard, and entry/exit/scale timing -- even if they do not predict trade direction outright.

method: >
  Read-only data-gate check per sec E1: only genuine Market Replay/MBO/MBP evidence qualifies.
  Reuses DATA02_MICROSTRUCTURE_INVENTORY's independent, twice-confirmed finding that db/replay/
  and db/snapshot/ are both empty and no vendor route exists locally.

falsification_criterion: n/a -- data-gate check, not a statistical test.
promotion_rule: n/a -- infrastructure/feasibility only.
disposition: DATA_LIMITED (not CLOSED_INFORMATION_CLASS -- the mechanism is untested, not falsified).
