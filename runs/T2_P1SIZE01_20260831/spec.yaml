# 0. THE OBJECT AND THE MECHANICAL FACT THAT MAKES THIS EXACTLY COMPUTABLE
# ----------------------------------------------------------------------------------------------
object_under_test: >
  The EXECUTABLE object `WeeklyEdgeP1PCT_v1` - the P1 leg of M_11 - as certified:
  NQ 09-26, 1-min, 2022-01-03 -> 2026-08-30, CME US Index Futures ETH, Standard fill, 0 slippage,
  NinjaTrader Brokerage Lifetime ($4.36/ctrRT). 2,439 closed trades, sum(ProfitCurrency) =
  $354,575.96. Trade list: runs/G2_AUG_INCUMBENT_READ_20260830/out/p1_trades_full.csv (2,439 rows).

the_size_invariance_theorem: >
  READ FROM THE CERTIFIED SOURCE, NOT ASSUMED. In WeeklyEdgeP1PCT_v1.cs the session box
  accumulates PER CONTRACT at both accumulation sites:
      sessPnl += (Open[0] - myEntryPx) * PointValue - CommissionRT      (line ~262)
      sessPnl += (Close[0] - myEntryPx) * PointValue - CommissionRT     (line ~486)
  Neither term involves myQty. The vote (nMemLong * nThr * (1+dL) >= 16), the range throttle, the
  delta gate and the re-entry lockout (sessStopped) are all size-free. The quality-score history
  (qDistOpen ... qDeltaMag) is appended once per genuine ENTRY EVALUATION, also size-free.
  THEREFORE: the entry/exit schedule, the per-contract P&L of every trade, and the causal score
  series are ALL INVARIANT to the size map. Any sizing counterfactual is exactly
      pnl_arm(i) = s_i * pnl_per_contract(i),   pnl_per_contract(i) = pnl_nt8(i) / qty_nt8(i)
  with commission already per contract. No engine re-run is needed and none is performed.
  THIS IDENTITY IS ITSELF A PREREGISTERED GATE (G0c below): if it does not hold, the arms are void.

# ----------------------------------------------------------------------------------------------
# 1. MECHANISM, SIGN, HORIZON - stated before results
# ----------------------------------------------------------------------------------------------
mechanism_being_challenged: >
  W42/W83 established that P1's five-feature causal quality score does NOT predict win
  probability (flat 35-40% at every score level); it predicts EXCURSION MAGNITUDE (median MFE
  1.3 -> 5.5 ATR across score buckets). The adopted layer therefore is NOT a filter - it is
  "size bigger opportunities". This run does not question the mechanism. It questions the MAP.
  The incumbent map has two specific fragilities, both admitted in the repo's own record:
    (a) the five features, their signs and runlen's 0.9 quantile were selected by a FULL-SAMPLE
        scan in W33 (stated as a trap in WE_W83_SKEWLEVER/spec.yaml), and
    (b) the map is a 5-bit quantisation followed by a single CLIFF at score >= 3, so the entire
        layer's value rests on one threshold applied to one lossy statistic.
  Neither fragility is about which trades are taken. Both are about how contracts are distributed
  across a FIXED, UNCHANGED trade schedule.

what_is_explicitly_NOT_attempted: >
  - No filtering. No arm removes, halts, or skips a single entry. Trade count is identical in
    every arm by construction. P1 is right-tail carried; exposure-reducing rules in this repo are
    nine for nine in the wrong direction; this lane does not touch that lever.
  - No arm is motivated by the Jun-Jul 2026 drawdown (W77 lesson). No recent-conditions filter.
  - No parameter grid. Three arms total, including the control, frozen here.
  - The session box is NOT modified (W98/RR_W005 already priced it; it is not a free lever).

arms_frozen_exactly_three:
  A0_INCUMBENT:
    rule: "s = 1 + 1{score >= 3}"
    role: CONTROL. Must reproduce the certified object to the cent (G0).
  A1_SMOOTH:
    name: P1SZ_SMOOTH
    rule: >
      Replace the 5-bit sum by a CONTINUOUS causal composite of the SAME five features:
      z_i = mean over the five features of the empirical percentile rank of that feature's
      (directionally signed, exactly as in we_quality.quality_score) value among the PREVIOUS
      250 entry evaluations. Size 2 when z_i >= tau_i, else 1, where tau_i is the causal
      (1 - r_i) quantile of z over those same previous 250 entries and r_i is the incumbent's
      OWN realised size-2 rate over those same previous 250 entries.
    free_parameters: NONE beyond the incumbent's own (window 250, min-history 100, five features,
      five signs). The size-2 RATE is inherited causally from A0, so the contract budget is
      matched by construction rather than by fitting.
    mechanism_claim: >
      Same information, same budget, same trade schedule, no cliff and no per-feature threshold.
      If the layer's value is the ORDERING (excursion magnitude) rather than the specific
      quantisation, a rank composite must be at least as good and materially more robust.
    predicted_sign: A1 >= A0 on money-at-common-risk; strictly lower sensitivity to any single
      feature threshold.
  A2_VOLN:
    name: P1SZ_VOLN
    rule: >
      Rank key k_i = score_i / relvol_i, where relvol_i = ATR14_lagged_at_the_decision_bar (in
      dollars, PointValue 20) divided by the MEDIAN of that same quantity over the PREVIOUS 250
      entry evaluations. Size 2 when k_i >= kappa_i, else 1, where kappa_i is the causal
      (1 - r_i) quantile of k over the previous 250 entries and r_i is the incumbent's own
      trailing size-2 rate (identical calibrator to A1).
    free_parameters: NONE beyond the incumbent's own.
    mechanism_claim: >
      The score forecasts excursion in ATR UNITS. The incumbent converts that to CONTRACTS with
      no reference to what an ATR is worth in dollars, so an identical score buys an identical
      contract count whether a $1,300 box is 43.4 bp of index (2022) or 24.6 bp (2026). A2
      allocates the SAME number of second contracts to the occasions with the largest forecast
      excursion PER UNIT OF DOLLAR RISK. Normalising by a trailing 250-entry median makes the
      rule era-neutral by construction, so it is a WITHIN-era risk-adjustment, not an era bet.
    predicted_sign: A2 >= A0 on money-at-common-risk AND strictly lower weekly dispersion
      (standard deviation) at equal contract-round-turns.
    named_diagnostic_not_an_arm: >
      A2raw = the same rule with raw ATR$ instead of relvol. Reported ONLY to quantify how much
      of any A2 result is an era tilt toward 2022's lower index level. It is a CONTROL, it is
      never promoted, and it does not count as a fourth arm.

