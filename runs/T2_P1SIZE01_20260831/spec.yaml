G0_verification:
  G0a: "Recomputed causal score agrees with runs/RR_W001.../ledger_p1pct.csv
        causal_quality_score on >= 99% of joined entries."
  G0b: "Recomputed size vector agrees with NT8 qty on >= 99% of joined entries; A0 net on the
        NT8 window equals 354575.96 to the cent."
  G0c: "SIZE-INVARIANCE identity: for every NT8 trade, pnl == qty * (pnl/qty) to 1e-9, and the
        commission column equals 4.36*qty exactly. (Necessary condition; the sufficient argument
        is the source read quoted above.)"
  if_G0_fails: "The arms are VOID and the run reports the verification failure only."

G1_budget_matched: "|mean(size_arm)/mean(size_A0) - 1| <= 0.02 AND
                    |sum(size_arm)/sum(size_A0) - 1| <= 0.02.  Both must hold."
G2_money_at_common_risk: "weekly $ at a COMMON fixed max drawdown (each arm's weekly series
                    linearly rescaled so its own maxDD = $20,245; this is scale-invariant algebra
                    and cannot be inflated by leverage) must be >= 1.05 x A0's. A gain smaller
                    than 5% does not justify a new object."
G3_tail_preserved: "arm's top-decile share of its own net >= 0.80 x A0's top-decile share, AND
                    trade count identical to A0. An arm that wins by flattening the right tail or
                    by cutting exposure FAILS even if it makes more money."
G4_size_label_null: "arm's fixed-DD weekly $ must exceed the 95th percentile of 1,000 random
                    permutations of ITS OWN size vector across the same entries (preserving the
                    exact size multiset). This is the W98 null and it is the correct control here:
                    W83 measured that size DISPERSION alone adds skew irrespective of direction,
                    so an arm must beat its own shuffled self, not just flat sizing."
G5_stability: "arm beats A0 on fixed-DD weekly $ in >= 60% of 25 rolling 24-month windows AND in
                    >= 4 of 5 leave-one-calendar-year-out recomputations."
G6_block_bootstrap: "stationary bootstrap (mean block 4 weeks, 10,000 draws) of the weekly
                    DIFFERENCE series (arm minus A0, both at their own fixed-DD scale): the 90%
                    CI must exclude 0. A plain t-stat is printed as ONE DIAGNOSTIC, never the test."
decision_rule: "ALL of G1..G6 -> CANDIDATE (queued for champion-vs-challenger; NOT promoted, NOT
                    deployed). ANY fail -> recorded FAIL, population never redefined."
cost_lines_all_printed: "$4.36/ctrRT (NT8 basis, the incumbent's quoted basis) - primary;
                    plus $14.44 and $20.65 per ctrRT modelled spread on top, because the arms
                    could differ in contract count and friction is not neutral between them
                    (W83's own trap). G1 forces the budgets equal, so the three lines must agree."

