D1_concentration_reproduction: >
  Independently reproduce, on the EXECUTABLE object (2,439 NT8 trades, not the Python stream):
  top-1% / top-5% / top-10% share of net, the sum of the complement, the median trade,
  ex-top-1 and ex-top-5 nets, and leave-one-year-out. Compare to the orchestrator's figures
  (top 10% = 244 trades = 255.8% of net; other 2,195 lose $552,310; median -$99.36) and to
  G2_F9_P1_SYMCERT's 236.8% (measured on the 2,131-trade Python population - a DIFFERENT
  population, so the two are expected to differ and both are printed).
D2_tail_decay_stress_surface: >
  TAIL := the top decile of trades by realised trade P&L on the executable object (244 trades).
  FREQUENCY decay f in {25,50,75}%: each tail trade independently fails to be a tail event with
  probability f; on failure its P&L is replaced by a draw without replacement from the
  non-tail P&L distribution. 2,000 Monte Carlo paths; report mean and [p5,p95] of weekly EV and
  of maxDD. SIZE decay f in {25,50,75}%: every tail trade's P&L multiplied by (1-f);
  deterministic. Report weekly EV, total net, maxDD, and the breakeven f at which weekly EV = 0
  for both axes. Weeks are ISO weeks on the session date (the repo's stated convention).

