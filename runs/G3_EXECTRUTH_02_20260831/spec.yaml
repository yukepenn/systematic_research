  from it. The research chain's double-lagged ATR is then a CONFIRMED DEFECT and every P1 figure
  produced by that chain carries the correction as a known offset.
  NOT ESTABLISHED: that the executable is good, that the research object is worse, or that either
  should change. Agreement is not correctness. A defect in the research chain is not evidence that
  the deployed strategy should be modified - the deployed strategy was never using the defect.
