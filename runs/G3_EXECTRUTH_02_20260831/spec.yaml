why_a_second_run_is_legitimate_and_not_a_parameter_rescue: >
  Section 37 rejects a candidate that differs from a failed one "only by threshold/window/lookback
  numbers". This is not that, and the distinction is the whole justification for this run:

  G3_EXECTRUTH_01 tested a ONE-DIMENSIONAL family - which single index shift does the executable
  apply to its quality features? All three arms (H_FRESH / H_STALE / H_STALE2) were the same
  hypothesis at three values. The correct answer was NOT IN THAT FAMILY, which is exactly why the
  best arm plateaued below the bar.

  The mechanism was then read OUT OF THE SOURCE ON BOTH SIDES, not fitted to the data:

    we_fastctx.py:46    atr = concatenate([[atr[0]], atr[:-1]])
                        - the first lag, applied inside the feature builder whose own docstring
                          (run_we_w09.py:26) already states "ATR14 at i-1"
    we_fastctx.py:81    atr_l = concatenate([[atr14[0]], atr14[:-1]])
                        - lags the ALREADY-LAGGED array a second time
    we_quality.py:44    the identical double lag

    => X['atr_l'][j] is ATR through bar j-2, while c_l[j] and vwap_l[j] are bar j-1. The Python
       research object divides a bar-(j-1) numerator by a bar-(j-2) ATR denominator.

    WeeklyEdgeP1PCT_v3.cs CacheLagged():
      :1213-1216  enqueues THIS bar's true range, then
      :1218       lagAtr = trSum / trQ.Count
      :1237       lagClose = c
      => lagAtr and lagClose are both frozen at bar b. SYMMETRIC. No such asymmetry exists.

  So the executable is a MIXTURE of the arms tested, and no single index shift can express it.
  This is a DIFFERENT HYPOTHESIS about the object's structure, derived from source, not a
  different number in the same family.

the_honesty_requirement_that_travels_with_it: >
  The corrected arm was nonetheless FIRST OBSERVED on the same data, as a post-hoc arm reported at
  100.000% score and 100.000% size (0 of 397) in the predecessor. It is therefore NOT confirmed by
  that observation and this spec does not treat it as confirmed. What makes it testable rather than
  fitted is that it has ZERO FREE PARAMETERS and is fully determined by two source files that can
  be read without any data at all. This run states the prediction in advance and lets it fail.

# ==================================================================================================
# 1. THE HYPOTHESIS, STATED SO IT CAN LOSE
# ==================================================================================================
H_CORRECTED: >
  The executable's quality features at decision bar b are computed from a SINGLE consistent lag:
  close, vwap, ATR, runlen, cumDelta and volnorm are ALL taken through bar b-1. In the research
  chain's indexing, that is X[k][i-1] for every feature EXCEPT atr, which must be un-double-lagged
  so that its effective bar matches the numerators it divides.

  Concretely: build the context exactly as we_fastctx.fast_build_context does, then REMOVE the
  second ATR lag at we_fastctx.py:81 only. Change nothing else. No threshold, no window, no
  feature, no sign moves.

named_controls_that_must_lose: >
  C1  the predecessor's best arm, H_STALE with the double-lagged ATR   (predecessor: 96.977%)
  C2  H_CORRECTED but with the FRESH index shift instead of stale
  C3  H_CORRECTED but with BOTH ATR lags removed (i.e. ATR through bar b, not b-1)
  If any control matches or beats H_CORRECTED, the source read is wrong and this spec says so.

