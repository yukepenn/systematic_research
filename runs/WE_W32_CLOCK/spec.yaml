run_id: WE_W32_CLOCK
date: 2026-08-25
campaign: WEEKLY_EDGE (#7)
directive: owner — maximise profit; the two mined candidates that survive W31's finding.

why these two survive W31: >
  W31 established that the Solar edge is carried by the FLIP EVENT, not the trend state, so
  nothing that merely holds state longer can work. Both candidates below change WHERE AND HOW
  OFTEN FLIPS OCCUR, which is the only remaining production lever inside this model.

axis C MULTI-CLOCK MEMBERS:
  the ratchet currently advances on every 1-min close. Campaign #1 measured the same
  configuration on coarser clocks: 3-min $27.18/trade and daily Sharpe 1.08 versus 1-min
  $15.76 and 0.63 (research/02_solar_refinements/WAVE1_report.md D4), and a mixed 1m+3m
  ensemble at Sharpe 0.786 versus 1m-only 0.717. Mechanism measured in DC01: the crossing tax
  is ~23.5 ticks per segment and roughly CONSTANT in threshold, i.e. a per-EVENT tax, so a
  coarser clock pays it less often. Our stress line is $14.36/RT, about 3x the basis those
  numbers used, which should favour the coarser clock further.
  arms: members advancing on 1-min (baseline), 3-min, 5-min aggregates, and the union vote
  across {1,3,5}-min members. Decisions and fills remain on the 1-min clock (owner's cadence
  requirement); only the ratchet's update clock changes. Aggregates built in-session, causal.
axis T TOD-NORMALISED THRESHOLD:
  sigma is a 460-bar trailing mean of |dclose|, which lags the intraday volatility cycle.
  Measured on our own substrate: the per-minute-slot factor f = mean(|dclose|/sigma460) ranges
  0.294 (16:49) to 5.865 (08:31) - a 19.95x spread; 09:31 = 5.261, 14:00 = 0.761, 19:00 = 0.382.
  So the threshold is 4-6x too tight at the RTH open and 2-3x too wide overnight, and W06
  measured chop-loss (24-35% of sessions) as a dominant leakage class.
  arms: run the ratchet on a TOD-devolatilised price path p~[i] = p~[i-1] + dclose[i]/f_slot,
  with f estimated ONLY from prior sessions' same-slot values (leakage-audited construction,
  asserted in code), thresholds applied in normalised units, fills converted back to real
  prices. Report E[f|flip] and mean S first - those are the two numbers whose distortion made
  campaign #3's M1 arm fail - then production.
adoption (either axis): pts/session up AND pts-per-bar-in-position not down more than 15 %
  AND weekly Sharpe not down AND stress positive; then a binding circular-shift null.
falsifier: if neither axis raises production, the model's production is capped at ~10.6
  pts/session per contract and the only remaining levers are exposure (contracts, concurrent
  sleeves) and a genuinely different model.
forbidden: [data >= 2026-08-01, fill-bar information, adopting without the null, mixing the
  two axes before each is judged alone]
outputs: [out/clock.txt, out/summary.csv, REPORT.md]
