run_id: WE_W120_MOMMARGINAL
campaign: "#7 WEEKLY_EDGE"
date: 2026-08-27
status: PREREGISTERED
authority: "POST-W118 owner directive, sections 23, 24, 26, 28, 36 LANE C."

title: >
  IS W118's MIRROR CONTINUATION A NEW ENGINE, OR JUST MORE OF WHAT P1 ALREADY OWNS?
  W118's momentum mirror earned +$374/trade at endogenous triggers while the reversal it mirrors
  lost $405. Section 23 says do NOT immediately build ten continuation strategies. Section 24 says
  run ONE portfolio-oriented diagnostic first and decide redundancy before engineering.

the_question: >
  P1/PCT is already a trend engine on the same NQ price path. If W118's mirror earns only when P1
  is already earning, it is a re-expression of information the book owns and belongs in the research
  CONTROL column, not the book. If it earns materially when the book LOSES, it is mechanism/policy
  alpha and deserves engineering.

# ---------------------------------------------------------------- what is measured
object_under_test:
  name: MIRROR_CONT
  definition: >
    W118's construction with the direction FLIPPED and NOTHING ELSE CHANGED. The running excursion
    from the true RTH open must clear a trailing causal threshold built from the prior 250 sessions;
    a retracement of R then triggers an entry WITH the extreme; exit at the 15:44 close; size 1; no
    stop. Retracement levels 0.25 / 0.50 / 0.75 and gate rates 0.25 / 0.50 / 0.75, exactly as W118.
  frozen: "no threshold, level, gate, exit or window may be re-chosen in this wave. Section 24 is explicit."

measurements:
  standalone: "the section 29 dashboard - t3m / t6m / t12m / YTD / prior year / t24m / 2022-current, plus 2006-2021 as diagnostic only. Dollars AND accuracy points above each window's own p-star, because W116 showed those can diverge."
  redundancy:
    - "weekly and per-session correlation with P1/PCT, with XM, and with the research book"
    - "MIRROR_CONT session P&L conditional on P1's SAME-SESSION contribution being negative"
    - "conditional on XM's same-session contribution being negative"
    - "conditional on the research book's same-session total being negative"
    - "and the unconditional means beside each, because a conditional mean without its unconditional reference is uninterpretable"
  conditioning_warning: >
    Those three conditions are EX-POST OUTCOMES used as DIAGNOSTIC SLICES. They are not production
    inputs and no rule in this wave may condition on them. Section 24 states this explicitly.
  portfolio:
    - "section 28's full loss-diversification set against the book: ordinary weekly rho, rho when the book loses, P(cand<0 | book<0), worst-decile overlap, joint drawdown, tail beta, and candidate P&L on book-losing weeks - each against a 1,000-shift circular null, the instrument W110 established"
    - "incremental fixed-DD weekly dollars, CVaR5, maxDD and positive-week effect at BOTH inverse-vol and income-matched weights, quoted as a RANGE"

stage_A_information_question:
  what: >
    IF MIRROR_CONT earns materially on book-losing sessions, then ask the section 24 follow-up:
    is there a CAUSAL PRE-TRIGGER state that identifies those profitable continuation
    opportunities? Measured as information only - AUC of a small pre-trigger feature set for
    discriminating profitable from unprofitable MIRROR_CONT trades, against a permutation null that
    RE-RUNS the whole cross-validated fit, per the W110b correction.
  not_run_if: "MIRROR_CONT does not earn materially on book-losing sessions. Then the redundancy answer is already the result and section 19's Stage A is not reached."
  no_optimisation: "section 24 - do NOT optimise thresholds during this diagnostic. Stage A is an information measurement and buys a preregistration at most."

controls:
  mandatory: [always_long, always_short, "P1/PCT itself over the same sessions", "the reversal original (W118) as the sign reference"]
  rule: "W108/W111b binding rule - any class-conditional or state-conditional table carries its matched unconditional control in the same analysis."

primary: >
  A CLASSIFICATION, not a P&L number: is MIRROR_CONT (a) REDUNDANT with the book, (b) a
  DIVERSIFYING candidate, or (c) neither? Decided on its conditional performance during book losses
  and its loss-diversification statistics, NOT on standalone dollars.

falsifier_for_the_diversifying_claim: >
  MIRROR_CONT is NOT a diversifying candidate if its mean on book-losing sessions is <= 0, OR <= the
  95th percentile of the circular-shift null, OR its incremental fixed-DD contribution is <= 0 at
  BOTH weighting conventions, OR its worst-decile overlap with the book is worse than the 95th
  percentile of that null. These are the same four gates W116 applied to FOLLOW_MORNING, and they
  are applied identically here so the two candidates are directly comparable.

decision_rule:
  - "NOTHING PROMOTED. Section 23 - determine redundancy BEFORE engineering."
  - "If REDUNDANT: MIRROR_CONT becomes a permanent research CONTROL (the MIRROR_CONTINUATION_CONTROL section 7 now mandates for every fade/reversal idea) and is NOT built as an engine. That is a useful outcome and must not be reported as a failure."
  - "If DIVERSIFYING: it earns a preregistration for the Stage-B policy wave and a live-engineering slot - and it would be the first object to pass the gates FOLLOW_MORNING failed."
  - "One wave. Section 39's stop rule applies: no second retracement grid, no third exit time."
