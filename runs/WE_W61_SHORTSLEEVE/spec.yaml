run_id: WE_W61_SHORTSLEEVE
date: 2026-08-26
campaign: WEEKLY_EDGE (#7)
directive: reopen a decision that was made under the objective Charter Amendment 2 has now
  corrected, and which the record shows was made KNOWING it traded away the thing the owner
  actually wants.

the row in W39's own table, quoted from research/weekly_edge/STATE_OF_THE_SYSTEM.md:
    | P1 + short sleeve (CONSISTENCY OBJECT) | ~2.2 | 25.87 | $2,557 | 64.4 % | -$14,606 |
      -$10,097 | 0.337 | 0.175 |
  It is literally labelled "the consistency object" in the campaign's own state file. It has
  **64.4 % positive weeks against P1's 58.6 %** - the best weekly-consistency number this
  campaign has ever measured - and the highest Sharpe (0.337 vs 0.311). It was dropped because
  its eff (weekly / |worst week|) is 0.175 against 0.198 and its worst week is -$14,606.
  Under the corrected objective that is a trade of eff and one worst week for +5.8 pp of
  positive weeks, and eff has since been demoted twice: Charter Amendment 2 demotes it with
  Sharpe, and W52 measured that eff is a SINGLE-OBSERVATION statistic that one week can move by
  an order of magnitude more than it moves any distributional metric.

why this is the right thing to reopen now and not another breadth candidate:
  W58 measured that P1 is FLAT on 40 % of sessions by design, so no entry-side change can lift
  its all-session positive rate above 60 %, and that raising it REQUIRES a sleeve that trades
  the sessions P1 sits out. W59 and W60 then measured, four independent ways, that on a SINGLE
  engine consistency and production are conjugate - every route buys green days with money at a
  stable rate, and the cheap ones run out after one step.
  The short sleeve is the only candidate in the repo that (a) trades on the same substrate with
  the same fills and the same friction, (b) is already fully built and audited, (c) needs no new
  data, no purchase and no vendor, and (d) is DIRECTIONALLY OPPOSITE, so it trades on precisely
  the sessions a long-only object sits out or loses on.
  It does NOT solve model concentration - it is the same Solar ratchet mirrored, and law 9 still
  applies. It is not offered as a second model. It is offered as a CONSISTENCY sleeve, which is
  a different and smaller claim, and the wave will say which of the two it is.

the objection that has to be handled honestly, from the charter's own amendment table:
    "'long-only' (W16/W17/W19/W20) - replicated 4x, but EVERY SHORT TEST TO DATE USED THE LONG
     SIDE'S FEATURE SIGNS."
  So the plain mirrored short VOTE is well tested and the short side with its OWN causal
  features is not. This wave tests the PLAIN short vote only, because that is the arm W39
  actually measured and labelled, and adding a new feature construction would confound the
  reopening with a new hypothesis. A short-specific quality layer is a separate wave.

phase 1 - THE SHORT SLEEVE'S OWN CONSISTENCY LEDGER, never measured:
  Build the mirrored short vote on the same substrate, same 32-config construction, same range
  throttle, same delta gate mirrored, same session box, flat at session close, 1 contract.
  Report: positive-day %, positive-TRADED-day %, flat %, positive-week %, longest losing streaks,
  median day and week, weekly dollars at a fixed $20,245 drawdown, drawdown distribution.
  And the number that matters most for this hypothesis: ON THE SESSIONS P1 IS FLAT, how often
  does the short sleeve trade, and how often does it win? W58 measured that for three other
  sleeves (49.4 %, 56.9 %, 52.3 %); the short sleeve has never been measured this way.

phase 2 - THE COMBINATION at constant total risk and a FIXED drawdown:
  Weight scan over the short sleeve's risk share, everything rescaled to the incumbent's
  $20,245 max drawdown, reported consistency-first. Also the three-way with W59's h2000_t750
  direction, since W60 established that direction is stable in 100 % of sub-periods - but
  reported separately so the two claims never contaminate each other.

phase 3 - SUB-PERIOD STABILITY, the test that killed every W60 arm:
  Per year and over all rolling 24-month windows, the fraction in which the combination beats
  P1 alone on the traded-day rate, on weekly dollars at fixed drawdown, and on the drawdown
  distribution. W60's arms scored 0 % on "all three" and that is the bar to beat.
  Plus the short sleeve's OWN rolling record, and where its latest 24-month window sits in its
  own history - the test that caught axis B at the 97th percentile and B-MOM at the 98th.

phase 4 - NULLS:
  N1 circular shift of the short sleeve's daily series (same mean, same vol, alignment with P1
     destroyed) - separates "the short sleeve makes money" from "it makes money when P1 does
     not", which are different claims and this campaign has conflated them before.
  N2 SCAN-MATCHED over the weight grid, per W53.
  300 draws each.

adoption bar: positive-week rate AND traded-day rate rise, weekly dollars at fixed drawdown fall
  by no more than 5 %, the drawdown DISTRIBUTION (mean top-5, Ulcer) does not worsen, the
  combination beats P1 alone on all three in a MAJORITY of rolling 24-month windows (the bar
  every W60 arm failed at 0 %), both nulls clear at >= 95th percentile, and the trailing-24-month
  chronology gate passes per Amendment 2.
falsifier: if the combination fails the majority-of-sub-periods bar like every W60 arm did, the
  recorded conclusion is that consistency cannot be bought inside the Solar family at all, that
  the conjugacy result of W59/W60 extends to the mirrored engine, and that the owner's objective
  genuinely requires information this repo does not have.
forbidden: [data >= 2026-08-01, adding a short-specific quality layer (that is a different
  hypothesis and needs its own wave), judging on eff or Sharpe, presenting a full-sample result
  without the sub-period table, comparing a scanned weight to an unscanned null, mixing the
  h2000_t750 direction into the short-sleeve claim]
outputs: [out/short.txt, out/ledger.csv, out/wscan.csv, out/subperiod.csv, out/nulls.csv,
  REPORT.md]
