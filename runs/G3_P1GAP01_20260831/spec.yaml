# ==================================================================================================
# 5. GATES - every clause coded, table printed BY THE PROGRAM
# ==================================================================================================
G0_verification:
  G0a: "A0 reproduces the executable object: 2,439 trades, and net to the cent on the NT8 window."
  G0b: "SIZE-INVARIANCE identity holds: max|pnl - qty*(pnl/qty)| < 1e-9 and commission == 4.36*qty."
  G0c: "Join rate to the session table >= 95%, and the unmatched trades are listed by reason."
  if_G0_fails: "The arms are VOID and the run reports the verification failure only."

G1_budget_matched: "|mean(size_A1)/mean(size_A0) - 1| <= 0.02 AND
                    |sum(size_A1)/sum(size_A0) - 1| <= 0.02.  Both must hold."
G2_risk_vector_not_one_number: >
  A1 must beat A0 on the FULL risk vector via research_sdk/champion_eval.risk_vector, not on
  fixed-DD alone (directive section 25 - random thinning alone moves fixed-DD by +$129-139/wk).
  BINDING: A1's net/week must be >= A0's AND A1 must not worsen ES95 or maxDD by more than 5%.
  A gain in fixed-DD income accompanied by a worse ES95 is recorded as a FAIL, not a trade-off.
G3_tail_preserved: "A1's top-decile share of its own net >= 0.80 x A0's, AND trade count identical.
                    An arm that wins by flattening the right tail FAILS even if it makes more money."
G4_size_label_null: >
  A1's fixed-DD weekly $ must exceed the 95th percentile of 1,000 random permutations of ITS OWN
  size vector across the same entries, preserving the exact size multiset. W83 measured that size
  DISPERSION alone adds skew irrespective of direction, so the arm must beat its own shuffled self.
G4b_feature_null_that_prices_the_discovery: >
  ADDITIONAL and specific to this run's provenance. The feature was found by a scan, so a
  size-label shuffle is not enough. A1 must ALSO exceed the 95th percentile of 1,000 CIRCULAR
  SHIFTS of the open_loc series across SESSIONS (preserving serial dependence and the exact feature
  distribution). This asks the only question that matters: is it THIS feature on THESE sessions, or
  would any similarly-distributed session-level series have done as well?
G5_stability: "A1 beats A0 on the risk vector in >= 60% of 25 rolling 24-month windows AND in
                    >= 4 of 5 leave-one-calendar-year-out recomputations."
G6_block_bootstrap: "stationary bootstrap (mean block 4 weeks, 10,000 draws) of the weekly
                    DIFFERENCE series (A1 minus A0): the 90% CI must exclude 0. A t-statistic is
                    printed beside it as a DIAGNOSTIC and is never the test."
decision_rule: "ALL of G1..G6 -> CANDIDATE, queued for the champion board. NOT promoted, NOT
                    deployed, NOT built. ANY fail -> recorded FAIL, population never redefined."
cost_lines_all_printed: "$4.36/ctrRT (NT8 basis) primary; plus $14.44 and $20.65 modelled spread.
                    G1 forces the contract budgets equal, so all three lines must agree in sign."

