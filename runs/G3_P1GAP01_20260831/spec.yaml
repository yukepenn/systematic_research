# ==================================================================================================
# 0. PROVENANCE - stated so the selection debt is visible, not hidden
# ==================================================================================================
origin: runs/G3_TAILPROBE_00_20260831 (DISCOVERY MODE A, DISCOVERY_CONTAMINATED)
what_the_discovery_run_established: >
  On P1 trades entered at/after 09:30, a scale-free "opening strength" factor marks the right tail
  of per-contract P&L. It survived a max-statistic circular-shift null that PRICES THE SEARCH over
  11 features (p = 0.0000 raw) and then survived volatility normalisation with its own separate
  null (p = 0.0020, best statistic 0.0954 against a null p95 of 0.0701).
what_the_discovery_run_KILLED, and it matters: >
  The raw Stage-1 winner `open_vs_on_low` (0.1170) COLLAPSED to 0.0368 under volatility
  normalisation - it was scaling, not information. So did `on_range`, `on_vol` and
  `prior_rth_range`. Any version of this challenge built on those is dead before it starts.
selection_debt_admitted: >
  11 features were examined. Four survived and they are FOUR MEASUREMENTS OF ONE FACTOR. Testing
  all four here would be a hidden scan, so ONE is frozen below and the other three are never run.
  The discovery statistic is a TAIL-RATE GAP, not money. Nothing about it implies dollars.

# ==================================================================================================
# 1. THE FROZEN OBJECT - one measurement, chosen for reasons stated BEFORE any economics
# ==================================================================================================
frozen_feature: open_loc_in_on_range
definition: >
  (rth_open - on_low) / (on_high - on_low), computed from
  runs/G3_SESSTRUCT_00_20260831/out/session_structure.parquet, where on_high/on_low are the Globex
  overnight extremes through the bar stamped 09:30 and rth_open is the OPEN of the bar stamped
  09:31 (the 09:30:00 print). Known in full at 09:30:00.
why_this_one_and_not_the_other_three: >
  Chosen on THREE STATED PROPERTIES, none of which is its discovery statistic:
   (a) BOUNDED to [0,1] by construction, so it cannot drift with index level or volatility regime
       across 2022-2026. `gap` is in raw points and is era-dependent; that is a real defect for a
       rule meant to survive a regime change, and ERABREAK01 (p=0.0011) says one occurred in
       2022-05 inside the test window.
   (b) It was the ONLY survivor whose statistic was UNCHANGED by volatility normalisation
       (0.0912 -> 0.0912). gap moved 0.1102 -> 0.0954 and open_vs_on_high moved 0.0123 -> 0.0742.
       An unchanged statistic is the strongest available evidence that it was never a scale artifact.
   (c) It requires no reference to the prior session, so it has one fewer failure mode
       (`gap_frac_of_prior_range` inherits any defect in prior_rth_range).
  `gap` had the LARGER discovery statistic and is deliberately NOT chosen. Choosing the larger
  statistic would be selecting on the outcome.

# ==================================================================================================
# 2. MECHANISM, SIGN AND SCOPE - all frozen before results
# ==================================================================================================
mechanism: >
  P1 is LONG-ONLY. A session whose RTH open sits high in the overnight range has already resolved
  its overnight auction upward before P1 takes its first RTH-hours position. The claim is that such
  sessions carry a larger probability of a LARGE FAVOURABLE EXCURSION for a long, not a higher win
  rate - which is the same mechanism class W42/W83 established for the incumbent quality score
  (score predicts EXCURSION MAGNITUDE, median MFE 1.3 -> 5.5 ATR, and does NOT predict win
  probability, which is flat at 35-40% across score levels).
predicted_sign: POSITIVE. Higher open_loc -> larger right tail -> larger size. Stated in advance.
scope_restriction_and_why_it_is_not_a_free_parameter: >
  The rule applies ONLY to entries at/after 09:30. This is NOT tuning: the overnight range does not
  EXIST before 09:30, so applying it earlier would be a look-ahead of hours. P1 takes ~59% of its
  net overnight (W79), so this layer can touch at most the other ~43% of trades by construction,
  and that ceiling is a property of the mechanism rather than a choice. Pre-09:30 trades keep the
  incumbent size EXACTLY.
type_classification: >
  MECHANISM-POLICY / RISK SPECIFICATION, Type B: it redistributes a FIXED contract budget across an
  UNCHANGED trade schedule. It is NOT new alpha and will not be described as such under any result.

# ==================================================================================================
# 3. ARMS - exactly two, frozen. No grid, no variants.
# ==================================================================================================
A0_INCUMBENT:
  rule: "s = 1 + 1{causal quality score >= 3}, exactly as certified"
  role: CONTROL. Must reproduce the executable object to the cent (G0).
A1_OPENSTRENGTH:
  name: P1SZ_OPENLOC
  rule: >
    For entries at/after 09:30 ONLY: s = 2 when open_loc_in_on_range >= tau_i, else the incumbent
    size. tau_i is the CAUSAL (1 - r_i) quantile of open_loc over the PREVIOUS 250 post-09:30
    entries, where r_i is the incumbent's OWN realised size-2 rate over those same previous 250
    entries. Pre-09:30 entries take the incumbent size unchanged.
  free_parameters: >
    NONE beyond the incumbent's own (window 250, min-history 100). The size-2 RATE is inherited
    causally from A0, so the contract budget is matched BY CONSTRUCTION rather than by fitting.
    This is the same calibrator T2_P1SIZE01 used for A1/A2, deliberately, so the two runs are
    comparable and this one cannot be accused of a friendlier budget rule.
  what_it_does_NOT_do: >
    It never reduces a size below the incumbent's and it never removes a trade. Trade count is
    identical to A0 by construction. This is a SIZING layer, not a filter - section 40 is explicit,
    and exposure-reducing rules are 10 for 10 in the wrong direction in this repository.

# ==================================================================================================
# 4. WINDOWS AND SEALS
# ==================================================================================================
