      from bar-level cum-delta proxy (sign(close-open)*volume, session-cum);
      members {none, strong_only: enter only when CVD slope sign agrees with
      trend direction over the last TrendPeriod=20 bars}
  base_structures: top surviving pass-1 structures only
    (T_C|P_MED, T_C|P_Q75, T_A|P_IN, T_D|P_IN, T_B|P_IN, T_D|P_Q75) x {C_DIR,C_REC}
    x {X_OPP, X_FLIP}
  scoring: unchanged (§40 + failure-week DQ + LOWO rank stability)
