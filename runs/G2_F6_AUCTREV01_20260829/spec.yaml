      sensitivity first), real above p95
  E4: era consistency - net same sign in 2006-2015 and 2016-2026/05
  verdict: ALL -> SURVIVED-DISCOVERY (routes to robustness + independent implementation, NOT
      promotion); any fail -> NULL at formulation
