frozen_horizons (bars, 3-min; SMALL preregistered set, chosen from the above, not arbitrary):
  SHORT:   5 bars  (~15 min)  -- sub-fast-member scale, intra-leg noise floor
  FAST:   20 bars  (~60 min)  -- matches fast_member (VM6) empirical median hold (51 min)
  SLOW:  310 bars  (~930 min / 15.5h) -- matches slow_member (VM30) empirical MEAN hold
  SESSION: 460 bars (~23h)    -- matches sigma460's own VolPeriod exactly (round-number anchor
                                  explicitly licensed by the directive's own example list)

deseasonalization (disclosed approximation): per-bar log return r[t] = log(close[t]) -
  log(close[t-1]); first bar of each session (sess_date change) flagged and EXCLUDED (set NaN,
  overnight/roll gap, not an intraday move). r2[t] = r[t]^2 (for non-excluded bars).
  Causal seasonal profile: for each of the 7 session_phase buckets, a TRAILING (expanding,
  shift(1), same-phase-only, chronological) mean of r2 is computed -- strictly uses only
  earlier same-phase bars, never future data. seasonal_mult[t] = trailing_phase_mean[t] /
  trailing_grand_mean[t] (grand mean = trailing expanding mean of r2 across all bars, shift(1)).
  r2_adj[t] = r2[t] / seasonal_mult[t]. Approximation disclosed: this corrects the AVERAGE
  diurnal level per phase-bucket, not finer within-phase time-of-day structure; first ~90
  trading days produce noisy seasonal estimates (no explicit burn-in trim applied -- flagged as
  a limitation, not corrected, given time budget).

variance_construction: RV_H[t] = trailing mean of r2_adj over the last H valid (non-NaN,
  non-overnight) observations ending at bar t (require >= 0.8*H valid obs else NaN). Strictly
  causal (t and earlier only).

primary_spread (PREREGISTERED, the one explicitly tied to Solar13's fast/slow cohort structure):
  SPREAD_FAST_SLOW[t] = ln(RV_SLOW[t]) - ln(RV_FAST[t])
secondary_spread (robustness only, round-number anchor pair, NOT used for the primary verdict):
  SPREAD_SHORT_SESSION[t] = ln(RV_SESSION[t]) - ln(RV_SHORT[t])

step3_tests (frozen before computing):
  persistence:
    - daily: session-close snapshot of SPREAD_FAST_SLOW, lag-1 autocorrelation (dev window)
    - bar-level: ACF of SPREAD_FAST_SLOW at lag=FAST(20) and lag=SLOW(310) bars
  incremental_value (matching R4/R5/EXP01/ICT0102 methodology -- bucket-residualize + Delta-R^2,
    OLS with HAC/Newey-West-style robust SE given overlapping-window construction):
    target: forward-H-bar Product-B PnL, H in {FAST=20, SESSION=460}, sum(bar_pnl_B_nq_dollars)
      over (t, t+H], evaluated on a NON-OVERLAPPING subsample (every H-th bar) to avoid
      overlap-induced autocorrelation inflating apparent significance; unconditional on
      position_B (tests whether the ENVIRONMENT predicts near-future strategy P&L, not merely
      marginal value while already positioned -- matches the SMV2J framing directly, at bar
      instead of session granularity)
    baseline_model: fwdPnL_H ~ const + sigma460_tercile_dummies(2)
    extended_model: fwdPnL_H ~ const + sigma460_tercile_dummies(2) + SPREAD_FAST_SLOW_z
    report: R^2_base, R^2_ext, Delta-R^2, spread coefficient + HAC t-stat, bucket-residualized
      Spearman(SPREAD, resid_y | sigma460 tercile), year-by-year sign stability of the
      residualized Spearman correlation (same as R4/EXP01 precedent)
    sigma460_tercile: in-sample pd.qcut(3) on the regression subsample -- same convention as the
      R4/EXP01/ICT0102 precedent scripts (not a causal expanding percentile; disclosed, matches
      precedent exactly so results are comparable)

step4_conditional: fast-vs-slow Solar13 cohort differential value test (does SPREAD_FAST_SLOW
  predict which of the fast_member/slow_member column's own forward value is better) -- ONLY
  run if step3 shows real (economically + statistically + chronologically stable) residual
  value beyond sigma460. If step3 is a clean null, step4 is explicitly skipped per directive
  ("do not force Step 4") and the family closes as a complete, valid, honestly-reported result.

pass_bar (informal, consistent with the DSP JOB1 harness's own bar, scaled down for a
  diagnostic-only single-family test, not a policy promotion):
  - persistence: |lag-1 daily autocorrelation| worth discussing if > 0.15
  - incremental value: Delta-R^2 economically meaningful only if it approaches or exceeds prior
    passing states in this program's own history (SMV2Y's ER150/sigma460 next-week result was
    the first state to ever pass this program's bar; VAR01 is judged against that same
    concrete precedent, not an abstract threshold) AND HAC |t| > 2 AND same-sign year-by-year
    majority (>= 4/5 dev years, matching R4's stability convention)

