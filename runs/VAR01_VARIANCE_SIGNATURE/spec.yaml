purpose: >
  Structural-science test (not an indicator grid): build a MULTI-SCALE realized-variance
  signature from Solar13's own substrate, explicitly tied to Solar13's fast/mid/slow VolMult
  cohort structure, and test whether the variance-SPREAD (long-horizon RV minus short-horizon
  RV, per unit time) is (a) persistent/autocorrelated and (b) explains incumbent Product-B
  forward P&L better than sigma460 alone. Must NOT duplicate the already-killed single-horizon
  Lo-MacKinlay Variance Ratio (SMV2J: 0/12 cells vs next-session PnL; SMV2Y: same VR series
  0/12 cells vs next-week downside too) -- this construction differs by (i) using MULTIPLE
  simultaneous horizons rather than one q/N pair, (ii) measuring realized-variance LEVEL
  (regime/amplitude) rather than the serial-correlation-ratio VR statistic, (iii) horizons are
  derived from Solar13's own empirically-measured fast/slow member hold-time structure, not
  arbitrary round numbers chosen independently of the system under study.

