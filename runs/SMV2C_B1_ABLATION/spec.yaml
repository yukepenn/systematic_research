directive: OWNER_DIRECTIVE_V2_20260808 §7
question: does B1 earn its complexity in the full portfolio?
arms:  # all legs vol-matched to tilt-Solar on dev, weights renormalized, portfolio rescaled to common ann vol
  P0_seq324: tilt-Solar alone
  P1_seq325: 0.625 tilt-Solar + 0.375 BMOM (day-only)          # SM05 plateau center re-expressed
  P2_seq326: 0.8 tilt-Solar + 0.2 B1
  P3_seq327: 0.5 tilt-Solar + 0.3 BMOM + 0.2 B1                # = PORT_TILT_532
bmom_basis: E2 (next-bar-open) if SMV2B verdict adopts it; else E0 — decided by SMV2B BEFORE this read
