  B1 stays in CORE only if P3 beats P1 on >=3 of {Sharpe, Calmar, maxDD, worst month, TUW}
  by margins exceeding block-bootstrap noise (P>=0.9 one-sided on the composite).
  Otherwise B1 -> EXPERIMENTAL DIVERSIFIER, CORE full portfolio = P1.
