run_id: G3_SHORTROUTE01_20260831
title: "Is the mirrored short sleeve a REGIME-ROUTING object? Identify, in PRE 2006-2019 ONLY, an
        ex-ante state variable that separates its drift-neutral expectancy - then ONE look at
        MODERN. Either answer closes something."
date: 2026-08-31
campaign: GENESIS III - NQ CHAMPION CHALLENGE / WAVE C follow-on
