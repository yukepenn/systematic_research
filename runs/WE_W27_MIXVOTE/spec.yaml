run_id: WE_W27_MIXVOTE
date: 2026-08-25
campaign: WEEKLY_EDGE (#7)
directive: owner — "继续全面进步。甚至combine别的strategy去进步edge"

the missed combination (named): >
  W25 tested non-Solar engines as separate SLEEVES: each added a contract, so the tail grew
  35-67% for 2-3% production and they were rejected. But a sleeve is not the only way to
  combine. Adding them as VOTERS inside the existing vote changes the vote's COMPOSITION at
  the SAME one-contract exposure - zero tail cost by construction. That is the correct way to
  attack the W25 model-risk finding, and it was never tried.

axes:
  A MIXED-MODEL VOTE (primary):
    voters currently: 32 Solar-ratchet long-only configurations.
    candidate additions (long-only booleans, all lagged, already built in W25):
      EMA cross 20x100, EMA cross 60x480, momentum-of-momentum, range-position 240,
      Donchian 60, Donchian 240  (Donchian included DESPITE losing standalone - a voter that
      is wrong in a correlated way can still improve a majority; excluding it because it loses
      alone would be selecting on the outcome)
    variants: V_ALL (32 Solar + 6 non-Solar = 38), V_PROFITABLE (32 + the 4 non-losing),
      V_HALF (16 Solar, chosen as every other config in the fixed enumeration order, + 6
      non-Solar - a deliberately model-balanced vote), each at >= 50% and 1 contract with the
      session box.
    reported alongside: SOLAR SHARE of the winning votes, so the model-concentration change
      is explicit rather than assumed.
  B SESSION-TARGET NULL (owed from W26): 100 circular-shift nulls of the +$1,000 session
    target as a mechanism, same protocol as W13/W21. Binding: if it fails, the target is
    demoted to "not evidence" and reported as such everywhere it appears.
  C SESSION BOX ON S1: S1 carries its own D-gate but has never had the box. Test
    halt/target on S1 and on the pair.
  D BEST OBJECT: assemble whatever survives A-C and report it against the current best
    (E5box 1 contract 0.305 / three-sleeve $3,030 64.9% 0.285).
adoption: any mixed vote must beat the pure Solar vote on Sharpe AND not worsen the worst
  week, at the same exposure. Model-concentration reduction is a bonus, never a substitute.
falsifier: if no mixed vote beats the pure one, the model-risk finding is confirmed as
  irreducible with the signal library we have, and that becomes a permanent property of the
  system rather than an open problem.
forbidden: [data >= 2026-08-01, fill-bar information, weighting voters (that is selection),
  dropping a voter after seeing its effect, adopting on model-concentration alone]
outputs: [out/mix.txt, out/summary.csv, REPORT.md]
