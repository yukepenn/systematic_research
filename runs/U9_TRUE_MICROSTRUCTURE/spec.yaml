    L2_BBO_quotes: >
      PROVENANCE PASS, with caveats. Confirmed same depth as L1 (37/40 sessions), causally
      well-behaved via grid1s. Two inherited caveats from scalping_lab's own work (not
      re-derived here, cited): (a) same-millisecond cross-series ORDERING between Last/Bid/Ask
