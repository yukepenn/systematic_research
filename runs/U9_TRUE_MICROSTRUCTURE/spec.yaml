  timezone_and_resolution:
    finding: >
      VERIFIED ON DISK (not just per docs): all three layers use naive (no explicit tz)
      millisecond-quantized datetime64[ns] timestamps whose session boundaries fall exactly at
      18:00.000 / 16:59:59.xxx, matching this campaign's ET session convention (18:00->17:00 ET)
      — a UTC convention would show session opens at 22:00/23:00. Sub-second quantization
      confirmed at ~4ms granularity independently by DATAPROBE01 (250 distinct sub-ms values =
      1000/4). U0's own 3-minute bar table (runs/U0_UNIFIED_STATE/out/u0_state_table.parquet)
      was cross-checked in this family and is ALSO naive-ET, bars timestamped at their own close
      on exact minute%3==0 boundaries (verified: min(time.dt.minute % 3) == max == 0 across all
      540,232 rows) — the two data sources share one timestamp convention, materially
      simplifying alignment (see causal_alignment_feasibility below).

  field_semantics:
    bip_column: >
      VERIFIED ON DISK: bip in {0,1,2} = {Last,Bid,Ask} — confirmed by cross-tabulating raw
      parquet bip value_counts() against MANIFEST.csv's own trades/bid_ev/ask_ev columns for
      matching sessions (exact match, e.g. s20260123: bip=0 count 461,233 == MANIFEST
      "trades" 461233; bip=1 count 4,930,008 == "bid_ev"; bip=2 count 4,960,210 == "ask_ev").
    per_tick_volume: real, non-degenerate (DATAPROBE01: min 1, max 50, mean 1.10, 0% zero-vol).
    L3_size_field: >
      Volume field on Bid/Ask series (mean ~1.8-2, p99 6-7) is POPULATED but semantically
      AMBIGUOUS between (a) displayed best-level size, (b) size delta, (c) update-aggregation
      count. scalping_lab's own I-4 pilot (artifacts/instrumentation/pilot_report.md,
      2026-08-07) found 53-68% of consecutive same-side quote events carry an UNCHANGED price
