    L3_top_of_book_sizes: >
      PROVENANCE PARTIAL. Field exists, populated, non-degenerate, but semantics remain
      unresolved between size-level and size-delta/update-count (scalping_lab's own I-4 finding,
      inherited verbatim: "PLAUSIBLE-size, coarse only"). Usable for coarse size-bucket features
      only; NOT usable for queue-position or exact-size microstructure theory without the
      dedicated delta-vs-level test that campaign has flagged but not yet run. A future family
      MAY design coarse L3 features under this PARTIAL disposition but must carry the caveat
      forward explicitly, not silently treat L3 as confirmed.
    L4_multilevel_depth: >
      PROVENANCE FAIL. No depth/replay recordings exist; paid data barred; already exhaustively
