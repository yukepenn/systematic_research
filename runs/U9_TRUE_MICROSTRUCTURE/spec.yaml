  missingness_duplicates_gaps: >
    Spot-checked (per this directive's explicit instruction, not assumed clean) across the 40
    grid1s/NQ session files (built from merged main+_rth raw exports) plus targeted raw-parquet
    checks:
      1. DUPLICATE ROWS (not just duplicate TIMESTAMPS, which DATAPROBE01 already documented at
         46%/61%): a NEW finding from this family's own inspection — 13-53% of raw event rows
         (bip,time,price,volume all identical), varying by session and bip-type, are EXACT
         duplicates; of a 2,000-row spot sample, 95.5% of these are IMMEDIATELY adjacent to an
         identical predecessor row (back-to-back repeats), consistent with an exporter-side
         duplication artifact (e.g. OnMarketData firing twice) rather than genuine independent
         same-ms market prints. CONSEQUENCE: any feature built directly from raw tick/quote
         EVENT COUNTS (not price/OHLC, which are unaffected since duplicate rows carry identical
         values) must de-duplicate consecutive identical rows first, or it will substantially
         over-count real information content. Not previously documented in scalping_lab's own
         docs at this level of specificity as far as this family found.
      2. GRID1S SESSION-CLOSE COVERAGE: 6 of 40 grid1s files do not reach the nominal
         16:59:59 close. Individually diagnosed:
         - s20250901 (ends 12:59:59) and s20251128 (ends 13:14:59): GENUINE EXCHANGE EARLY
           CLOSES (Labor Day 2025-09-01 and the day after Thanksgiving 2025-11-28 respectively)
           — not a data defect, expected market behavior.
         - s20250924 and s20260430 (end 16:59:58, i.e. 1 second short): immaterial, last print
           landed one second before the nominal boundary.
         - s20251117 (ends 15:14:24, ~105min short): BOTH the main file (12M-cap, truncated
           13:52:20) and its _rth companion (12M-cap, truncated 15:14:24) hit their row caps —
           genuine afternoon gap. Already flagged by scalping_lab itself: CAMPAIGN_STATE.md's W9
           queue item "s20251117 20M-cap tick re-export also running" — independent
           corroboration this is a known, being-fixed issue, not a new discovery.
         - s20260519 (ends 16:27:08, ~33min short): BOTH main (capped, truncated 11:22:57) and
           _rth companion (ALSO capped, truncated 16:27:08) hit their row caps — genuine ~33min
           gap at the very session close. NOT flagged elsewhere as far as this family found —
           this is a fresh finding. Notably, the missing window (16:27-17:00 ET) overlaps this
           campaign's own C4 pre-close mechanism window (entry_blocked_c4/forced_flat_c4,
           30min/21min-before-close per UNIFIED_STATE_MAP.md) — a future family using this
           session near the close should exclude it or flag it, not silently treat the gap as
           "flat/no signal."
      3. RAW-TO-GRID MERGE BEHAVIOR (verified, not assumed): for the 11 OTHER capped sessions
         with a working _rth companion (e.g. s20260220), grid1s correctly continues past the raw
         main file's cap with live trade/quote activity through 16:59:59 — confirming the
         Layer-1 build pipeline already performs the main+_rth stitch/dedup correctly. A future
         family should prefer grid1s/sechilo over raw/ directly unless it needs true tick
         granularity, in which case it must replicate this exact merge (and the fact that the
         overlapping RTH-morning window covered by BOTH main and _rth files must be
         deduplicated, not concatenated raw).
      4. LAYER COVERAGE DELTAS: grid1s retains all 40 sessions (NaN bid/ask/mid for the 3
         L1-only ones); sechilo DROPS those same 3 sessions entirely (37/40) — verified by
         set-difference on file lists, exact match to the L1-only list above.
      5. UNDOCUMENTED SCALE CONVENTION (new finding): sechilo's price fields (mid_last/
         mid_high/mid_low) are NOT in raw price units — they are grid1s's `mid` multiplied by
         4 (i.e., NQ's 0.25-pt tick size expressed as an integer tick-count; NQ tick size
         verified on disk as the minimum nonzero raw price increment = 0.25). Verified by
         session-level join: sechilo.mid_last/4 vs grid1s.mid, corr=0.9999995, max abs diff
         across a full session = 1.625 points (consistent with second-bucket-edge timing noise,
         not a scale mismatch). Same 4x convention verified for ES's sechilo layer (ES tick size
         is also 0.25). CONSEQUENCE: any future construction reusing BOTH grid1s and sechilo
         must apply this scale factor explicitly or silently produce nonsense (a 4x price-level
         error) when the two are combined.

  causal_alignment_feasibility_to_U0_3min_bars: >
    FEASIBLE, method described (NOT implemented — construction is out of scope this run).
    Verified: U0's bars are timestamped at their own CLOSE, on exact 3-minute boundaries
    (minute%3==0), naive-ET, matching the tick substrate's own timestamp convention exactly
    (see timezone_and_resolution above). grid1s already provides strictly-causal 1-second
    snapshots ("All features CAUSAL (computed from data <= t)" per DATA_SUBSTRATE.md, spot-
    verified true in this family's own inspection: grid1s row at second s reflects only events
    with time<=s). HOW a future family would align them: for U0 bar with time=T (covering the
    half-open interval (T-3min, T]), aggregate the 180 grid1s rows with time in (T-3min, T]
    into whatever summary statistic the feature needs (e.g. mean spread, terminal mid, realized
    signed flow over the window) — this produces a feature "as of T" that is causal by
    construction. Per this campaign's own standing decision-lag convention (STANDING RIGOR:
    "decision computed from bar t's own M/close becomes pend, only takes effect... at bar t+1"),
    any such feature attached to bar T must not influence a decision until bar T+1, exactly
    mirroring how M/T/Tp are already lagged in U0. Scope limitation to flag for that future
    family: this alignment is only possible on the ~40 (soon more) session-DATES the tick
    substrate actually covers — a small, non-random (stratified-sampled), ~3.6%-of-U0's-window
    subset of U0's full 2022-2026 session count. A microstructure-conditioning OVERLAY on
    Product A/B (as opposed to a standalone scalp-native construction using its own trades)
    would therefore face a thin/non-random-overlap problem structurally similar to the one that
    already sank U2's Track-L attempt — this is flagged explicitly as an open design fork for
    whichever future family picks this up (see prequential_design.scope_fork_for_future_family).

  per_layer_disposition:
    L1_last_trade_ticks: >
      PROVENANCE PASS. Coverage, timezone, resolution, field semantics, contract convention all
      independently verified on disk; missingness fully characterized and causally explained
