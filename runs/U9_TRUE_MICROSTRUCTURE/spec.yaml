# =====================================================================================
# STEP 2 — FROZEN PREQUENTIAL EVALUATION DESIGN
# Applies to L1 and L2 (PASS/PASS-with-caveats); L3 may use the SAME block/clustering
# design IF restricted to coarse size-bucket features per its PARTIAL disposition above.
# Frozen BEFORE any feature-outcome relationship was inspected (none was, this run — see
# no_alpha_confirmation at the bottom).
# =====================================================================================
prequential_design:
  scope: >
    Designed for a STANDALONE scalp-native construction (its own tick/BBO-derived entries,
    exits, and trade blocks) built and evaluated entirely within the substrate described above.
    See scope_fork_for_future_family for the DIFFERENT, thinner-evidence case of a
    Product-A/B conditioning overlay.

  evaluation_shape: >
    EXPANDING-ORIGIN, calendar-MONTH blocks with a floor-3-sessions merge rule (chosen over a
    fixed-session-count block because the directive requires a calendar unit, and over a
    fixed-window rolling design because expanding-origin is strictly more data-efficient given
    how few sessions exist in any single month — a fixed rolling window would waste sessions in
    sparse months for no benefit). This is the literal shape the governing directive itself
    suggested ("expanding history -> score next non-overlapping month -> roll forward"), patched
    with one explicit, principled rule to handle the ACTUAL non-uniform monthly density found in
    step 1 (1-7 sessions/month) rather than assuming uniform daily coverage.

  merge_rule: >
    A calendar month with fewer than 3 materialized sessions is merged forward into the
    following month's block (chosen over merging backward so a thin recent month doesn't retroactively
    change an already-scored block). Applied once to current coverage: 2025-12 (2 sessions) merges
    with 2026-01 (1 session) -> one combined "2025-12+2026-01" block of 3 sessions. No other
    month falls below the floor.

  frozen_block_table (derived from the exact 40-session coverage found in step 1; MUST be
      re-derived, not reused verbatim, if the confirmation pool is exported and materially
      changes session counts per block):
    - block: 1 (TRAINING SEED ONLY — never scored, no prior block exists to train from)
      calendar: "2025-08"
      sessions: 3
      role: seed
    - block: 2
      calendar: "2025-09"
      sessions: 7
      role: scored
    - block: 3
      calendar: "2025-10"
      sessions: 4
      role: scored
    - block: 4
      calendar: "2025-11"
      sessions: 4
      role: scored
    - block: 5
      calendar: "2025-12+2026-01"
      sessions: 3
      role: scored
    - block: 6
      calendar: "2026-02"
      sessions: 5
      role: scored
    - block: 7
      calendar: "2026-03"
      sessions: 4
      role: scored
    - block: 8
      calendar: "2026-04"
      sessions: 6
      role: scored
    - block: 9
      calendar: "2026-05"
      sessions: 4
      role: "scored, STUB — partial calendar month (substrate stops 2026-05-20); do not compute
        month-over-month growth-rate metrics on this block as if it were a full month; only
        session-normalized statistics (mean/median per session) are valid here"
    totals: "9 blocks (1 seed + 8 scored), 37 sessions scored cumulatively, spanning 9 calendar
      months (Aug-2025..May-2026, one merged pair)"

  minimum_blocks_for_defensible_verdict: >
    >= 6 SCORED out-of-sample blocks, spanning >= 5 distinct calendar months and >= 25 sessions
    collectively, before ANY promotion-relevant statistic (pct-positive-blocks, worst-block,
    etc.) is treated as more than PROVISIONAL. Current substrate clears this (8 scored blocks /
    37 sessions / 9 months) but NOT comfortably — the floor-3 merge rule was necessary to reach
    it, and a future family with a model requiring more than block-1's 3 sessions of warmup
    (very plausible for anything beyond a trivial rule) will have FEWER effective scored blocks
    than this nominal count and MUST re-verify the >=6/>=25 bar against its own actual effective
    start block, not assume this spec's 8 applies unconditionally. If a future model needs its
    first N blocks purely for training, its own defensible-verdict floor is >= 6 blocks AFTER
    that training runway — with only 8 nominal blocks total, a model needing more than ~2 blocks
    of warmup will fail this bar on the CURRENT substrate and must wait for the confirmation
    pool to be exported.

  within_block_clustering_handling: >
    Unit of independence = SESSION, never tick, never quote-event, never sub-session hour.
    Rationale, grounded in this family's own step-1 findings: (a) 13-71% duplicate raw rows
    depending on session/bip-type: naive event-count weighting massively overstates effective
    sample size; (b) DATAPROBE01's own 46-61% duplicate-TIMESTAMP finding independently
    confirms the same pathology at a coarser level; (c) that campaign's own extensive Z1/DC/
    excursion work already established strong within-session price-path dependence at tick
    scale (persistence null r~2, not 1) — ticks within a session are NOT exchangeable draws.
    Procedure, mandatory for any future construction:
      1. All feature/outcome construction may use any within-session granularity (down to raw
         tick/BBO events), but MUST collapse to exactly ONE row per SESSION (a session-level
         summary: e.g. session net edge in the incumbent cost convention, session hit-rate,
         session trade/block count) before any cross-session statistic is computed.
      2. Block-level statistic = an explicitly-stated aggregation (equal-weighted mean across
         sessions is the default; session-duration-weighted is a documented alternative, must
         be named, not silently swapped) of that block's session-level summaries.
      3. The cross-block VERDICT treats the resulting sequence of 8 (or however many, per the
         re-verified minimum above) block-level numbers as the actual inferential sample. Use
         block-level nonparametric methods only: sign test / rank-based percentile summaries
         (pct-positive-blocks, median-block, worst-block) as PRIMARY evidence; if a
         significance test is wanted, use a block-level bootstrap that resamples WHOLE BLOCKS
         with replacement (never sessions alone, never ticks) given only 8-9 total blocks — do
         not report a normal-theory CI or t-stat computed as if 8 blocks were a large-N sample.
      4. EXPLICITLY FORBIDDEN: pooling all ticks/quotes/sessions into one dataset and computing
         a single global t-stat/Sharpe treating each tick (or even each session) as an
         independent draw. This is precisely the "millions of ticks != millions of independent
         observations" pathology this directive named, and this design disallows it by
         construction (mandatory session-then-block collapse before any pooling).

  required_reporting_for_a_future_alpha_family (verbatim per governing directive, restated
      with this family's own block-count requirement layered on top):
    - forward-only stitched net (in the incumbent BENCHMARK_C1 cost convention per
      research/scalping_lab/EXECUTION_MODEL.md — C1 is that campaign's own PRIMARY promotion
      screen, C2 the stress test, BBO_EXEC diagnostic-only; inherit this convention rather than
      re-deriving a new one, for cross-campaign comparability)
    - Sharpe, Sortino, MaxDD, CDaR95 — computed on the BLOCK-level P&L series (8 or however many
      numbers), not the tick- or session-level series
    - pct-positive-blocks, pct-positive-months (distinct from pct-positive-blocks whenever a
      block spans >1 month, i.e. the merged Dec+Jan block)
    - worst-block, median-block (dollar and per-session-normalized)
    - turnover (trades/session, to make cost-sensitivity legible)
    - right-tail-capture (see right_tail_check_fork below — the exact reference population
      forks on construction type)
    - number of independent SESSIONS, DAYS, and BLOCKS used — tick count must NOT be reported
      as a sample-size proxy anywhere in the promotion argument
    - explicit statement of which sessions (if any) were excluded and why (e.g. this spec's own
      2026-07-14/15 hygiene exclusion, or a session with a session-close data gap like
      s20260519)

  scope_fork_for_future_family: >
    Two structurally different uses exist and must be DECLARED before construction, since they
    have different evidentiary weight under this design:
      (A) STANDALONE scalp-native strategy: its own entries/exits/trade blocks built purely from
          tick/BBO data. This is what the block/clustering design above was built for. Right-
          tail check: build the construction's OWN top-20/bottom-20 winning-block list (there is
          no pre-existing "top-20" for a strategy that doesn't exist yet) and check what fraction
          would be touched/damaged by any filtering rule, exactly per this campaign's standing
          right-tail-preservation gate, applied to the NEW construction's own blocks.
      (B) A microstructure-derived CONDITIONING/soft-weighting feature on the EXISTING Product-A/
          B decision (matching this campaign's own U5/R4/R5 "soft information" framing). This
          case is evidentially WEAKER than (A): causal alignment to U0's bars is feasible (see
          causal_alignment_feasibility_to_U0_3min_bars above) but only for the ~40
          (currently)/~3.6%-of-U0's-window session-dates the tick substrate actually covers — a
          small, NON-RANDOM (stratified-sampled) overlap. This reintroduces a thinner version of
          exactly the coverage problem that sank U2's Track-L attempt, even though the
          PREQUENTIAL block design (not LOYO) is being used. A future family choosing (B) must
          treat its verdict as provisional on this thin overlap and should not claim the same
          strength of evidence as (A) even if the block-level statistics look identical. Right-
          tail check for (B): the EXISTING system_master top-20 sign(position_B)/
          sign(target_exposure_A) all-time winning blocks, restricted to whichever of those
          blocks' dates happen to fall inside the tick substrate's ~40-session coverage (likely
          very few — must be reported as a fraction, e.g. "N of the top-20 blocks have ANY
          overlap with tick-covered dates", not silently skipped).

  frozen_session_exclusions:
    - "2026-07-14, 2026-07-15": >
        hygiene exclusion (not a contamination finding) — inside scalping_lab's own scalp
        holdout, touched only by DATAPROBE01's non-alpha capability probe, already ruled
        non-contaminating by that campaign's own ledger; excluded here anyway as a margin of
        caution for any future scored block.
    - "s20260519 near-close window (16:27-17:00 ET only, not the whole session)": >
        genuine ~33min data gap found in step 1, overlapping this campaign's own C4 pre-close
        mechanism window — flag, do not silently treat as flat/no-signal if a future
        construction's logic touches that window on that date.

no_alpha_confirmation: >
  Explicitly confirmed: no feature-outcome correlation, no P&L computation, no candidate
  construction, no threshold selection, and no outcome variable of any kind was computed or
  inspected by this family. All work above is schema/coverage/timestamp/field-semantics/file-
  count inspection only. This family produces ONLY the provenance determination and this frozen
  design, both intended for a future, separately preregistered U9-alpha family to consume.
