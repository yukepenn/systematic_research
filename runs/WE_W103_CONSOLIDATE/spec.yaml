title: >
  WHAT IS THE BASE, ACTUALLY? Combine the survivors at their CORRECTED definitions, measure the
  whole correlation matrix rather than one pair, and then re-run the capture ledger on the winner
  to answer the only question that matters next: WHAT MARKET MOVEMENT IS STILL UNMONETIZED?

# ---------------------------------------------------------------------------------------------
# 1. THE COMPONENTS, at the definitions that survived W97-W102c
# ---------------------------------------------------------------------------------------------
components:
  P1_PCT:      "the incumbent, with W98's per-contract session box"
  X9a_PCT:     "the P1 object with the X9a channel in the OR slot, per-contract box"
  BMOM:        "the bare latched channel, size 1 (box denomination is a no-op on it)"
  PAIR23:      "2 BMOM : 3 X9a, sleeves boxed independently, per-unit"
  XM_CONFLICT: >
    W102c's CORRECTED definition: anchor at the bar stamped 09:31 (the TRUE RTH open under this
    repo's end-stamping), decide at 09:45, fill at the 09:46 open, hold to 15:45, size 1, NO stop
    (W102's stop curve found none helps at any distance from 20 to 300 points).
    $560/trade, 54.3 % hit - NOT the $675/57.3 % first published at the one-minute-early anchor.

honesty_note: >
  P1, X9a and PAIR23 are NOT independent objects. P1 CONTAINS bmom; X9a is the same full object
  with one channel swapped and shares 13 ratchet members with it; PAIR23 is built from BMOM and
  X9a. The campaign has repeatedly counted these as separate engines and W97 already had to correct
  that once. The full weekly correlation MATRIX is printed for exactly this reason - so a reader
  can see how few information sources there really are before reading any combination.

# ---------------------------------------------------------------------------------------------
# 2. HOW THEY ARE COMBINED - no optimisation on one history
# ---------------------------------------------------------------------------------------------
primary_combination: >
  INVERSE-VOLATILITY EQUAL RISK on the weekly series, which has NO free parameter: weight each
  component by 1/sigma_weekly, normalised. This is the preregistered primary precisely because it
  cannot be tuned.
sensitivity: >
  A coarse INTEGER-RATIO grid is reported as a PLATEAU, not an argmax. Directive section 12 asks
  for coarse integer ratios and broad plateaus; W97/M1 established that two of the three legs of
  the campaign's rolling gate are algebraically scale-invariant, so a ratio grid mostly moves the
  raw-drawdown leg. The argmax of the grid is NOT ADOPTED and is labelled as such wherever printed.
exposure_convention: >
  INCOME-MATCHED, fixed in the instrument as W97 recommended - the only convention with no free
  parameter, since income is what is being bought and drawdown is its price. Weekly $ at a fixed
  $20,245 max drawdown is the headline metric and is algebraically scale-invariant.

# ---------------------------------------------------------------------------------------------
# 3. THE SECOND HALF - what is STILL unmonetized (TASK 13)
# ---------------------------------------------------------------------------------------------
capture_ledger_v3: >
  Re-run W99b's SIGN_ORACLE ledger against the chosen combination instead of against P1 alone:
  per segment and per session class, the executable ceiling, what the combination now takes, the
  residual, and p*. The output is the next research agenda and it replaces W99's.
required_reads:
  - "which segments the combination now covers that P1 alone did not"
  - "whether TREND-DOWN - W99's #1 ranked block at $11,609/session of that class - is still open"
  - "whether MORN, the largest single-segment residual at $1,710/session, is now smaller"

# ---------------------------------------------------------------------------------------------
# 4. DECISION RULE
# ---------------------------------------------------------------------------------------------
decision_rule:
  - "NOTHING IS PROMOTED OR ENABLED. This wave states what the base IS and what is still missing."
  - "Every caveat travels: XM_CONFLICT is REGIME_LOCAL by DATA AVAILABILITY (cross-market
     substrates begin 2022-01-02, no deep test exists or can exist), N ~ 348, the window is
     discovery-consumed, and rho with B-MOM is +0.41."
  - "The correlation MATRIX is printed before any combination is quoted, so nobody reads a
     four-object portfolio as four information sources."
  - "If the inverse-vol primary is beaten by an integer ratio, the plateau is what is reported -
     a single winning cell of a grid is worth what W95 measured such a cell to be worth: the
     87.5th percentile of pure best-of-31 scan noise."
