known_blocking_risk: >
  Building either object requires NT8 to rebuild NinjaTrader.Custom.dll. WriteNinjaScriptFile
  makes a best-effort reflection trigger and may return compile_engine="file_only", in which
  case an owner F5 / NT8 restart is needed. Per §16 that does NOT halt the wave: the source is
  committed, the item is parked in OWNER_QUEUE.md, and work continues on everything else.

