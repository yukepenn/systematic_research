run_id: ICT0102_EVENT_SEQUENCE
family: >
  ICT01 (event-sequence: sweep/MSS-BOS, first pass) + ICT02 (PDH/PDL objective, addendum F0-F6).
  research/system_master/CONTINUOUS_EVOLUTION_WAVE4_PLAN.md addendum row "ICT01+ICT02: Event-
  sequence science (sweep/MSS/FVG, PDH/PDL)". Information class: NQ_OHLCV (event ORDER/sequence
  novelty of already-available price data, not a new raw data source -- not counted as an
  independent information source when tallying campaign evidence).
frozen_before_code: true
frozen_before_results: true
date_frozen: 2026-08-09

data_reuse: >
  Zero new CrossTrade/NT8 calls, zero new backtest engine, zero new decision/pricing logic.
  Reuses runs/U0_UNIFIED_STATE/out/u0_state_table.parquet exclusively (t_idx, sess_date, OHLC,
  M, position_B, session_phase, sigma460_atr_proxy_pts, bar_pnl_B_nq_dollars, year,
  is_health_only_bar, action_B, block_id_B, run_pnl_B_dollars). Product B is the target (not
  Product A): PDH/PDL sweep/rejection/MSS is inherently a binary long/short/flat decision-layer
  question, matching the addendum's own "position_B sign or sign of M" conditioning language.
  sign(position_B)==sign(M) agrees on 99.68% of in-position canonical bars, confirming position_B
  is a faithful, disclosed proxy for "M direction."

correctness_gate: >
  Both scripts independently load u0_state_table.parquet, slice to the canonical window
  (is_health_only_bar==False), sum bar_pnl_B_nq_dollars, and assert exact equality (within
  $0.01) to the certified canonical net $301,915.92 BEFORE computing any ICT feature. Both
  scripts hard-fail (assert) if this does not reproduce -- no result is computed on an
  unverified substrate.

ICT02_pdh_pdl:
  construction: >
    At every bar, PDH/PDL = the high/low of the most recently FINISHED session (grouped by
    sess_date, session-level max/min, then shift(1) across sess_date-sorted sessions) -- never
    the current in-progress session's own high/low. First session of the table (460 bars) has
    no PDH/PDL and is dropped. Sweep state uses a CAUSAL intraday running max/min of the CURRENT
    session's own high/low (pandas cummax/cummin within sess_date, so it only reflects what has
    already printed by bar t) compared against the fixed prior-session PDH/PDL.
  features: >
    dist_to_pdh_pts/atr, dist_to_pdl_pts/atr (raw, sigma460-normalized); swept_pdh_today,
    swept_pdl_today (causal running-extreme booleans); state_pdh/state_pdl in
    {not_swept, accepted (swept AND close still beyond), rejected (swept AND close back inside)}.
    For the forward-value test, features are re-expressed TRADE-DIRECTION-ALIGNED (matching the
    R4/R5 "_aligned" convention) as dist_favorable_atr/dist_unfavorable_atr and
    swept/accepted/rejected_favorable/unfavorable, oriented to position_B's sign (favorable =
    the level in the trade's own direction; unfavorable = the level behind it), restricted to
    position_B!=0 canonical bars -- mirrors EXP01's "every bar where the product holds a nonzero
    position" scoping exactly.
  outcome: >
    Forward-20-bar Product-B NQ P&L (bar_pnl_B_nq_dollars summed over t+1..t+20, vectorized via
    cumsum, identical convention to EXP01's forward-20-bar-P&L-per-contract; Product B always
    trades 1 lot so no per-contract division is needed). The forward window may look past the
    canonical/health-only boundary into already-consumed 2026-06/07 data (never into the sealed
    >=2026-08-01 region, which is not present in this table) -- this is a legitimate, disclosed
    boundary-truncation-avoidance choice, not a leak into sealed data.
  method: >
    Same information-addition framework as R4/R5/EXP01: raw Spearman vs fwd20_pnl, residualized
    Spearman after removing an M_abs-tercile x sigma460-tercile bucket mean (bucket computed on
    the same analysis subsample), OLS R^2 improvement over an M_abs+vol_z baseline (interpretable
    linear regression only, no black-box model), year-by-year sign/magnitude stability, right-
    tail audit (PDH/PDL state at ENTRY of the top-20/bottom-20 all-time Product-B blocks by
    run_pnl_B_dollars).
  falsification_condition: >
    If no PDH/PDL feature shows a stable (multi-year, non-sign-flipping), incremental (survives
    M/vol residualization) relationship to forward P&L, ICT02 closes as REDUNDANT / NO
    INCREMENTAL INFORMATION beyond the incumbent's own M/vol state -- no construction attempted.

ICT01_sweep_mss:
  swing_definition: >
    PREREGISTERED K=5 bars (15 minutes on this 3-min bar table), single value, no sweep. A bar i
    is a swing-high candidate iff high[i] is strictly greater than all K bars to its left AND not
    exceeded by any of the K bars to its right (symmetric fractal). It becomes causally KNOWABLE
    starting at bar i+K+1 (one bar after the K-bar right-side confirmation resolves at bar i+K --
    an extra-conservative buffer beyond the minimum i+K, explicitly to avoid same-bar
    lookahead ambiguity). Symmetric for swing lows. Computed on the continuous t_idx sequence
    (NOT reset per session), matching this table's own roll_hi20/roll_lo20 precedent.
  sweep_definition: >
    SWEEP_UP at bar t = high[t] > the most recently causally-known swing-high price as of t
    (intrabar breach, "the most recent causally-known ... swing point," verbatim from the
    addendum). A transition-edge flag (sweep_up_event) fires only on the FIRST bar of a fresh
    breach (or immediately after the reference level itself updates), not on every subsequent bar
    price remains above it. Symmetric SWEEP_DOWN/low.
  mss_definition: >
    MSS/BOS at the SAME bar t = close[t] beyond the identical swing level used for the SWEEP test
    (close[t] > known_swing_high[t] for an up-sweep, close[t] < known_swing_low[t] for a
    down-sweep) -- i.e. MSS is a same-bar, close-confirmed STRICT SUBSET of SWEEP (every MSS bar
    is also a SWEEP bar, since close<=high and close>=low). This was deliberately chosen over an
    N-bar-forward "confirmation window" specifically to avoid a predictor/outcome measurement-
    window overlap (the exact confound class flagged by the shared discipline's too-good-to-be-
    true gate, previously caught in U5/LEV01): with same-bar MSS, the forward-20-bar outcome
    window can start cleanly at t+1 with zero overlap with the predictor.
  scope: >
    FIRST PASS ONLY per the addendum's own instruction: SWEEP-ONLY vs SWEEP+MSS, restricted to
    sweep events on position_B!=0 canonical bars with a complete forward-20-bar window. The fuller
    5-level ablation (+displacement/+FVG/+retracement) is explicitly NOT attempted this pass and
    is deferred as a follow-up ONLY IF this first pass shows something worth extending.
  outcome: >
    Forward-20-bar Product-B NQ P&L from the sweep-event bar (bars t+1..t+20), identical
    convention/vectorization to ICT02.
  method: >
    sweep_with_position (1 = sweep direction matches position_B's sign, i.e. continuation-type;
    0 = adverse/against-position sweep) as the SWEEP-ONLY predictor; confirmed_mss (0/1, same-bar
    close-confirmation) added on top as the SWEEP+MSS predictor, plus an interaction term. Same
    R4/R5/EXP01 information-addition framework (raw/residualized Spearman, OLS delta-R^2 vs an
    M_abs+vol_z baseline computed on the sweep-event subsample, year-by-year stability, right-tail
    audit of sweep/MSS incidence within the top-20/bottom-20 all-time Product-B blocks).
  falsification_condition: >
    If SWEEP-ONLY and SWEEP+MSS both show no stable, incremental relationship to forward P&L,
    ICT01 closes as REDUNDANT this pass -- explicitly do not force the fuller ablation, per the
    addendum's own instruction to "report that honestly as the finding."

construction_gate: >
  A candidate is constructed ONLY IF a genuinely incremental, stable (multi-year, non-sign-
  flipping), right-tail-safe relationship is found in either sub-family -- same bar this
  campaign has held R4/R5/EXP01 to. No session-specific parameter farm, no black-box filter.

promotion_gate: none (diagnostic first pass; if either sub-family had survived, describe -- not
  build -- one bounded candidate for a future, separately preregistered family)
