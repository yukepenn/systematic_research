what read 1 established (3 of 4 axes FAIL, 1 is the campaign's first tail-decoupled sleeve):
  A FADE EVENT - FALSIFIED, decisively: -11.39 and -12.38 pts/session, Sharpe -0.22/-0.25,
    in the market on 88-90 % of the long object's bars. The reopening was legitimate (W11/W18
    falsified fade as a STATE rule, before W31 established that this instrument pays events)
    and the answer is still no. Value reversion on NQ 1-min loses as an EVENT too.
  C SWEEP-AND-RECLAIM - FALSIFIED: -3.08 pts/session, Sharpe -0.082. The stop-run story does
    not pay at this cadence with these frictions.
  D COMPLEMENT-SET RIDGE - FALSIFIED on frictions: +2.14 pts/session gross of the stress line
    but stress-net -$55/week, Sharpe 0.048, eff 0.015. Structural orthogonality was achieved
