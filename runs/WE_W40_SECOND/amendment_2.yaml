VERDICT (self-correction, recorded): B IS NOT ADOPTED AS A SECOND MODEL.
  It is a CANDIDATE with a two-year record and three negative years. The amendment-1 adoption
  is withdrawn. What survives: B is the first non-Solar engine in this campaign that is not
  catastrophically negative and that decouples inside the long object's drawdowns, and on the
  full window the pair does buy an 8 % CVaR-efficiency improvement for 5.6 % of the money -
  a marginal trade, not a decisive one.
  This is the same failure mode the campaign has caught before (a favourable window producing
  a headline) and it was caught here only because the full-window re-measurement was made a
  precondition for writing anything into the state documents. That precondition is now
  standing policy for every adoption.

amendment 3 (this run) - what B actually is, two cheap diagnostics declared in advance:
  H1 DEEP HISTORY: the identical engine on 2006-2021, data this campaign has never used.
     Several profitable earlier years -> B is REGIME-CONDITIONAL and the 2022-2024 gap is a
     regime gap. Flat or negative across 16 years -> B is RECENCY and stays parked.
  H2 REGIME CONDITIONING: split B's trades by a causal volatility-regime variable (trailing
     20-session ATR over trailing 250-session, known at the session's start) and by year-half.
     If B's money concentrates in one regime band AND that band is not simply "2025-2026",
     B becomes a regime-gated candidate; if the split is really just time, it is recency.
promotion condition for B (declared now, so a later positive read cannot be rationalised):
  B returns to candidacy for adoption only if H1 shows >= 8 of 16 positive deep-history years
  OR H2 isolates a regime band that is profitable in BOTH the 2022-2024 and 2025-2026 halves.
