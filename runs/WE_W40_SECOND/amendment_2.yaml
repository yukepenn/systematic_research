amendment 1's result, and why it must not be written into the state documents as it stands:
  On the walk-forward-comparable window (2023-07 -> 2026-08) axis B cleared every one of the
  five preregistered adoption conditions:
    stress-net +$390/wk standalone; corr 0.07; drawdown-conditional corr -0.18;
    weights w = 0.05..0.20 all improve eff or CVaR-efficiency at CONSTANT total exposure
    (w=0.05 improves eff 0.229->0.241, CVaR-eff 0.289->0.310, Sharpe 0.331->0.340 AND the
    worst week -7,418 -> -6,935, a four-way improvement matched previously only by the session
    halt); parameter surface NOT knife-edge (81 % of 36 settings stress-positive, and the
    preregistered 1.6/1.0/15 is a BELOW-median setting, so the quote is conservative);
    both nulls at the 100th percentile, p = 0.000.
    Its parameter walk-forward FAILED (64 % churn, 46 % Sharpe retention), so under the
    preregistered rule B would be quoted at fixed preregistered parameters with churn
    disclosed.
  BUT that window is the STRONGER half for the long object (16.91 vs 14.72 pts/session
  full-window), and it was chosen for Q1 comparability in W39, not for B.

