campaign: "#7 WEEKLY_EDGE"
date: 2026-08-27
status: PREREGISTERED
authority: "Owner MEGA DIRECTIVE V5 sections 8, 9, 25, 39 and 36 (P0-C)."

title: >
  XM_CONFLICT forensic health, part 2 - LOSS DIVERSIFICATION and TAIL-WINNER CAUSAL STATE.
  W105 delivered the authoritative period table, the concentration profile and the ordinary weekly
  correlation. It left two questions that decide whether the candidate portfolio survives, and the
  directive names both: (1) ordinary rho rising to +0.464 over six months only matters economically
  if DOWNSIDE co-movement rose; (2) 20 of 348 trades carrying 85 percent of the money is only a
  disqualifier if those winners are unrelated accidents rather than one recurring causal state.

MEASUREMENT_ONLY: >
  THIS WAVE MAY NOT CREATE A PARAMETER, A FILTER OR A THRESHOLD. Section 8: "Do NOT optimize XM
  based on the following diagnostics. Measure only." If a diagnostic here suggests a restriction of
  the object, that restriction is FORBIDDEN in this wave and must be preregistered separately with
  its own null. A test that kills the edge is a reason to withdraw the candidate, never to restrict
  it to the surviving subset.

reproduction_gate: >
  The wave ABORTS and issues no table unless the canonical object reproduces exactly: anchor 571
  (the bar stamped 09:31, the true RTH open under end-stamping) must give N = 348, and anchor 570
  must give N = 342. Same assertion W105 used. If the substrate has moved, nothing below is quotable.

# ---------------------------------------------------------------- section 9
downside_diversification:
  note: >
    Section 9 is explicit that ordinary weekly rho alone is the wrong instrument. If rho rises
    because both engines make money in the same good weeks, that is not the same problem as
    synchronized losses. Portfolio value is judged by LOSS diversification.
  rolling:
    - "rho(XM, P1/PCT) on weekly dollars at 13, 26 and 52-week windows, the FULL PATH printed, not one number"
  conditional:
    - "rho restricted to weeks where P1/PCT lost"
    - "rho restricted to weeks where XM lost"
    - "P(XM < 0 | P1 < 0) and P(P1 < 0 | XM < 0), with the unconditional rates beside them"
    - "worst-decile overlap: P(both in their own bottom decile)"
    - "joint worst-week overlap: the intersection of the two bottom-10 week sets"
    - "tail beta: OLS slope of XM weekly on P1 weekly restricted to P1's bottom decile, against the all-week slope"
    - "joint drawdown depth and duration of the inverse-vol combination vs each leg alone"
    - "XM-ACTIVE conditional rho: restricted to weeks carrying at least one XM trade, because weeks with no XM trade contribute a structural zero that dilutes every correlation in the record"
  null: >
    CIRCULAR-SHIFT null on the weekly series - 1,000 shifts of XM's weekly vector against P1's,
    preserving each series' own autocorrelation and its own marginal distribution. Every downside
    statistic above is quoted as a percentile of that null. A raw conditional probability without
    its null is not evidence; "P(XM<0|P1<0) = 0.5" means nothing until we know what independence
    would have produced on 213 weeks with these two marginals.

# ---------------------------------------------------------------- section 8
tail_winner_causal_state:
  question: >
    Are the large winners generated by the same causal PRE-ENTRY state, or are they unrelated
    accidents? Section 25: mechanism-consistent concentration can be real alpha; unexplained
    idiosyncratic concentration lowers confidence.
  strict_causality_rule: >
    Every feature below is computed from information available AT OR BEFORE 09:45 on the trade's own
    session. NO FUTURE PATH, no MFE, no MAE, no realized move, no holding-period statistic. Using
    the future path to define the state is the exact error the directive forbids and would make the
    answer circular by construction.
  pre_entry_features:
    - "abs(NQ opening drive) in points, 09:31 open -> 09:45 close"
    - "abs(broad composite z) - the magnitude of the ES/RTY/YM disagreement, not merely its sign"
    - "DIVERGENCE = abs(drive z - composite z), how far apart NQ and the complex actually are"
    - "trailing-60-session realized sigma of each market, the denominator of the z itself"
    - "morning volume 09:31-09:45 vs its trailing-250-session median"
    - "opening gap: 09:31 open vs the prior session close"
    - "overnight range 18:01 -> 09:30 vs its trailing median"
    - "trade direction (long / short), day of week, and the committed CPI/NFP/FOMC announcement flag from c01_announcement_calendar.csv"
  tests:
    - "per feature: top-20 winners vs the other 328, mean and median difference, with a 2,000-draw label-permutation p-value"
    - "aggregate: leave-one-out logistic regression on the pre-entry features scoring P(top-20 winner), reported as AUC against a 2,000-draw permutation null. LOO because n=348 and an in-sample AUC on eight features is guaranteed to look good"
    - "the same two tests run on the top-5 and top-10 sets, so a result that exists only at one arbitrary cut is visible as such"
  interpretation_fixed_in_advance:
    - "AUC clears its permutation null AND at least one pre-entry feature separates -> MECHANISM-CONSISTENT CONCENTRATION. Confidence in XM RISES. Still no filter is built here."
    - "AUC does not clear -> the tail winners are NOT identifiable from the pre-entry state we can observe. Concentration then stands as an UNEXPLAINED risk property and confidence FALLS."
    - "Either way the object is not modified, not restricted and not retuned by this wave."

status_labels_available:
  note: "Section 39: do not infer from raw rho alone, and do not automatically delete XM."
  options: [ACTIVE COMPONENT, REDUCED CONFIDENCE, WATCH, STANDALONE ONLY, DEMOTED]
  decided_by:
    - "is standalone alpha still positive?"
    - "is downside overlap worsening beyond its own null?"
    - "does it still add fixed-drawdown portfolio value?"
    - "is the recent change statistically and mechanistically meaningful, or 26 weeks of noise?"

decision_rule:
  - "NOTHING PROMOTED, NOTHING DEMOTED BY MEASUREMENT ALONE - the wave outputs a STATUS LABEL and the evidence for it, and updates CURRENT_BASELINE.md."
  - "Every number is quoted against its null or is not quoted."
  - "If a statistic contradicts something already written in CURRENT_BASELINE.md, the older statement is WITHDRAWN explicitly in the report, not quietly overwritten."
