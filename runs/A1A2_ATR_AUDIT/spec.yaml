# IMMUTABLE preregistered run spec — written and committed BEFORE any code or result.
run_id: A1A2_ATR_AUDIT
experiment_id: SYSTEM_MASTER_FINAL_DIRECTIVE
hypothesis_id: directive §7 A1 (drawdown complementarity) + A2 (where ATR adds information).
family: atr_reframing
track: R (research) — DIAGNOSTIC pair, not a new alpha hypothesis (reuses the CLOSED, frozen
  ATR-75/25 construction exactly as-is; asks a different question of the SAME evidence). Alpha
  budget 0 — directive §19/§21 classifies ATR as PARETO/near-miss, not reopening the weight
