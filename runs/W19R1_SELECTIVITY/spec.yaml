  capture ratio per V6 §3, never a magnitude.
red_team: MANDATORY (V7 §G). Both arms. Verdicts verbatim under red_team/; corrections into
  REPORT.md, never into this spec (C6). The reviewer will be instructed explicitly to run any
  de-confounding experiment this run queues rather than merely flagging it — that is what made
