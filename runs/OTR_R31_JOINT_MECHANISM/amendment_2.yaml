supersedes: nothing.  Part A and amendment 1 stand as recorded, including both failed predictions.

data_correction: >
  R30's spec and REPORT stated "June/July 2026 bars are not local; extending requires a fresh
  export".  THAT WAS WRONG and is corrected here rather than quietly fixed.  Two exports already
  exist in the repo and were overlooked:
      research/original_trader_reconstruction/data/nq0626_jun2026_1m.csv    2026-05-24 .. 2026-06-18
      research/original_trader_reconstruction/data/nq0926_junjul2026_1m.csv 2026-06-14 .. 2026-07-31
  With the parquet (to 2026-05-29) these give CONTINUOUS 1-minute coverage to 2026-07-31.
  LOCKED_FORWARD still seals 2026-08-01 onward, so OTRIMG-0164 (8/2-8/14) remains excluded from
  selection.  Nothing in the sealed window is touched.

  Contract roll is irrelevant to the quantities used here: ATR, session range and max_run are all
  DIFFERENCES, so a back-adjustment offset cancels within a window, provided each window is drawn
  from a single file.  Window-to-file assignment is fixed in advance:
      5/31-6/5, 6/7-6/12          -> nq0626
      6/14-6/18, 6/21-6/26,
      6/28-7/10, 7/12-7/31        -> nq0926

# ------------------------------------------------------------------------------------
# PART A-EXT - extend the volatility law from 17 to 22 windows
# ------------------------------------------------------------------------------------
part_a_ext:
  why: >
    The exit-class identification (his hold ~ ATR^-1.636, R^2 = 0.923, matched only by fixed-point
    trailing stops) rests on 17 windows ending 2026-05-29.  The five June/July windows include the
    two largest right-tail weeks of 2026 - 6/21-6/26 (payoff 2.91, the best of the year) and
    7/12-7/31 (payoff 2.16) - which are exactly the windows the owner asked the mature architecture
    to explain.  Adding them is the strongest available out-of-sample test of the identification
    that does not touch sealed data.
  preregistered:
    I1: >
      PREDICTION: the power law survives.  Fitting his hold ~ ATR^b over all 22 windows keeps
      b within [-2.0, -1.2] and R^2 above 0.75.
      If b moves outside that band or R^2 collapses below 0.6, the law was a 17-window artefact
      and the exit-class identification is WITHDRAWN.  Stated so it is falsifiable on data the
      identification was not fitted to.
    I2: >
      PREDICTION: the two right-tail weeks do NOT break the law - i.e. they are low-ATR weeks with
      long holds, continuing the same relation, rather than outliers.  If they are high-ATR weeks
      with long holds they falsify the mechanism directly, since a fixed trail cannot produce long
      holds at high volatility.
    I3: >
      Report the dollar co-scaling correlations over 22 windows too.  PREDICTION: corr(ATR, his
      avg_win) and corr(ATR, his avg_loss) stay negative and close together, and corr(ATR, payoff)
      stays near zero - i.e. the exposure-law signature survives out of sample.

# ------------------------------------------------------------------------------------
# PART E - the 2023 entry-quality test, on the ALREADY-RECOVERED path
# ------------------------------------------------------------------------------------
part_e:
  why: >
    Amendment 1's H2 predicted that IF his exit is a 20-30 point trail, his entries must be
    positioned so a tight trail is not hit before a large move develops - which requires a tightly
    bounded per-trade MAE.  2026 has no MAE data.  But Jan-2023 does, and we do not need to solve
    anything new: runs/OTR_R11_INVERSE/out/r22_global_path_11days.json already contains the UNIQUE
    89-trade path that reproduces all eleven OTRIMG-0003 rows to the cent, and inverse_core.mae_mfe
    is already certified 90/90 against the NT8 engine.  This reuses both.
  preregistered:
    E1: >
      Measure the per-trade MAE distribution of his 89 recovered 2023 trades, in index points.
      PREDICTION (from H2): if a tight trailing stop were operating, MAE would be tightly bounded.
      In 2023 it is NOT expected to be, because the 2023 mechanism is already known to be a
      stop-and-reverse on Solar flips with NO trailing stop.  So E1 is a CONTROL, not a
      confirmation: it establishes what a STATE-based-exit era's MAE distribution looks like.
    E2: >
      THE ERA DISCRIMINATOR.  Fit his 2023 hold ~ ATR^b on the recovered path, per day.
      PREDICTION: 2023 gives a FLAT exponent (near the state-based band, |b| < 0.6, low R^2),
      because the 2023 exit is demonstrably state-based (Solar flip).  2026 gives -1.64 with
      R^2 0.92.  If both eras give the same steep law, the law is NOT diagnostic of exit class and
      amendment 1's identification is withdrawn.
      This is the cleanest available test of the whole identification, and it costs nothing.

binding_rules:
  - Nothing from 2026-08-01 onward is touched.
  - Net P&L may not select anything.
  - Failed predictions recorded, not rewritten.
  - Reuse existing certified machinery; do not re-derive the 2023 path or the MAE rule.
