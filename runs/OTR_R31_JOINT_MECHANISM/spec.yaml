# ---------------------------------------------------------------------------------
# PART A - the VOLATILITY / EXPOSURE LAW  (directive section 8) - HIGHEST EVI
# ---------------------------------------------------------------------------------
part_a:
  motivating_measurement: >
    corr(ATR, HIS hold) = -0.883; a log-log fit gives hold ~ ATR^-1.636 with R^2 = 0.923.
    CONTROL ALREADY RUN: our incumbent, which HAS fixed distances (130-pt stop, fixed rails) and
    NO explicit ATR logic, produces exponent -0.338 with R^2 = 0.169, and -0.405 / -0.439 at
    65 / 32.5 pt stops.  So "fixed distance" alone does not reproduce his law in our engine.
  correction_to_my_own_benchmark: >
    My H-V1 benchmark of "exponent = -1" was WRONG and is recorded rather than quietly replaced.
    Under diffusive price motion a FIXED distance D is traversed in time ~ (D/sigma)^2, giving
    exponent -2; under purely ballistic motion it gives -1.  Real price sits between, so a
    fixed-distance exit predicts an exponent in [-2, -1].
    HIS -1.636 lies INSIDE that band.  OURS (-0.34) does not.
  hypotheses:
    H-V1: fixed distance, no explicit ATR logic -> exponent in [-2,-1] with HIGH R^2
    H-V2: explicit volatility-normalised exit   -> exponent near 0, since scaling removes it
    H-V3: dynamic quantity only                 -> exponent near 0 for HOLD (quantity cannot
                                                   change holding time), but dollar win/loss
                                                   co-scaling with ATR
    H-V4: hybrid                                -> dollar co-scaling AND a steep hold exponent
  preregistered:
    A1: >
      THE KEY TEST.  Re-score all 26 R30 Part-C exit families on the ATR-hold law: fit
      log(hold) ~ b*log(ATR) per family, record b and R^2.
      PREDICTION: distance-based families (X_TRAIL_PTS, X_TARGET) land in [-2,-1] with high R^2;
      state-based families (X_OPP, X_TREND, X_FV, X_BAND) stay near -0.3 with low R^2; and the
      volatility-scaled family (X_TRAIL_ATR) sits nearest 0.
      If that ordering holds, the ATR-hold law IDENTIFIES THE EXIT CLASS even though R30 Part C's
      fingerprint distance could not - the first positive identification of his exit class.
      If the ordering does NOT hold, the law is not diagnostic of exit class and A2 is not run.
    A2: >
      Given A1, report which family best matches his (b = -1.636, R^2 = 0.923) JOINTLY, and state
      explicitly whether that family ALSO failed R30's C1 asymmetry test.  A family matching the
      volatility law while failing C1 is reported as BOTH, never as a winner.
    A3: >
      H-V3 SEPARATION, registered because the owner corrected me on exactly this point:
      quantity scaling CANNOT change holding time.  Therefore if any CONSTANT-QUANTITY family
      reproduces his steep hold exponent, dynamic quantity is NOT REQUIRED to explain hold, and
      cause E is then supported by the dollar co-scaling ALONE.  I previously implied sizing was
      supported by both the co-scaling and the hold law; that was wrong and is corrected here.

