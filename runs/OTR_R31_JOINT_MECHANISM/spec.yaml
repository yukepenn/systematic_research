# PART B - platform-boundary map (directive section 2)
# ---------------------------------------------------------------------------------
part_b:
  method: >
    For every 2026 Strategy Analyzer frame record: the last visible custom row, the first visible
    platform category, the count of custom rows above the boundary, VF-tail alignment, and scroll
    position.  The first Data Series group is a HARD positional anchor - everything above it is
    strategy-exposed, everything from it down is platform.
  deliverable: parameter_archaeology/2026_PLATFORM_BOUNDARY_MAP.csv
  preregistered:
    B1: >
      PREDICTION: the VF13 block sits IMMEDIATELY above the boundary in every frame showing both.
      This is already recorded as a FACT in 2026_PANEL_TOPOLOGY.md section 2 ("the next row below
      is the group header Data Series; nothing sits between them"), so this is a CONFIRMATION
      pass, not a discovery, and must be written as such.
    B2: >
      The boundary yields an absolute row index for the VF tail in every frame that shows it.
      PREDICTION: using it as an anchor REDUCES uncertainty on relative scroll offsets versus the
      thumb-geometry estimate alone.  Report the improvement, or report that there is none.

