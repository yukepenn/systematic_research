# PART C - strategy-class adjudication (directive sections 4, 5)
# ---------------------------------------------------------------------------------
part_c:
  hypotheses:
    H-COMP: most Feb-Aug 2026 frames are ONE strategy class at different scroll positions
    H-MULTI: two or more distinct Strategy Analyzer strategy classes are represented
    H-HYBRID: one dominant composite strategy PLUS separate sleeves at the account level
  method: >
    Decide on panel geometry, group ordering, platform-boundary alignment, VF-tail anchors,
    parameter-sequence continuity and version chronology.  NEVER on P&L.
  preregistered:
    C1: >
      PREDICTION: H-COMP or H-HYBRID.  The falsifier for H-COMP is a frame whose custom rows
      cannot be reconciled with any scroll slice of a single list - for example one where the
      VF13 block is NOT immediately followed by the Data Series separator.
    C2: >
      BINDING RULE going forward: a new "family" may NOT be created from a numeric block alone.
      Unidentified blocks are called CUSTOM BLOCKS.  The label "Family B" is RETIRED unless class
      identity is established.

