  cross-episode taxonomy with counts (directive classes + data-driven).
  Output: SOLAR_DRAWDOWN_ATLAS.md draft + machine tables (dd_episodes.csv,
  dd_trade_decomp.csv) in runs/SM02_DD_ATLAS/out/.
