status: APPEND-ONLY, written before the corrected check was run. The phase-0 B1 gate, the
  regime construction and the phase-2 quintile tables are already run and stand unchanged
  (out/regime.txt, out/quintiles.csv). Only the VERDICT rule is corrected.

the defect: my verdict code under-implemented my own spec.
  The spec required, verbatim: "A variable also has to pass a MECHANICAL coherence check: the
  era split must be driven by the variable actually having moved between the eras, not by a
  coincidental correlation." The code implemented only the first half of the rule - top
  quintile positive pre-2022 at t >= 1.65 - and printed "QUALIFYING VARIABLES: R5_volume".
  R5_volume passes that half and fails the coherence requirement on every count:
    top quintile pre-2022 : n = 750, mean $84, t = 2.13   <- the half that was implemented
    top quintile post-2022: n = 159, mean $15, t = 0.04   <- essentially ZERO in the modern era
    median moved between eras by a factor of 1.02, and the top-quintile share is 18.6 % pre
    against 14.2 % post
  So R5 is a variable whose top quintile earns in the OLD era and not the new one. It is the
  opposite of an explanation for a modern-only edge, and calling it "REGIME" was wrong.

the corrected verdict rule, strictly harder than the printed one:
  A variable QUALIFIES only if ALL of the following hold.
   (a) top-quintile pre-2022: mean > 0 and t >= 1.65   [the original half]
   (b) top-quintile post-2022: mean > 0 and t >= 1.65  [the edge must live in the SAME state
       in both eras - otherwise the variable does not locate the modern edge at all]
   (c) the variable actually MOVED between the eras, evidenced by the era medians or the
       top-quintile occupancy shares differing materially
  Plus a PERMUTATION MULTIPLICITY CHECK, the same instrument W55's amendment_1 added: the scan
  is 6 variables x 5 quintiles x 2 eras = 60 cells, so a handful of |t| > 2 is expected by
  chance. Bucket memberships are held fixed, B-MOM's daily P&L is permuted 500 times WITHIN
  ERA (so the era means are preserved and only the regime alignment is destroyed), and the
  observed count of cells at t >= 1.65 is compared against that null.

what the phase-2 tables already show, unchanged by this amendment (FACT):
  top-quintile pre-2022 t by variable: R1_range_pts 0.49 | R1b_range_pct -0.08 | R2_price 1.41
  | R3_varratio -0.18 | R4_gap_share -1.45 | R5_volume 2.13
  And the mechanically obvious candidate is measured directly: B-MOM's friction is a FIXED
  2.872 ticks = $14.36 per round turn, which was 1.70 % of the median daily RTH range pre-2022
  and 0.28 % after - a 6x mechanical change, exactly the shape that would explain a
  modern-only edge. But the variable that carries it, R1_range_pts, gives t = 0.49 pre-2022 in
  its own top quintile: in the pre-2022 sessions with the LARGEST trailing ranges, where
  friction was least binding, B-MOM earned $22/day at t = 0.49. The obvious mechanism is
  measured and it does not rescue the pre-2022 era.
outputs: unchanged, plus the corrected verdict block and the multiplicity block in
