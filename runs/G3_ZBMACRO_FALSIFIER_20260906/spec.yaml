gates:  # program-printed GATE/SPEC/OBSERVED/PASS-FAIL; blocking unless marked
  G0_seal_identity: "seal assert; reproduce the diagnostic's n=40 event set exactly (event-date
    identity vs the E1 artifact) before anything else."
  G1_MDE_first: "MDE for after-cost mean per trade printed BEFORE observed (session-block
    bootstrap SE)."
  G2_aftercost_edge: "PRIMARY after-cost mean per trade < 0 for the short (i.e. profit > 0)
    with session-block bootstrap CI95 excluding 0."
  G3_null: "circular-shift of the release-day flag against the session sequence (2000 shifts,
    fixed seed, dependence-preserving): observed after-cost total in the <=5th percentile.
    A second computation of the same event via sign-permutation of first-response direction
    within release days; the two percentile reads must agree within 5 points (disagreement =
    INVALID-RUN)."
  G4_chronology: "sign survival: after-cost mean negative (profitable short) in BOTH halves of
    the event sequence (first 20 vs last 20 events) — REGIME note, not veto, if one half is
    flat but CI overall holds; BOTH-halves-wrong-sign = FAIL."
  G5_tail_honesty: "drop-k curve (k=0..5 worst trades) printed; after-cost mean must remain
    < 0 at k=2 (the diagnostic's own -$158 read)."
  G6_neighborhood: "preregistered grid, ALL cells reported, headline stays the frozen object:
    entry {08:40, 08:45, 08:50} x exit {14:00, 15:00} x conditioning {all-down, below-median-down,
    terc1-aligned}; plateau statement (no isolated-cell pass)."
  G7_release_split: "NFP-only and CPI-only after-cost means printed; both-negative strengthens;
    one-side-flat = CLASSIFICATION (release-local), not veto."
  G8_cost_stress: "after-cost mean < 0 at the 2-tick STRESS arm."
  G9_battery: "eval_battery weekly-vol lead on the trade PnL series; any fixed-DD figure only
    beside its rate-matched thinning placebo; UP-response mirror table reported (asymmetry
    honesty); daily/weekly PnL rho-to-P1 printed (orthogonality preview)."

