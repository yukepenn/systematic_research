# 3. TRAPS NAMED BEFORE RUNNING
# ==================================================================================================
traps:
  - "DOUBLE COUNTING: the $15,800-in-one-minute and the -$74.18/wk figures are one measurement.
     Named in section 0. They may never be cited as two pieces of evidence."
  - "n=378 trades over ~243 weeks. Weekly t-statistics on a 1.5-trade-per-week strategy are
     fragile; a block bootstrap on the weekly difference series is the test and the t is a
     diagnostic printed beside it."
  - "The 58 tick sessions are NOT a random sample of history - they are what was exported, and
     s20260525 is quarantined. Any sub-second number inherits that selection and the report says so."
  - "SURVIVORSHIP: the XM trade panel excludes sessions that never armed (no 09:31 or no 09:45
     bar). The decay curve must be computed on the SAME armed-session set at every delay, never
     re-derived per delay, or a session could enter one arm and not another."
  - "The 09:45 decision reads ES, RTY and YM. In NT8 these are separate BarsInProgress series. If
     a secondary series is stale at 09:45:00 live, the live decision differs from the backtest
     decision for a reason that has nothing to do with latency. The staleness rule
     (MAXSTALE = 3 sessions, export_xm_reference.py:39,:89-93) is a SESSION-level rule and does
     not protect against intraday staleness. This is reported as an open execution risk whatever
     the decay curve says."
  - "A shallow sub-second decay does not prove the fill is achievable - it proves the PRICE does
     not move much. Queue position, order rejection, and partial fills are separate risks not
     measured by any price series and are not claimed to be."

